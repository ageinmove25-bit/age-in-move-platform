  const [selDate,setSelDate]=useState('');
  const [newEv,setNewEv]=useState({title:'',type:'session',patientId:'',time:'',repeat:'none',weeks:'8'});
  const [selEvent,setSelEvent]=useState(null);
  const [sessionFor,setSessionFor]=useState(null);
  const [confirmDel,setConfirmDel]=useState(false);
  const [evErr,setEvErr]=useState('');
  const activePatients=patients.filter(isActive);
  const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
  const firstDow=(y,m)=>(new Date(y,m,1).getDay()+6)%7;
  const totalDays=daysInMonth(cur.y,cur.m);
  const offset=firstDow(cur.y,cur.m);
  const prevDays=daysInMonth(cur.y,cur.m-1);
  const monthName=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][cur.m];
  const cells=[];
  for(let i=0;i<offset;i++) cells.push({day:prevDays-offset+1+i,cur:false});
  for(let d=1;d<=totalDays;d++) cells.push({day:d,cur:true});
  while(cells.length%7!==0) cells.push({day:cells.length-offset-totalDays+1,cur:false});
  const eventsOnDay=d=>events.filter(e=>{const[ey,em,ed]=e.date.split('-').map(Number);return ey===cur.y&&em-1===cur.m&&ed===d;}).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const typeColors={session:'#eff6ff',meeting:'#f0fdf4',training:'#fffbeb',group:'#f5f3ff'};
  const typeText={session:'#1d4ed8',meeting:'#15803d',training:'#b45309',group:'#6d28d9'};
  const evLabel=e=>`${e.done?EVENT_DONE[e.done].icon+' ':''}${e.time?e.time+' ':''}${e.title}`;
  const addEvent=()=>{
    const pat=newEv.type==='session'&&newEv.patientId?patients.find(p=>p.id===+newEv.patientId):null;
    const grp=newEv.type==='group'&&newEv.groupId?groups.find(g=>g.id===+newEv.groupId):null;
    if(newEv.type==='group'&&!grp){setEvErr('Escolha o grupo.');return;}
    const title=newEv.title.trim()||(pat?`${pat.name.split(' ')[0]} ${pat.name.split(' ').slice(-1)[0]} - Sessão`:grp?`Grupo: ${grp.name}`:'');
    if(!selDate){setEvErr('Escolha a data.');return;}
    if(!title){setEvErr('Indique um título ou selecione um cliente.');return;}
    const weeks=Math.max(1,Math.min(52,+newEv.weeks||1));
    const base={title,type:newEv.type,color:typeText[newEv.type]||'#2563eb'};
    if(newEv.time) base.time=newEv.time;
    if(pat) base.patientId=pat.id;
    if(grp) base.groupId=grp.id;
    let dates=[selDate];
    if(newEv.repeat==='weekly') dates=Array.from({length:weeks},(_,i)=>addDaysISO(selDate,i*7));
    if(newEv.repeat==='biweekly') dates=Array.from({length:Math.ceil(weeks/2)},(_,i)=>addDaysISO(selDate,i*14));
    if(newEv.repeat==='twice') dates=Array.from({length:weeks},(_,i)=>[addDaysISO(selDate,i*7),addDaysISO(selDate,i*7+3)]).flat();
    const seriesId=dates.length>1?'s'+Date.now():undefined;
    addEvents(dates.map(d=>({...base,date:d,seriesId})));
    setShowModal(false);setEvErr('');setNewEv({title:'',type:'session',patientId:'',time:'',repeat:'none',weeks:'8'});
  };
  const removeEvent=(e,series)=>{
    if(series&&e.seriesId) setEvents(es=>es.filter(x=>!(x.seriesId===e.seriesId&&x.date>=e.date&&!x.done)));
    else setEvents(es=>es.filter(x=>x.id!==e.id));
    setSelEvent(null);setConfirmDel(false);
  };
  const selPatient=selEvent&&selEvent.patientId?patients.find(p=>p.id===selEvent.patientId):null;
  const seriesLeft=selEvent&&selEvent.seriesId?events.filter(x=>x.seriesId===selEvent.seriesId&&x.date>=selEvent.date&&!x.done).length:0;
  return(
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div><h2 style={{fontSize:22,fontWeight:800,color:'#0f172a'}}>Calendário Clínico</h2><p style={{color:'#64748b',fontSize:14}}>{monthName} {cur.y}</p></div>
        <div style={{display:'flex',gap:10}}>
          <button className="btn btn-secondary btn-sm" onClick={()=>setCur(c=>{const m=c.m===0?11:c.m-1,y=c.m===0?c.y-1:c.y;return{y,m};})}>← Anterior</button>
          <button className="btn btn-secondary btn-sm" onClick={()=>setCur({y:NOW.getFullYear(),m:NOW.getMonth()})}>Hoje</button>
          <button className="btn btn-secondary btn-sm" onClick={()=>setCur(c=>{const m=c.m===11?0:c.m+1,y=c.m===11?c.y+1:c.y;return{y,m};})}>Seguinte →</button>
          <button className="btn btn-primary btn-sm" onClick={()=>{const sameMonth=cur.y===NOW.getFullYear()&&cur.m===NOW.getMonth();setSelDate(sameMonth?todayISO():`${cur.y}-${String(cur.m+1).padStart(2,'0')}-01`);setShowModal(true);}}>+ Evento</button>
        </div>
      </div>
      <div className="card">
        <div className="cal-header">{['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=><div key={d} className="cal-dow">{d}</div>)}</div>
        <div className="cal-grid">
          {cells.map((c,i)=>{
            const evs=c.cur?eventsOnDay(c.day):[];
            const isToday=c.cur&&cur.y===NOW.getFullYear()&&cur.m===NOW.getMonth()&&c.day===NOW.getDate();
            return(
              <div key={i} className={`cal-day${isToday?' today':''}${!c.cur?' other-month':''}`}
                onClick={()=>{if(c.cur){setSelDate(`${cur.y}-${String(cur.m+1).padStart(2,'0')}-${String(c.day).padStart(2,'0')}`);setShowModal(true);}}}>
                <div className="day-num" style={{color:isToday?'#4361EE':'#475569',fontWeight:isToday?800:700}}>{c.day}</div>
                {evs.map(e=><div key={e.id} className="cal-event" title={e.title} onClick={ev=>{ev.stopPropagation();setSelEvent(e);setConfirmDel(false);}}
                  style={{cursor:'pointer',background:e.done==='missed'?'#fef2f2':e.done==='cancelled'?'#f1f5f9':typeColors[e.type]||'#f1f5f9',color:e.done==='missed'?'#b91c1c':e.done==='cancelled'?'#94a3b8':typeText[e.type]||'#475569',textDecoration:e.done==='cancelled'?'line-through':'none',opacity:e.done==='done'?.75:1}}>{evLabel(e)}</div>)}
              </div>
            );
          })}
        </div>
      </div>
      {(()=>{const monthEvs=events.filter(e=>{const[ey,em]=e.date.split('-').map(Number);return ey===cur.y&&em-1===cur.m;}).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));return(
        <div className="card mobile-only" style={{marginTop:12}}>
          <div className="card-title" style={{marginBottom:8}}>Eventos de {monthName}</div>
          {monthEvs.length===0&&<p style={{fontSize:14,color:'#64748b'}}>Sem eventos este mês. Toque num dia para adicionar.</p>}
          {monthEvs.map(e=>(
            <div key={e.id} onClick={()=>{setSelEvent(e);setConfirmDel(false);}} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:'1px solid #f1f5f9',cursor:'pointer'}}>
              <div style={{width:4,alignSelf:'stretch',borderRadius:2,background:typeText[e.type]||'#64748b'}}/>
              <div style={{width:58,fontSize:13,fontWeight:700,color:'#475569'}}>{fmtDate(e.date).slice(0,5)}{e.time&&<div style={{fontWeight:400,fontSize:12}}>{e.time}</div>}</div>
              <div style={{flex:1,fontSize:14,fontWeight:600,color:'#0f172a'}}>{e.title}</div>
              {e.done&&<span className={`badge badge-${EVENT_DONE[e.done].badge}`}>{EVENT_DONE[e.done].label}</span>}
            </div>
          ))}
        </div>);})()}
      <div style={{display:'flex',gap:16,marginTop:8,flexWrap:'wrap'}}>
        {[['session','Sessão','#eff6ff','#1d4ed8'],['group','Grupo','#f5f3ff','#6d28d9'],['meeting','Reunião','#f0fdf4','#15803d'],['training','Formação','#fffbeb','#b45309']].map(([t,l,bg,col])=>(
          <div key={t} style={{display:'flex',alignItems:'center',gap:6,fontSize:13}}><div style={{width:12,height:12,borderRadius:3,background:bg,border:`1px solid ${col}`}}/><span style={{color:'#64748b'}}>{l}</span></div>
        ))}
        <span style={{fontSize:13,color:'#64748b'}}>✓ realizada · ✗ falta</span>
      </div>
      {showModal&&(
        <Modal title="Novo evento" onClose={()=>setShowModal(false)}>
          {evErr&&<div className="alert alert-warning">{evErr}</div>}
          <div className="grid-2">
            <div className="form-group"><label>Data *</label><input type="date" value={selDate} onChange={e=>setSelDate(e.target.value)}/></div>
            <div className="form-group"><label>Hora</label><input type="time" value={newEv.time} onChange={e=>setNewEv(v=>({...v,time:e.target.value}))}/></div>
          </div>
          <div className="form-group"><label>Tipo</label>
            <select value={newEv.type} onChange={e=>setNewEv(v=>({...v,type:e.target.value}))}>
              <option value="session">Sessão com cliente</option><option value="group">Sessão de grupo</option><option value="meeting">Reunião</option><option value="training">Formação</option>
            </select>
          </div>
          {newEv.type==='group'&&<div className="form-group"><label>Grupo</label><select value={newEv.groupId||''} onChange={e=>{const g=groups.find(x=>x.id===+e.target.value);setNewEv(v=>({...v,groupId:e.target.value,time:v.time||(g&&g.time)||''}));}}><option value="">Selecionar...</option>{groups.map(g=><option key={g.id} value={g.id}>{g.name} ({g.patientIds.length}/{g.capacity})</option>)}</select></div>}
          {newEv.type==='session'&&<div className="form-group"><label>Cliente</label><select value={newEv.patientId} onChange={e=>{const p=patients.find(x=>x.id===+e.target.value);setNewEv(v=>({...v,patientId:e.target.value,repeat:p&&v.repeat==='none'&&p.frequency==='weekly'?'weekly':p&&v.repeat==='none'&&p.frequency==='biweekly'?'biweekly':p&&v.repeat==='none'&&p.frequency==='3week'?'twice':v.repeat}));}}><option value="">Selecionar...</option>{activePatients.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>}
          <div className="form-group"><label>Título{newEv.type==='session'?' (opcional se escolher cliente)':' *'}</label><input value={newEv.title} onChange={e=>setNewEv(v=>({...v,title:e.target.value}))} placeholder="Descrição do evento"/></div>
          <div className="grid-2">
            <div className="form-group"><label>Repetir</label><select value={newEv.repeat} onChange={e=>setNewEv(v=>({...v,repeat:e.target.value}))}>{Object.entries(REPEAT).map(([k,r])=><option key={k} value={k}>{r.label}</option>)}</select></div>
            {newEv.repeat!=='none'&&<div className="form-group"><label>Durante (semanas)</label><input type="number" min={1} max={52} value={newEv.weeks} onChange={e=>setNewEv(v=>({...v,weeks:e.target.value}))}/></div>}
          </div>
          {newEv.repeat!=='none'&&<p style={{fontSize:12.5,color:'#64748b',marginTop:-6}}>Vão ser criados {newEv.repeat==='weekly'?(+newEv.weeks||1):newEv.repeat==='biweekly'?Math.ceil((+newEv.weeks||1)/2):(+newEv.weeks||1)*2} eventos a partir de {fmtDate(selDate)}.</p>}
          <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:20}}>
            <button className="btn btn-secondary" onClick={()=>setShowModal(false)}>Cancelar</button>
            <button className="btn btn-primary" onClick={addEvent}>Criar</button>
          </div>
        </Modal>
      )}
      {selEvent&&!sessionFor&&!groupFor&&(
        <Modal title={selEvent.title} onClose={()=>setSelEvent(null)}>
          <div style={{fontSize:14,color:'#334155',lineHeight:1.8}}>
            <div><strong>Data:</strong> {fmtDate(selEvent.date)}{selEvent.time?` às ${selEvent.time}`:''}</div>
            <div><strong>Tipo:</strong> {selEvent.type==='session'?'Sessão com cliente':selEvent.type==='group'?'Sessão de grupo':selEvent.type==='meeting'?'Reunião':'Formação'}</div>
            {selEvent.groupId&&(()=>{const g=groups.find(x=>x.id===selEvent.groupId);return g?<div><strong>Grupo:</strong> {g.name} · {g.patientIds.length}/{g.capacity} participantes</div>:null;})()}
            {selPatient&&<div><strong>Cliente:</strong> {selPatient.name} {!isActive(selPatient)&&statusBadge(selPatient)}</div>}
            {selEvent.seriesId&&<div><strong>Série:</strong> {seriesLeft} eventos por realizar a partir deste</div>}
            {selEvent.done&&<div><strong>Estado:</strong> <span className={`badge badge-${EVENT_DONE[selEvent.done].badge}`}>{EVENT_DONE[selEvent.done].label}</span></div>}
          </div>
          {selPatient&&!selEvent.done&&isActive(selPatient)&&(
            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:14}}>
              <button className="btn btn-primary" onClick={()=>setSessionFor({status:'done'})}>✓ Registar sessão</button>
              <button className="btn btn-secondary" onClick={()=>setSessionFor({status:'missed'})}>Marcar falta</button>
              <button className="btn btn-secondary" onClick={()=>setSessionFor({status:'cancelled'})}>Cancelada</button>
            </div>
          )}
          {selEvent.groupId&&!selEvent.done&&groups.find(x=>x.id===selEvent.groupId)&&(
            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:14}}>
              <button className="btn btn-primary" onClick={()=>setGroupFor(groups.find(x=>x.id===selEvent.groupId))}>✓ Registar sessão de grupo</button>
              <button className="btn btn-secondary" onClick={()=>{setEvents(es=>es.map(x=>x.id===selEvent.id?{...x,done:'cancelled'}:x));setSelEvent(null);}}>Cancelada</button>
            </div>
          )}
          {confirmDel&&<div className="alert alert-warning" style={{marginTop:14,display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
            <span style={{flex:1,minWidth:160}}>Eliminar {selEvent.seriesId&&seriesLeft>1?'só este evento ou a série?':'este evento?'}</span>
            <button className="btn btn-sm btn-secondary" onClick={()=>setConfirmDel(false)}>Cancelar</button>
            <button className="btn btn-sm btn-danger" onClick={()=>removeEvent(selEvent,false)}>Só este</button>
            {selEvent.seriesId&&seriesLeft>1&&<button className="btn btn-sm btn-danger" onClick={()=>removeEvent(selEvent,true)}>Este e os seguintes ({seriesLeft})</button>}
          </div>}
          <div style={{display:'flex',gap:10,justifyContent:'space-between',marginTop:20,flexWrap:'wrap'}}>
            <button className="btn btn-danger" onClick={()=>setConfirmDel(true)}>Eliminar</button>
            <div style={{display:'flex',gap:10}}>
              {selPatient&&openPatient&&<button className="btn btn-secondary" onClick={()=>{const id=selPatient.id;setSelEvent(null);openPatient(id);}}>Ver cliente</button>}
              <button className="btn btn-secondary" onClick={()=>setSelEvent(null)}>Fechar</button>
            </div>
          </div>
        </Modal>
      )}
      {groupFor&&selEvent&&<GroupSessionModal group={groupFor} eventId={selEvent.id} defaultDate={selEvent.date} onClose={()=>{setGroupFor(null);setSelEvent(null);}}/>}
      {sessionFor&&selPatient&&<SessionModal patient={selPatient} eventId={selEvent.id} defaultDate={selEvent.date} defaultStatus={sessionFor.status} onClose={()=>{setSessionFor(null);setSelEvent(null);}}/>}
    </div>
  );
}

// ─── BIBLIOTECA: ebooks e PowerPoints para o profissional ──────────────────
const PPTS=[
  {slug:'santos-populares',titulo:'Santos Populares',subtitulo:'Manjericos, sardinhas e arraiais'},
  {slug:'viagem-por-portugal',titulo:'Viagem por Portugal',subtitulo:'Do Minho ao Algarve, sem sair da cadeira'},
  {slug:'cozinha-da-avo',titulo:'Na Cozinha da Avó',subtitulo:'Sabores, cheiros e receitas de família'},
  {slug:'quatro-estacoes',titulo:'As Quatro Estações',subtitulo:'O ritmo do ano à nossa volta'},
  {slug:'musica-e-memorias',titulo:'Música e Memórias',subtitulo:'Fado, bailaricos e canções de sempre'},
  {slug:'natal-em-familia',titulo:'Natal em Família',subtitulo:'Tradições, sabores e memórias da quadra'},
];
const PPT_STEPS=['Orientação','Aquecimento','Memorizar','Perguntas','Intruso','Qual desapareceu?','Provérbios','Pôr por ordem','Movimento com dupla tarefa','Cálculo','Conversa (reminiscência)','Relaxamento','Soluções'];
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

function EbookActivity({a,mod,ex,onAdd}){
  const [open,setOpen]=useState(false);
  return(
    <div style={{border:'1px solid #e2e8f0',borderRadius:12,padding:'12px 14px',background:'#fff'}}>
      <div style={{display:'flex',gap:10,alignItems:'flex-start',cursor:'pointer'}} onClick={()=>setOpen(o=>!o)}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:15}}>{a.nome}</div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:6}}>
            <span className="badge badge-gray">⏱ {a.duracao}</span>
            <span className={`badge badge-${a.nivel==='Fácil'?'green':a.nivel==='Difícil'?'red':'yellow'}`}>{a.nivel}</span>
            <span className="badge badge-gray">{a.posicao}</span>
            {(a.cognitivo||[]).map(c=><span key={c} className="badge badge-purple">{c}</span>)}
          </div>
        </div>
        <span style={{color:'#94a3b8',fontSize:12,marginTop:4}}>{open?'▲':'▼'}</span>
      </div>
      {open&&(
        <div style={{marginTop:12,fontSize:14,color:'#334155',lineHeight:1.6,display:'flex',flexDirection:'column',gap:10}}>
          <div><strong>Objetivo:</strong> {a.objetivo}</div>
          <div><strong>Materiais:</strong> {a.materiais}</div>
          <div><strong>Como fazer:</strong><ol style={{margin:'4px 0 0 20px'}}>{(a.passos||[]).map((x,i)=><li key={i}>{x}</li>)}</ol></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}} className="lib-ease">
            <div style={{background:'#f0fdf4',borderRadius:8,padding:'8px 10px'}}><strong style={{color:'#15803d'}}>Para facilitar</strong><div>{a.facilitar}</div></div>
            <div style={{background:'#fef2f2',borderRadius:8,padding:'8px 10px'}}><strong style={{color:'#b91c1c'}}>Para dificultar</strong><div>{a.dificultar}</div></div>
          </div>
          {a.dica&&<div style={{background:'#eef1ff',borderRadius:8,padding:'8px 10px'}}>💡 {a.dica}</div>}
          <div><button className="btn btn-sm btn-primary" onClick={()=>onAdd(mod,ex)}>＋ Juntar ao plano de um cliente</button></div>
        </div>
      )}
    </div>
  );
}

function LibraryPage({openPatient}){
  const {patients}=useStore();
  const [tab,setTab]=useState('ebooks');
  const [vol,setVol]=useState(null);
  const [q,setQ]=useState('');
  const [adding,setAdding]=useState(null);
  const [pickId,setPickId]=useState('');
  const [planFor,setPlanFor]=useState(null);
  const [check,setCheck]=useState(null);
  const active=patients.filter(isActive);
  const sel=vol!=null?EBOOK_MODULES.find(m=>m.ebook.vol===vol):null;
  const results=q.trim()?EBOOK_MODULES.flatMap(m=>m.ebook.atividades.map((a,i)=>({a,mod:m,ex:m.exercises_list[i]}))).filter(({a,mod})=>norm([a.nome,a.objetivo,(a.cognitivo||[]).join(' '),a.materiais,mod.ebook.titulo].join(' ')).includes(norm(q.trim()))):null;
  const onAdd=(mod,ex)=>{setAdding({mod,ex});setPickId('');setCheck(null);};
  const checkP=check&&patients.find(p=>p.id===check.id);
  const added=checkP&&(checkP.plan||[]).length>check.before;
  return(
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,gap:12,flexWrap:'wrap'}}>
        <div><h2 style={{fontSize:22,fontWeight:800,color:'#0f172a'}}>Biblioteca</h2><p style={{color:'#64748b',fontSize:14}}>Materiais de trabalho: {EBOOKS.length} ebooks com {EBOOKS.reduce((n,e)=>n+e.atividades.length,0)} atividades e {PPTS.length} apresentações para sessões de grupo</p></div>
        {tab==='ebooks'&&<input placeholder="🔍 Pesquisar atividades (ex.: memória, equilíbrio, bola)..." style={{width:320}} value={q} onChange={e=>{setQ(e.target.value);}} aria-label="Pesquisar atividades"/>}
      </div>
      <div className="tab-bar">
        {[['ebooks',`Ebooks (${EBOOKS.length})`],['ppt',`PowerPoints (${PPTS.length})`],['paths',`Percursos (${PATHWAYS.length})`]].map(([id,l])=><div key={id} className={`tab${tab===id?' active':''}`} onClick={()=>setTab(id)}>{l}</div>)}
      </div>
      {added&&<div className="alert alert-success" style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}><span style={{flex:1}}>✓ Juntado ao plano de {checkP.name} ({pl((checkP.plan||[]).length,'exercício','exercícios')}).</span><button className="btn btn-sm btn-secondary" onClick={()=>openPatient(checkP.id)}>Ver cliente</button></div>}
      {tab==='ebooks'&&results&&(
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <p style={{fontSize:14,color:'#64748b'}}>{results.length} {results.length===1?'atividade encontrada':'atividades encontradas'} para "{q}"</p>
          {results.map(({a,mod,ex})=><div key={ex.id}><div style={{fontSize:12,color:mod.color,fontWeight:700,marginBottom:4}}>{mod.name}</div><EbookActivity a={a} mod={mod} ex={ex} onAdd={onAdd}/></div>)}
        </div>
      )}
      {tab==='ebooks'&&!results&&!sel&&(
        <div className="grid-3">
          {EBOOK_MODULES.map(m=>{const e=m.ebook;return(
            <div key={e.slug} className="card" style={{borderTop:`5px solid ${e.cor}`,display:'flex',flexDirection:'column',gap:8,marginBottom:0}}>
              <div style={{fontSize:12,fontWeight:700,color:e.cor,letterSpacing:'.05em',textTransform:'uppercase'}}>Volume {e.vol}</div>
              <div style={{fontWeight:800,fontSize:18,color:'#0f172a'}}>{e.titulo}</div>
              <div style={{fontSize:13,color:'#64748b',flex:1}}>{e.subtitulo}</div>
              <div style={{fontSize:12.5,color:'#475569'}}>{e.atividades.length} atividades · {[...new Set(e.atividades.flatMap(a=>a.cognitivo||[]))].slice(0,3).join(', ')}</div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}}>
                <button className="btn btn-sm btn-primary" onClick={()=>setVol(e.vol)}>Ver atividades</button>
                <a className="btn btn-sm btn-secondary" href={e.pdf} target="_blank" rel="noopener" style={{textDecoration:'none'}}>📄 Abrir PDF</a>
              </div>
            </div>);})}
        </div>
      )}
      {tab==='ebooks'&&!results&&sel&&(()=>{const e=sel.ebook;return(
        <div>
          <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:14,flexWrap:'wrap'}}>

// ─── GRUPOS (sessões em grupo pequeno, com limite de participantes) ─────────
const GROUP_TYPES={fisico:{label:'Físico',badge:'green'},cognitivo:{label:'Cognitivo',badge:'purple'},misto:{label:'Misto',badge:'blue'}};
const WEEKDAYS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const groupSchedule=g=>g.weekday!=null&&g.weekday!==''?`${WEEKDAYS[g.weekday]}s${g.time?' às '+g.time:''}`:(g.time?`às ${g.time}`:'Sem horário fixo');
const pptTitle=slug=>(PPTS.find(t=>t.slug===slug)||{}).titulo||slug;
function nextWeekdayISO(wd){const d=new Date();d.setHours(12);const diff=((+wd)-d.getDay()+7)%7;d.setDate(d.getDate()+diff);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function GroupModal({group,onClose}){
  const {patients,addGroup,updateGroup,deleteGroup}=useStore();
  const active=patients.filter(p=>isActive(p)||(group&&group.patientIds.includes(p.id)));
  const [f,setF]=useState(()=>group?{...group,capacity:String(group.capacity),weekday:group.weekday==null?'':String(group.weekday)}:{name:'',type:'fisico',capacity:'6',patientIds:[],weekday:'',time:'',theme:'',notes:''});
  const [err,setErr]=useState('');
  const [confirmDel,setConfirmDel]=useState(false);
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const cap=Math.max(2,Math.min(12,+f.capacity||6));
  const toggle=id=>set('patientIds',f.patientIds.includes(id)?f.patientIds.filter(x=>x!==id):(f.patientIds.length>=cap?f.patientIds:[...f.patientIds,id]));
  const save=()=>{
    if(!f.name.trim()){setErr('Dê um nome ao grupo.');return;}
    if(+f.capacity<2||+f.capacity>12){setErr('O limite de participantes é entre 2 e 12.');return;}
    if(f.patientIds.length>cap){setErr(`O grupo tem ${f.patientIds.length} participantes e o limite é ${cap}.`);return;}
    const data={name:f.name.trim(),type:f.type,capacity:cap,patientIds:f.patientIds,weekday:f.weekday===''?null:+f.weekday,time:f.time,theme:f.theme,notes:f.notes.trim()};
    group?updateGroup(group.id,data):addGroup(data);onClose();
  };
  return(
    <Modal title={group?'Editar grupo':'Novo grupo'} onClose={onClose} wide>
      {err&&<div className="alert alert-warning">{err}</div>}
      {confirmDel&&<ConfirmBar text="Eliminar este grupo? As sessões já registadas ficam no historial de cada cliente; os eventos futuros do grupo são apagados." onNo={()=>setConfirmDel(false)} onYes={()=>{deleteGroup(group.id);onClose();}}/>}
      <div className="grid-2">
        <div className="form-group"><label>Nome *</label><input value={f.name} onChange={e=>set('name',e.target.value)} placeholder="Ex.: Equilíbrio em movimento"/></div>
        <div className="form-group"><label>Tipo</label><select value={f.type} onChange={e=>set('type',e.target.value)}>{Object.entries(GROUP_TYPES).map(([k,t])=><option key={k} value={k}>{t.label}</option>)}</select></div>
        <div className="form-group"><label>Limite de participantes (2–12)</label><input type="number" min={2} max={12} value={f.capacity} onChange={e=>set('capacity',e.target.value)}/></div>
        <div className="form-group"><label>Tema / material (opcional)</label><select value={f.theme} onChange={e=>set('theme',e.target.value)}><option value="">—</option>{PPTS.map(t=><option key={t.slug} value={t.slug}>PowerPoint: {t.titulo}</option>)}</select></div>
        <div className="form-group"><label>Dia da semana</label><select value={f.weekday} onChange={e=>set('weekday',e.target.value)}><option value="">Sem dia fixo</option>{WEEKDAYS.map((d,i)=><option key={i} value={i}>{d}</option>)}</select></div>
        <div className="form-group"><label>Hora</label><input type="time" value={f.time} onChange={e=>set('time',e.target.value)}/></div>
      </div>
      <Section title={`Participantes (${f.patientIds.length}/${cap})`}/>
      {active.length===0?<p style={{fontSize:14,color:'#64748b'}}>Não há clientes ativos.</p>:
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:6}}>
          {active.map(p=>{const on=f.patientIds.includes(p.id);const full=!on&&f.patientIds.length>=cap;return(
            <label key={p.id} style={{display:'flex',gap:8,alignItems:'center',fontWeight:400,fontSize:14,padding:'6px 8px',borderRadius:8,border:'1px solid '+(on?'#4361EE':'#e2e8f0'),background:on?'#eef1ff':'#fff',opacity:full?.45:1,cursor:full?'not-allowed':'pointer',margin:0}}>
              <input type="checkbox" checked={on} disabled={full} onChange={()=>toggle(p.id)}/>{p.name}
            </label>);})}
        </div>}
      {f.patientIds.length>=cap&&<p style={{fontSize:12.5,color:'#b45309',marginTop:6}}>Grupo completo. Aumente o limite para juntar mais participantes.</p>}
      <div className="form-group" style={{marginTop:12}}><label>Notas</label><textarea rows={2} value={f.notes} onChange={e=>set('notes',e.target.value)} placeholder="Objetivo do grupo, cuidados, material"/></div>
      <div style={{display:'flex',gap:10,justifyContent:'space-between',marginTop:16,flexWrap:'wrap'}}>
        {group?<button className="btn btn-danger" onClick={()=>setConfirmDel(true)}>Eliminar grupo</button>:<span/>}
        <div style={{display:'flex',gap:10}}><button className="btn btn-secondary" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={save}>Guardar</button></div>
      </div>
    </Modal>
  );
}

function GroupSessionModal({group,eventId,defaultDate,onClose}){
  const {patients,addGroupSession,prefs}=useStore();
  const members=group.patientIds.map(id=>patients.find(p=>p.id===id)).filter(Boolean);
  const [date,setDate]=useState(defaultDate||todayISO());
  const [duration,setDuration]=useState(String(prefs.duration||45));
  const [theme,setTheme]=useState(group.theme?pptTitle(group.theme):'');
  const [notes,setNotes]=useState('');
  const [att,setAtt]=useState(()=>Object.fromEntries(members.map(p=>[p.id,{present:true,performance:'Bom',note:'',incident:'',reason:''}])));
  const [err,setErr]=useState('');
  const setA=(id,k,v)=>setAtt(a=>({...a,[id]:{...a[id],[k]:v}}));
  const present=Object.values(att).filter(a=>a.present).length;
  const save=()=>{
    if(!date){setErr('Indique a data.');return;}
    if(!members.length){setErr('O grupo não tem participantes.');return;}
    addGroupSession(group,{date,duration,theme:theme.trim(),notes:notes.trim(),attendance:att,eventId});onClose();
  };
  return(
    <Modal title={`Sessão de grupo — ${group.name}`} onClose={onClose} wide>
      {err&&<div className="alert alert-warning">{err}</div>}
      <div className="grid-3">
        <div className="form-group"><label>Data</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
        <div className="form-group"><label>Duração (min)</label><input type="number" min={0} value={duration} onChange={e=>setDuration(e.target.value)}/></div>
        <div className="form-group"><label>Tema / atividade</label><input value={theme} onChange={e=>setTheme(e.target.value)} placeholder="Ex.: Circuito de equilíbrio"/></div>
      </div>
      <Section title={`Presenças (${present}/${members.length})`}/>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {members.map(p=>{const a=att[p.id];return(
          <div key={p.id} style={{border:'1px solid #e2e8f0',borderRadius:10,padding:'10px 12px',background:a.present?'#fff':'#fef2f2'}}>
            <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
              <div className="avatar" style={{background:p.avatar,width:30,height:30,fontSize:12}}>{p.initials}</div>
              <strong style={{flex:1,minWidth:140}}>{p.name}</strong>
              <div style={{display:'flex',gap:6}}>
                <button type="button" className={`btn btn-sm ${a.present?'btn-primary':'btn-secondary'}`} onClick={()=>setA(p.id,'present',true)}>Presente</button>
                <button type="button" className={`btn btn-sm ${!a.present?'btn-danger':'btn-secondary'}`} onClick={()=>setA(p.id,'present',false)}>Faltou</button>
              </div>
            </div>
            {a.present?(
              <div style={{display:'grid',gridTemplateColumns:'130px 150px 1fr',gap:8,marginTop:8}} className="gs-row">
                <select aria-label="Desempenho" value={a.performance} onChange={e=>setA(p.id,'performance',e.target.value)}>{['Excelente','Bom','Razoável','Fraco'].map(x=><option key={x}>{x}</option>)}</select>
                <select aria-label="Ocorrência" value={a.incident} onChange={e=>setA(p.id,'incident',e.target.value)}><option value="">Sem ocorrências</option>{INCIDENTS.map(x=><option key={x}>{x}</option>)}</select>
                <input aria-label="Observação" value={a.note} onChange={e=>setA(p.id,'note',e.target.value)} placeholder="Observação (opcional)"/>
              </div>
            ):(
              <input aria-label="Motivo da falta" style={{marginTop:8}} value={a.reason} onChange={e=>setA(p.id,'reason',e.target.value)} placeholder="Motivo da falta (opcional)"/>
            )}
          </div>);})}
      </div>
      <div className="form-group" style={{marginTop:12}}><label>Notas da sessão</label><textarea rows={2} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Como correu, ajustes para a próxima"/></div>
      <p style={{fontSize:12.5,color:'#64748b'}}>Cada participante fica com a sessão (ou a falta) no seu historial, e a assiduidade e os alertas são atualizados.</p>
      <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:12}}>
        <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={save}>Guardar sessão de grupo</button>
      </div>
    </Modal>
  );
}

function GroupScheduleModal({group,onClose}){
  const {addEvents}=useStore();
  const [start,setStart]=useState(group.weekday!=null&&group.weekday!==''?nextWeekdayISO(group.weekday):todayISO());
  const [time,setTime]=useState(group.time||'');
  const [weeks,setWeeks]=useState('8');
  const save=()=>{
    const n=Math.max(1,Math.min(52,+weeks||1));const seriesId='s'+Date.now();
    addEvents(Array.from({length:n},(_,i)=>({date:addDaysISO(start,i*7),time:time||undefined,title:`Grupo: ${group.name}`,type:'group',groupId:group.id,seriesId:n>1?seriesId:undefined,color:'#6d28d9'})));
    onClose();
  };
  return(
    <Modal title={`Agendar — ${group.name}`} onClose={onClose}>
      <div className="grid-3">
        <div className="form-group"><label>Primeira sessão</label><input type="date" value={start} onChange={e=>setStart(e.target.value)}/></div>
        <div className="form-group"><label>Hora</label><input type="time" value={time} onChange={e=>setTime(e.target.value)}/></div>
        <div className="form-group"><label>Semanas</label><input type="number" min={1} max={52} value={weeks} onChange={e=>setWeeks(e.target.value)}/></div>
      </div>
      <p style={{fontSize:13,color:'#64748b'}}>Vão ser criados {Math.max(1,Math.min(52,+weeks||1))} eventos semanais no calendário, a partir de {fmtDate(start)}.</p>
      <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:16}}><button className="btn btn-secondary" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={save}>Agendar</button></div>
    </Modal>
  );
}

  );

function ForumPage(){
  const {posts,setPosts,profile}=useStore();
  const me={author:profile.name,role:profile.role,avatar:'#4361EE',initials:initialsOf(profile.name.replace(/^(Dra?|Enf|Prof)\.?\s+/i,''))};
  const timeLabel=p=>p.createdAt?new Date(p.createdAt).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):p.time;
  const [showNew,setShowNew]=useState(false);
  const [reply,setReply]=useState({});
  const [newPost,setNewPost]=useState({title:'',body:''});
  const [expanded,setExpanded]=useState({});
  const submit=()=>{
    if(!newPost.title||!newPost.body) return;
    setPosts(p=>[{id:Date.now(),...me,title:newPost.title,body:newPost.body,createdAt:new Date().toISOString(),likes:0,replies:[]},...p]);
    setNewPost({title:'',body:''});setShowNew(false);
  };
  const addReply=pid=>{
    if(!reply[pid]) return;
    setPosts(ps=>ps.map(p=>p.id===pid?{...p,replies:[...p.replies,{author:me.author,initials:me.initials,avatar:me.avatar,text:reply[pid],createdAt:new Date().toISOString()}]}:p));
    setReply(r=>({...r,[pid]:''}));
  };
  return(
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div><h2 style={{fontSize:22,fontWeight:800,color:'#0f172a'}}>Fórum Clínico</h2><p style={{color:'#64748b',fontSize:14}}>{posts.length} tópicos</p></div>
        <button className="btn btn-primary" onClick={()=>setShowNew(s=>!s)}>+ Novo Tópico</button>
      </div>
      {showNew&&(
        <div className="card" style={{border:'2px solid #bfdbfe',marginBottom:16}}>
          <div className="card-title" style={{marginBottom:14}}>Criar Tópico</div>
          <div className="form-group"><label>Título</label><input value={newPost.title} onChange={e=>setNewPost(p=>({...p,title:e.target.value}))} placeholder="Título do tópico"/></div>
          <div className="form-group"><label>Conteúdo</label><textarea rows={4} value={newPost.body} onChange={e=>setNewPost(p=>({...p,body:e.target.value}))} placeholder="Descreva a sua questão..."/></div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <button className="btn btn-secondary" onClick={()=>setShowNew(false)}>Cancelar</button>
            <button className="btn btn-primary" onClick={submit}>Publicar</button>
          </div>
        </div>
      )}
      {posts.map(post=>(
        <div key={post.id} className="card" style={{marginBottom:12}}>
          <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
            <div className="avatar" style={{background:post.avatar}}>{post.initials}</div>
            <div style={{flex:1}}>
              <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8}}>
                <div><div style={{fontWeight:700,fontSize:16,marginBottom:2}}>{post.title}</div><div style={{fontSize:12,color:'#64748b'}}>{post.author} · {post.role} · {timeLabel(post)}</div></div>
                <span className="badge badge-blue" style={{fontSize:11,flexShrink:0}}>🔬 Clínico</span>
              </div>
              <p style={{margin:'10px 0',color:'#334155',fontSize:14,lineHeight:1.6}}>{post.body}</p>
              <div style={{display:'flex',gap:12}}>
                <button className="btn btn-sm btn-secondary" onClick={()=>setPosts(ps=>ps.map(p=>p.id===post.id?{...p,likes:p.likes+1}:p))}>👍 {post.likes}</button>
                <button className="btn btn-sm btn-secondary" onClick={()=>setExpanded(r=>({...r,[post.id]:!r[post.id]}))}>💬 {post.replies.length} respostas</button>
              </div>
              {expanded[post.id]&&(
                <div style={{marginTop:14,borderTop:'1px solid #f1f5f9',paddingTop:12}}>
                  {post.replies.map((r,i)=>(
                    <div key={i} style={{display:'flex',gap:10,marginBottom:10}}>
                      <div className="avatar" style={{background:r.avatar,width:30,height:30,fontSize:12}}>{r.initials}</div>
                      <div style={{flex:1,background:'#f8fafc',borderRadius:8,padding:'8px 12px'}}>
                        <div style={{fontSize:12,fontWeight:700}}>{r.author} <span style={{fontWeight:400,color:'#94a3b8'}}>· {timeLabel(r)}</span></div>
                        <div style={{fontSize:13,color:'#334155',marginTop:3}}>{r.text}</div>
                      </div>
                    </div>
                  ))}
                  <div style={{display:'flex',gap:8,marginTop:8}}>
                    <input placeholder="Escrever resposta..." value={reply[post.id]||''} onChange={e=>setReply(r=>({...r,[post.id]:e.target.value}))} style={{flex:1,padding:'7px 12px'}}/>
                    <button className="btn btn-primary btn-sm" onClick={()=>addReply(post.id)}>Responder</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function SettingsPage(){
  const store=useStore();
  const {profile,setProfile,prefs,setPrefs,patients,sessions,assessments,events,posts}=store;
  const [tab,setTab]=useState('profile');
  const [msg,setMsg]=useState(null);
  const [draft,setDraft]=useState(profile);
  const [pdraft,setPdraft]=useState({...DEFAULT_PREFS,...prefs});
  const fileRef=React.useRef(null);
  useEffect(()=>{setDraft(profile);},[profile]);
  useEffect(()=>{setPdraft({...DEFAULT_PREFS,...prefs});},[prefs]);
  const flash=(type,text)=>{setMsg({type,text});setTimeout(()=>setMsg(null),3500);};
  const saveProfile=()=>{if(!draft.name.trim()){flash('warning','O nome profissional é obrigatório.');return;}setProfile({...draft,name:draft.name.trim()});flash('success','✓ Perfil guardado!');};
  const savePrefs=()=>{const clean={duration:pdraft.duration,scale:pdraft.scale,declineAlerts:!!pdraft.declineAlerts,consentAlerts:!!pdraft.consentAlerts,reassessDays:Math.max(0,+pdraft.reassessDays||0),inactiveDays:Math.max(0,+pdraft.inactiveDays||0)};setPrefs(clean);flash('success','✓ Definições guardadas!');};
  const P=(k,label,type='text')=><div className="form-group"><label>{label}</label><input type={type} value={draft[k]||''} onChange={e=>setDraft(d=>({...d,[k]:e.target.value}))}/></div>;
  const Toggle=(k,label)=>(
    <div key={k} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 0',borderBottom:'1px solid #f1f5f9'}}>
      <span style={{fontSize:14,color:'#334155'}}>{label}</span>
      <input type="checkbox" checked={!!pdraft[k]} onChange={e=>setPdraft(d=>({...d,[k]:e.target.checked}))} style={{width:'auto',transform:'scale(1.3)'}}/>
    </div>
  );
  const doExport=()=>{downloadJSON(store.exportData(),`age-in-move-backup-${todayISO()}.json`);flash('success','✓ Backup descarregado.');};
  const doImport=e=>{
    const file=e.target.files&&e.target.files[0]; e.target.value='';
    if(!file) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const json=JSON.parse(r.result);
        const n=(json.data&&json.data.patients||[]).length;
        if(!confirm(`Importar este backup (${n} clientes)? Os dados atuais neste browser serão substituídos.`)) return;
        store.importData(json);flash('success','✓ Backup importado com sucesso.');
      }catch(err){flash('warning','Não foi possível importar: '+err.message);}
    };
    r.readAsText(file);
  };
  return(
    <div className="page" style={{maxWidth:760}}>
      <h2 style={{fontSize:22,fontWeight:800,color:'#0f172a',marginBottom:4}}>Definições</h2>
      <p style={{color:'#64748b',fontSize:14,marginBottom:20}}>Gerir perfil, preferências clínicas, alertas e dados</p>
      <div className="tab-bar">
        {[['profile','Perfil'],['clinical','Clínico e alertas'],['data','Dados & Backup'],['security','Segurança']].map(([id,l])=>(
          <div key={id} className={`tab${tab===id?' active':''}`} onClick={()=>setTab(id)}>{l}</div>
        ))}
      </div>
      {msg&&<div className={`alert alert-${msg.type}`}>{msg.text}</div>}
      {tab==='profile'&&(
        <div className="card">
          <div style={{display:'flex',gap:16,alignItems:'center',marginBottom:20,padding:'0 0 16px',borderBottom:'1px solid #f1f5f9'}}>
            <div className="avatar" style={{background:'#4361EE',width:64,height:64,fontSize:22}}>{initialsOf(profile.name.replace(/^(Dra?|Enf|Prof)\.?\s+/i,''))}</div>
            <div><div style={{fontWeight:700,fontSize:16}}>{profile.name}</div><div style={{color:'#64748b',fontSize:13}}>{profile.role} · {profile.license}</div></div>
          </div>
          <div className="grid-2">
            {P('name','Nome Profissional *')}
            {P('role','Profissão')}
            {P('license','Nº Cédula')}
            {P('email','Email','email')}
            {P('phone','Telefone')}
            {P('specialty','Especialidade')}
            {P('institution','Instituição')}
          </div>
          <button className="btn btn-primary" onClick={saveProfile}>Guardar Alterações</button>
        </div>
      )}
      {tab==='clinical'&&(
        <div className="card">
          <div className="card-title" style={{marginBottom:16}}>Preferências clínicas</div>
          <div className="grid-2">
            <div className="form-group"><label>Duração padrão da sessão</label><select value={pdraft.duration} onChange={e=>setPdraft(d=>({...d,duration:e.target.value}))}><option value="30">30 min</option><option value="45">45 min</option><option value="60">60 min</option></select></div>
            <div className="form-group"><label>Escala cognitiva na lista de clientes</label><select value={pdraft.scale} onChange={e=>setPdraft(d=>({...d,scale:e.target.value}))}><option value="mmse">MMSE</option><option value="moca">MoCA</option></select></div>
          </div>
          <div className="card-title" style={{margin:'10px 0 6px'}}>Alertas no dashboard ("Precisa de atenção")</div>
          <p style={{fontSize:13,color:'#64748b',marginBottom:6}}>Os alertas aparecem quando abre a app; não são enviadas notificações para o telemóvel.</p>
          {Toggle('declineAlerts','Declínio entre as duas últimas avaliações (ex.: MMSE −3, Barthel −10, TUG +3 s)')}
          {Toggle('consentAlerts','Clientes sem consentimento informado registado')}
          <div className="grid-2" style={{marginTop:12}}>
            <div className="form-group"><label>Reavaliação em atraso ao fim de (dias)</label><input type="number" min={0} value={pdraft.reassessDays} onChange={e=>setPdraft(d=>({...d,reassessDays:e.target.value}))}/></div>
            <div className="form-group"><label>Sem sessões nem agendamento há mais de (dias)</label><input type="number" min={0} value={pdraft.inactiveDays} onChange={e=>setPdraft(d=>({...d,inactiveDays:e.target.value}))}/></div>
          </div>
          <p style={{fontSize:12.5,color:'#64748b',marginTop:-4}}>0 desliga o alerta. Duas faltas seguidas, quedas nas sessões dos últimos 30 dias e sobrecarga intensa do cuidador (Zarit &gt; 56) aparecem sempre.</p>
          <button className="btn btn-primary" style={{marginTop:12}} onClick={savePrefs}>Guardar</button>
        </div>
      )}
      {tab==='data'&&(
        <div>
          <div className="card">
            <div className="card-title" style={{marginBottom:8}}>Dados guardados neste browser</div>
            <p style={{fontSize:13,color:'#64748b',marginBottom:14}}>Tudo o que regista fica guardado automaticamente neste browser, neste computador. Não é enviado para nenhum servidor.</p>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(110px,1fr))',gap:10,marginBottom:6}}>
              {[['Clientes',patients.length],['Sessões',sessions.length],['Avaliações',assessments.length],['Eventos',events.length],['Grupos',(store.groups||[]).length]].map(([l,v])=>(
                <div key={l} style={{textAlign:'center',padding:12,background:'#f8fafc',borderRadius:8,border:'1px solid #e2e8f0'}}><div style={{fontSize:24,fontWeight:800}}>{v}</div><div style={{fontSize:12,color:'#64748b'}}>{l}</div></div>
              ))}
            </div>
          </div>
          <div className="card">
            <div className="card-title" style={{marginBottom:8}}>Backup</div>
            <p style={{fontSize:13,color:'#64748b',marginBottom:14}}>Limpar o histórico do browser apaga estes dados. Descarregue um backup regularmente e guarde-o em local seguro (ex.: OneDrive). Também pode usá-lo para passar os dados para outro computador.</p>
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              <button className="btn btn-primary" onClick={doExport}>⬇ Exportar backup (JSON)</button>
              <button className="btn btn-secondary" onClick={()=>fileRef.current&&fileRef.current.click()}>⬆ Importar backup</button>
              <input ref={fileRef} type="file" accept="application/json,.json" style={{display:'none'}} onChange={doImport}/>
            </div>
          </div>
          <div className="alert alert-warning"><strong>RGPD:</strong> estes dados são de saúde (categoria especial). Use este computador apenas com conta protegida por password e guarde os ficheiros de backup de forma cifrada. Não partilhe backups por email.</div>
          <div className="card" style={{border:'1px solid #fecaca',background:'#fef2f2'}}>
            <div style={{fontWeight:700,color:'#991b1b',marginBottom:10}}>⚠️ Zona de Perigo</div>
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              <button className="btn btn-secondary btn-sm" onClick={()=>{if(confirm('Repor os dados de demonstração? Os dados atuais serão substituídos.')){store.resetDemo();flash('success','✓ Dados de demonstração repostos.');}}}>Repor dados de demonstração</button>
              <button className="btn btn-danger btn-sm" onClick={()=>{if(confirm('Apagar TODOS os clientes, sessões, avaliações e eventos? Recomenda-se exportar um backup antes.')&&confirm('Tem a certeza? Esta ação não pode ser desfeita.')){store.clearAll();flash('success','✓ Dados apagados. Pode começar com dados reais.');}}}>Apagar todos os dados</button>
            </div>
          </div>
        </div>
      )}
      {tab==='security'&&(
        <div className="card">
          <div className="card-title" style={{marginBottom:16}}>Segurança</div>
          <div className="alert alert-info">Esta versão funciona sem servidor, por isso ainda não há contas nem passwords reais. A proteção dos dados depende do acesso ao computador.</div>
        </div>
      )}
    </div>
  );
}

function DashboardLayout({children,page,setPage,onLogout,title}){
  const {profile}=useStore();
  const [menuOpen,setMenuOpen]=useState(false);
  useEffect(()=>{setMenuOpen(false);},[page]);
  return(
    <div>
      <Sidebar page={page} setPage={setPage} onLogout={onLogout} open={menuOpen} onClose={()=>setMenuOpen(false)}/>
      <div className="main">
        <div className="topbar">
          <button className="menu-toggle" aria-label="Abrir menu" aria-expanded={menuOpen} onClick={()=>setMenuOpen(o=>!o)}>☰</button>
          <div className="topbar-title">{title}</div>
          <div className="topbar-actions">
            <button className="btn btn-secondary btn-sm hide-mobile">🔔</button>
            <button className="btn btn-secondary btn-sm hide-mobile">❓</button>
            <div className="avatar" style={{background:'#4361EE',cursor:'pointer'}} title="Definições" onClick={()=>setPage('settings')}>{initialsOf(profile.name.replace(/^(Dra?|Enf|Prof)\.?\s+/i,''))}</div>
          </div>
        </div>
        {children}
      </div>
    </div>
  );
}

function AppInner(){
  const {patients}=useStore();
  const [screen,setScreen]=useState(()=>(location.hash==='#teste'?'test':'landing'));
  const [page,setPage]=useState('dashboard');
  const [selectedModule,setSelectedModule]=useState(null);
  const [selectedPatientId,setSelectedPatientId]=useState(null);
  const selectedPatient=patients.find(p=>p.id===selectedPatientId)||null;
  const openPatient=id=>{setSelectedPatientId(id);setPage('patient-profile');};
  useEffect(()=>{window.scrollTo(0,0);},[page]);
  const titles={dashboard:'Dashboard',modules:'Módulos','module-detail':selectedModule?.name||'Módulo',patients:'Clientes','patient-profile':selectedPatient?.name||'Cliente','new-patient':'Novo Cliente',calendar:'Calendário',forum:'Fórum Clínico',settings:'Definições',library:'Biblioteca',groups:'Grupos'};
  if(screen==='landing') return <LandingPage onEnter={()=>setScreen('auth')} onTest={()=>{setScreen('test');window.scrollTo(0,0);}}/>;
  if(screen==='test') return <MovementTest onExit={()=>{if(location.hash==='#teste')history.replaceState(null,'',location.pathname);setScreen('landing');}} onEnter={()=>setScreen('auth')}/>;
  if(screen==='auth') return <AuthPage onLogin={()=>setScreen('dashboard')}/>;
  return(
    <DashboardLayout page={page} setPage={setPage} onLogout={()=>setScreen('landing')} title={titles[page]||'Age in Move'}>
      {page==='dashboard'&&<DashboardHome setPage={setPage} openPatient={openPatient}/>}
      {page==='modules'&&<ModulesPage setPage={setPage} setSelectedModule={setSelectedModule}/>}
      {page==='module-detail'&&selectedModule&&<ModuleDetail mod={selectedModule} setPage={setPage}/>}
      {page==='patients'&&<PatientsPage setPage={setPage} openPatient={openPatient}/>}
      {page==='patient-profile'&&(selectedPatient?<PatientProfile key={selectedPatient.id} patient={selectedPatient} setPage={setPage}/>:<PatientsPage setPage={setPage} openPatient={openPatient}/>)}
      {page==='new-patient'&&<NewPatientPage setPage={setPage} openPatient={openPatient}/>}
      {page==='calendar'&&<CalendarPage openPatient={openPatient}/>}
      {page==='forum'&&<ForumPage/>}
      {page==='library'&&<LibraryPage openPatient={openPatient}/>}
      {page==='groups'&&<GroupsPage openPatient={openPatient}/>}
      {page==='settings'&&<SettingsPage/>}
    </DashboardLayout>
  );
}

function App(){
  const fam=(location.hash||'').match(/^#familia=([A-Za-z0-9_-]+)$/);
  if(fam) return <FamilyView payload={fam[1]}/>;
  return <StoreProvider><AppInner/></StoreProvider>;
}

// Instalação como app (ecrã principal) e funcionamento offline — só quando servida por http(s)
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(e=>console.warn('Service worker não registado',e));});
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
