// ─── TESTE PÚBLICO "IDADE EM MOVIMENTO" ────────────────────────────────────
// Estimativa indicativa: cada teste é comparado com valores de referência por idade e sexo e convertido
// na idade cuja mediana corresponde ao desempenho; a idade em movimento é a média dessas idades.
// Referências (valores aproximados das medianas):
//  · Levantar-sentar 30 s — Rikli & Jones, Senior Fitness Test (2013): ponto médio do intervalo normal por faixa etária
//  · Equilíbrio num pé, olhos abertos — Springer et al., J Geriatr Phys Ther 2007; <5 s associado a risco de queda (Vellas et al., 1997)
//  · Velocidade de marcha — Bohannon & Andrews, Physiotherapy 2011; <0,8 m/s associado a maior risco
const MT_NORMS={
  chair:{F:[[55,15.5],[62,14.5],[67,13.5],[72,12.5],[77,12.5],[82,11.5],[87,10.5],[92,7.5]],M:[[55,17.5],[62,16.5],[67,15],[72,14.5],[77,14],[82,12.5],[87,11],[92,9.5]]},
  balance:{F:[[45,40],[55,37],[65,27],[75,15],[85,6]],M:[[45,40],[55,37],[65,27],[75,17],[85,6]]},
  gait:{F:[[45,1.40],[55,1.40],[65,1.24],[75,1.13],[85,0.94]],M:[[45,1.46],[55,1.43],[65,1.36],[75,1.33],[85,1.08]]},
};
// Idade cuja mediana corresponde ao desempenho (tabela com valores a descer com a idade)
function mtAgeFor(table,perf){
  const lo=table[0],hi=table[table.length-1];
  // Fora da tabela, extrapola com prudência: no máximo 5 anos para lá dos limites
  if(perf>=lo[1]) return lo[0]-Math.min(5,(perf-lo[1])/(lo[1]||1)*10);
  if(perf<=hi[1]) return hi[0]+Math.min(5,(hi[1]-perf)/(hi[1]||1)*10);
  for(let i=0;i<table.length-1;i++){
    const [a1,v1]=table[i],[a2,v2]=table[i+1];
    if(perf<=v1&&perf>=v2){ if(v1===v2) return (a1+a2)/2; return a1+(v1-perf)/(v1-v2)*(a2-a1); }
  }
  return null;
}
// Valor esperado (mediana) para uma idade
function mtExpected(table,age){
  if(age<=table[0][0]) return table[0][1];
  if(age>=table[table.length-1][0]) return table[table.length-1][1];
  for(let i=0;i<table.length-1;i++){const [a1,v1]=table[i],[a2,v2]=table[i+1];if(age>=a1&&age<=a2)return v1+(age-a1)/(a2-a1)*(v2-v1);}
  return null;
}
const MT_WORDS=['MAÇÃ','CADEIRA','LUA','CASACO','RIO','SINO','PÃO','FLOR','JANELA','CAVALO','LIVRO','PRAIA','CHAVE','BOLO','NUVEM'];
function mtResult(st){
  const sex=st.sex==='M'?'M':'F', age=+st.age;
  const tests=[];
  const rate=(val,exp)=>val>=exp*1.1?{t:'Acima do esperado para a idade',c:'g'}:val>=exp*0.9?{t:'Dentro do esperado para a idade',c:'g'}:val>=exp*0.75?{t:'Um pouco abaixo do esperado',c:'w'}:{t:'Abaixo do esperado para a idade',c:'r'};
  if(st.chair!==''&&st.chair!=null){const v=+st.chair,t=MT_NORMS.chair[sex];tests.push({k:'chair',name:'Força das pernas',detail:`${v} levantamentos em 30 s`,eq:mtAgeFor(t,v),r:rate(v,mtExpected(t,age)),exp:`esperado ≈ ${Math.round(mtExpected(t,age))}`});}
  if(st.balance!=null&&st.balance!==''){const v=Math.min(30,+st.balance),t=MT_NORMS.balance[sex];
    // O teste para aos 30 s: quem chega aos 30 não "fica mais novo" do que a idade correspondente a 30 s
    tests.push({k:'balance',name:'Equilíbrio',detail:`${String(Math.round(v*10)/10).replace('.',',')} s num pé`,eq:v>=30?Math.min(mtAgeFor(t,v),age):mtAgeFor(t,v),r:rate(v,Math.min(30,mtExpected(t,age))),exp:`esperado ≈ ${Math.round(Math.min(30,mtExpected(t,age)))} s`});}
  if(st.gait!=null&&st.gait!==''&&+st.gait>0){const sp=4/(+st.gait),t=MT_NORMS.gait[sex];tests.push({k:'gait',name:'Velocidade a andar',detail:`${String(Math.round(sp*100)/100).replace('.',',')} m/s (4 m em ${String(st.gait).replace('.',',')} s)`,eq:mtAgeFor(t,sp),r:rate(sp,mtExpected(t,age)),exp:`esperado ≈ ${String(Math.round(mtExpected(t,age)*100)/100).replace('.',',')} m/s`});}
  const eqs=tests.map(t=>t.eq).filter(x=>x!=null);
  const mAge=eqs.length?Math.round(eqs.reduce((a,b)=>a+b,0)/eqs.length):null;
  const flags=[];
  if(st.balance!==''&&st.balance!=null&&+st.balance<5) flags.push('Equilíbrio num pé abaixo de 5 segundos — associado a maior risco de queda.');
  if(st.gait&&4/(+st.gait)<0.8) flags.push('Velocidade de marcha abaixo de 0,8 m/s — vale a pena uma avaliação da mobilidade.');
  if(st.chair!==''&&st.chair!=null&&+st.chair<8) flags.push('Menos de 8 levantamentos em 30 s — sinal de força reduzida nas pernas.');
  if(st.falls==='yes') flags.push('Teve uma queda no último ano — recomenda-se avaliação do risco de queda.');
  if(st.fear==='yes') flags.push('Tem medo de cair — é tratável e vale a pena falar disso com um profissional.');
  const recalled=st.words.filter(w=>st.recall.map(norm).includes(norm(w))).length;
  if(st.recall.length&&recalled<=2) flags.push('Lembrou-se de poucas palavras. Pode ser cansaço ou distração; se notar esquecimentos no dia a dia, fale com o seu médico.');
  return {age,sex,mAge,tests,flags,recalled};
}

function Stopwatch({limit,countdown,onDone,running,setRunning,value}){
  const [t,setT]=useState(0);
  const ref=React.useRef(null);
  useEffect(()=>{
    if(!running) return;
    const start=performance.now()-t*1000;
    ref.current=setInterval(()=>{
      const el=(performance.now()-start)/1000;
      if(limit&&el>=limit){setT(limit);setRunning(false);clearInterval(ref.current);try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}onDone&&onDone(limit);return;}
      setT(el);
    },100);
    return()=>clearInterval(ref.current);
  },[running]);
  useEffect(()=>{if(value===null)setT(0);},[value]);
  const shown=countdown?Math.max(0,limit-t):t;
  return <div style={{fontSize:56,fontWeight:800,fontVariantNumeric:'tabular-nums',textAlign:'center',color:running?'#4361EE':'#16224f',lineHeight:1}}>{(countdown?Math.ceil(shown):shown.toFixed(1)).toString().replace('.',',')}<span style={{fontSize:20,color:'#94a3b8'}}> s</span></div>;
}

// Mede o tempo entre o início e o fim de um cronómetro (para registar o resultado ao carregar em Parar)
function StopCapture({running,onStop,max}){
  const t0=React.useRef(null);
  useEffect(()=>{
    if(running){t0.current=performance.now();}
    else if(t0.current!=null){const secs=(performance.now()-t0.current)/1000;t0.current=null;onStop(max?Math.min(max,secs):secs);}
  },[running]);
  return null;
}

// ─── ALERTAS DE ACOMPANHAMENTO ─────────────────────────────────────────────
// Variação considerada relevante entre as duas últimas avaliações (sinal: sentido do agravamento)
const DECLINE_THRESHOLD={mmse:-3,moca:-2,gds:3,barthel:-10,tug:3,berg:-5,tinetti:-3,sppb:-2,chair30:-3,zarit:10};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
function computeAlerts({patients,sessions,assessments,events,prefs}){
  const pr={...DEFAULT_PREFS,...prefs};
  const today=todayISO();
  const out=[];
  patients.filter(isActive).forEach(p=>{
    const add=(level,kind,text)=>out.push({patientId:p.id,name:p.name,level,kind,text});
    const pa=assessments.filter(a=>a.patientId===p.id);
    // Declínio entre as duas avaliações mais recentes de cada escala
    if(pr.declineAlerts){
      Object.keys(DECLINE_THRESHOLD).forEach(k=>{
        const list=pa.filter(a=>a.scale===k).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
        if(list.length<2) return;
        const prev=list[list.length-2],last=list[list.length-1];
        const d=Math.round((last.value-prev.value)*10)/10,t=DECLINE_THRESHOLD[k];
        if((t<0&&d<=t)||(t>0&&d>=t)) add('r','declínio',`${SCALES[k].name} ${t<0?'desceu':'subiu'} ${String(Math.abs(d)).replace('.',',')} (${String(prev.value).replace('.',',')} → ${String(last.value).replace('.',',')}) desde ${fmtDate(prev.date)}`);
      });
    }
    // Reavaliação em atraso
    if(+pr.reassessDays>0){
      const last=pa.map(a=>a.date).sort().pop();
      if(!last) add('w','reavaliação','Sem avaliações registadas');
      else{const d=daysBetween(last,today);if(d>+pr.reassessDays)add('w','reavaliação',`Última avaliação há ${d} dias (${fmtDate(last)})`);}
    }
    const ps=sessions.filter(s=>s.patientId===p.id).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
    // Sem sessões recentes e nada agendado
    if(+pr.inactiveDays>0){
      const lastDone=ps.filter(s=>sessionStatus(s)==='done').map(s=>s.date).pop();
      const ref=lastDone||p.createdAt;
      const future=events.some(e=>e.patientId===p.id&&e.date>=today&&!e.done);
      if(ref&&!future){const d=daysBetween(ref,today);if(d>+pr.inactiveDays)add('w','inatividade',lastDone?`Sem sessões há ${d} dias e nada agendado`:`Sem sessões desde a abertura do processo (${d} dias)`);}
    }
    // Faltas seguidas
    const lastTwo=ps.filter(s=>sessionStatus(s)!=='cancelled').slice(-2);
    if(lastTwo.length===2&&lastTwo.every(s=>sessionStatus(s)==='missed')) add('w','faltas','Duas faltas seguidas');
    // Quedas nas sessões dos últimos 30 dias
    ps.filter(s=>(s.incidents||[]).some(i=>i==='Queda'||i==='Quase-queda')&&daysBetween(s.date,today)<=30)
      .forEach(s=>add('r','ocorrência',`${(s.incidents||[]).includes('Queda')?'Queda':'Quase-queda'} na sessão de ${fmtDate(s.date)}`));
    // Sobrecarga do cuidador
    if(p.zarit!=null&&+p.zarit>56) add('w','cuidador',`Sobrecarga intensa do cuidador (Zarit ${p.zarit})`);
    // Programa intensivo: avaliação inicial e final
    if(p.program){
      const g=p.program,base=pa.some(a=>a.date>=addDaysISO(g.start,-14)&&a.date<=addDaysISO(g.start,7)),fin=pa.some(a=>a.date>=addDaysISO(g.end,-7));
      if(!base&&today>addDaysISO(g.start,7)) add('w','programa','Programa intensivo sem avaliação inicial');
      if(today>g.end&&!fin) add('w','programa','Programa intensivo terminou: falta a reavaliação final');
    }
    // Consentimento
    if(pr.consentAlerts&&!p.consent) add('w','consentimento','Sem consentimento informado registado');
  });
  return out.sort((a,b)=>(a.level===b.level?0:a.level==='r'?-1:1));
}

function DashboardHome({setPage,openPatient}){
  const {patients,sessions,assessments,events,profile,prefs}=useStore();
  const now=new Date();
  const today=todayISO();
  const monthKey=today.slice(0,7);
  const prevMonth=new Date(now.getFullYear(),now.getMonth()-1,1);
  const prevKey=`${prevMonth.getFullYear()}-${String(prevMonth.getMonth()+1).padStart(2,'0')}`;
  const done=sessions.filter(s=>sessionStatus(s)==='done');
  const sessMonth=done.filter(s=>s.date.startsWith(monthKey)).length;
  const sessPrev=done.filter(s=>s.date.startsWith(prevKey)).length;
  const active=patients.filter(isActive);
  const newThisMonth=active.filter(p=>(p.createdAt||'').startsWith(monthKey)).length;
  const atRisk=active.filter(p=>p.risk!=='low').sort((a,b)=>(a.risk==='high'?0:1)-(b.risk==='high'?0:1));
  const alerts=computeAlerts({patients,sessions,assessments,events,prefs});
  const [showAll,setShowAll]=useState(false);
  const upcoming=events.filter(e=>e.date>=today&&!e.done).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,6);
  const todayCount=events.filter(e=>e.date===today&&e.type==='session'&&!e.done).length;
  const exCount=MODULES.reduce((n,m)=>n+(m.exercises_list?m.exercises_list.length:(+m.exercises||0)),0);
  const stats=[
    {label:'Clientes Ativos',value:String(active.length),sub:newThisMonth?`+${newThisMonth} este mês`:'Sem novos este mês',icon:'👥',bg:'#eff6ff',ic:'#1d4ed8'},
    {label:'Sessões este Mês',value:String(sessMonth),sub:`${sessPrev} no mês anterior`,icon:'📋',bg:'#f0fdf4',ic:'#15803d'},
    {label:'Módulos',value:String(MODULES.length),sub:`${exCount} exercícios`,icon:'📚',bg:'#faf5ff',ic:'#6d28d9'},
    {label:'Alertas',value:String(alerts.length),sub:alerts.length?`${new Set(alerts.map(a=>a.patientId)).size} clientes · ${alerts.filter(a=>a.level==='r').length} prioritários`:'Sem alertas',icon:'⚠️',bg:'#fffbeb',ic:'#b45309'},
  ];
  const hour=now.getHours();
  const greet=hour<12?'Bom dia':hour<20?'Boa tarde':'Boa noite';
  const dateStr=now.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  // Um cliente por linha, com todos os seus alertas; os que têm alertas prioritários primeiro
  const groups=Object.values(alerts.reduce((m,a)=>{(m[a.patientId]=m[a.patientId]||{patientId:a.patientId,name:a.name,items:[]}).items.push(a);return m;},{}))
    .map(g=>({...g,red:g.items.some(a=>a.level==='r')})).sort((a,b)=>(b.red-a.red)||(b.items.length-a.items.length));
  const shown=showAll?groups:groups.slice(0,5);
  return(
    <div className="page">
      <div style={{marginBottom:20}}>
        <h2 style={{fontSize:22,fontWeight:800,color:'#0f172a'}}>{greet}, {profile.name.split(' ').slice(0,2).join(' ')}! 👋</h2>
        <p style={{color:'#64748b',fontSize:14}}>{dateStr.charAt(0).toUpperCase()+dateStr.slice(1)} · {todayCount} {todayCount===1?'sessão':'sessões'} por registar hoje</p>
      </div>
      <div className="grid-4" style={{marginBottom:20}}>
        {stats.map(s=>(
          <div className="stat-card" key={s.label}>
            <div className="stat-icon" style={{background:s.bg,color:s.ic,fontSize:24}}>{s.icon}</div>
            <div><div className="stat-label">{s.label}</div><div className="stat-value">{s.value}</div><div className="stat-sub">{s.sub}</div></div>
          </div>
        ))}
      </div>
      <div className="card" style={{borderLeft:alerts.length?'4px solid #d97706':'4px solid #16a34a'}}>
        <div className="card-header"><div className="card-title">Precisa de atenção</div><button className="btn btn-sm btn-secondary" onClick={()=>setPage('settings')}>Configurar alertas</button></div>
        {alerts.length===0&&<p style={{fontSize:14,color:'#64748b'}}>Nada pendente: sem declínios, reavaliações em atraso, faltas seguidas ou ocorrências.</p>}
        {shown.map(g=>(
          <div key={g.patientId} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'10px 0',borderBottom:'1px solid #f1f5f9',cursor:'pointer'}} onClick={()=>openPatient(g.patientId)}>
            <span style={{width:9,height:9,borderRadius:'50%',background:g.red?'#dc2626':'#d97706',flexShrink:0,marginTop:6}}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:14}}>{g.name}</div>
              {g.items.map((a,i)=><div key={i} style={{fontSize:13,color:a.level==='r'?'#b91c1c':'#475569',display:'flex',gap:6,alignItems:'baseline',flexWrap:'wrap'}}><span className={`badge badge-${a.level==='r'?'red':'yellow'}`} style={{textTransform:'capitalize',fontSize:11}}>{a.kind}</span>{a.text}</div>)}
            </div>
          </div>
        ))}
        {groups.length>5&&<button className="btn btn-sm btn-secondary" style={{marginTop:10}} onClick={()=>setShowAll(v=>!v)}>{showAll?'Mostrar menos':`Ver todos (${groups.length} clientes)`}</button>}
      </div>
      <div className="grid-2">
        <div className="card">
          <div className="card-header"><div className="card-title">Próximos Eventos</div><button className="btn btn-sm btn-secondary" onClick={()=>setPage('calendar')}>Ver calendário</button></div>
          {upcoming.length===0&&<p style={{fontSize:14,color:'#64748b',padding:'10px 0'}}>Sem eventos agendados. Adicione sessões no calendário.</p>}
          {upcoming.map(e=>{
            const p=patients.find(x=>x.id===e.patientId);
            return(
              <div key={e.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:'1px solid #f1f5f9',cursor:p?'pointer':'default'}} onClick={()=>p&&openPatient(p.id)}>
                <div style={{width:52,fontSize:13,fontWeight:700,color:'#64748b'}}>{e.date===today?'Hoje':fmtDate(e.date).slice(0,5)}</div>
                <div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{e.title}</div><div style={{fontSize:12,color:'#64748b'}}>{e.time?`${e.time} · `:''}{e.type==='session'?'Sessão':e.type==='meeting'?'Reunião':'Formação'}</div></div>
                <span className={`badge badge-${e.date===today?'blue':'gray'}`}>{e.date===today?'Hoje':'Agendada'}</span>
              </div>
            );
          })}
        </div>
        <div className="card">
          <div className="card-header"><div className="card-title">Clientes em Risco</div><button className="btn btn-sm btn-secondary" onClick={()=>setPage('patients')}>Ver todos</button></div>
          {atRisk.length===0&&<p style={{fontSize:14,color:'#64748b',padding:'10px 0'}}>Nenhum cliente ativo em risco médio ou alto.</p>}
          {atRisk.map(p=>{const r=riskDetail(p);return(
            <div key={p.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:'1px solid #f1f5f9',cursor:'pointer'}} onClick={()=>openPatient(p.id)}>
              <div className="avatar" style={{background:p.avatar}}>{p.initials}</div>
              <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:14}}>{p.name}</div><div style={{fontSize:12,color:'#64748b'}}>{r.reasons.join(' · ')}</div></div>
              {riskBadge(p.risk)}
            </div>);})}
        </div>
      </div>
    </div>
  );
}

function riskBadge(risk){return <span className={`badge badge-${risk==='high'?'red':risk==='medium'?'yellow':'green'}`}>{risk==='high'?'Alto':risk==='medium'?'Médio':'Baixo'}</span>;}
function statusBadge(p){const st=PATIENT_STATUS[statusOf(p)];return <span className={`badge badge-${st.badge}`}>{st.label}</span>;}
function nextEventFor(events,patientId){
  const t=todayISO();
  return events.filter(e=>e.patientId===patientId&&e.date>=t&&!e.done).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')))[0]||null;
}

const genderLabel=g=>g==='F'?'Feminino':g==='M'?'Masculino':'Outro';
function attendance(sessions,patientId){
  const ps=sessions.filter(s=>s.patientId===patientId);
  const done=ps.filter(s=>sessionStatus(s)==='done').length, missed=ps.filter(s=>sessionStatus(s)==='missed').length, cancelled=ps.filter(s=>sessionStatus(s)==='cancelled').length;
  return {done,missed,cancelled,rate:done+missed?Math.round(done/(done+missed)*100):null};
}

const Section=({title,children})=><div style={{margin:'18px 0 8px',fontWeight:700,fontSize:13,color:'#475569',textTransform:'uppercase',letterSpacing:'.05em'}}>{title}{children}</div>;

// ─── SESSÃO ───────────────────────────────────────────────────────────────
const RPE_LABELS=['0 — Repouso','1 — Muito, muito leve','2 — Muito leve','3 — Leve','4 — Moderado','5 — Um pouco intenso','6','7 — Intenso','8','9 — Muito intenso','10 — Máximo'];
const INCIDENTS=['Queda','Quase-queda','Dor','Tonturas','Falta de ar','Fadiga excessiva','Confusão / agitação','Outro'];
const ADHERENCE={full:'Cumpriu o plano',partial:'Cumpriu em parte',none:'Não cumpriu',na:'Sem plano / não aplicável'};
function vitalsWarnings(v){
  const w=[];
  const bp=s=>{const m=String(s||'').match(/^(\d{2,3})\s*\/\s*(\d{2,3})$/);return m?[+m[1],+m[2]]:null;};
  const pre=bp(v.bpPre);if(pre&&(pre[0]>=180||pre[1]>=110))w.push(`TA antes ${v.bpPre} — elevada`);
  if(pre&&pre[0]<90)w.push(`TA antes ${v.bpPre} — baixa`);
  if(v.hrPre&&(+v.hrPre>120||+v.hrPre<45))w.push(`FC antes ${v.hrPre} bpm`);
  if(v.spo2Pre&&+v.spo2Pre<90)w.push(`SpO₂ antes ${v.spo2Pre}%`);
  if(v.spo2Post&&+v.spo2Post<90)w.push(`SpO₂ depois ${v.spo2Post}%`);
  return w;
}
function SessionModal({patient,session,eventId,defaultDate,defaultStatus,onClose}){
  const {addSession,updateSession,prefs}=useStore();

    date:s0.date||defaultDate||todayISO(),moduleId:String(s0.moduleId||patient.module||1),

    }else{
      for(const k of ['bpPre','bpPost']) if(f[k]&&!/^\d{2,3}\s*\/\s*\d{2,3}$/.test(f[k])){setErr('Tensão arterial no formato 130/80.');return;}
      for(const k of ['hrPre','hrPost']) if(f[k]&&(+f[k]<30||+f[k]>220)){setErr('Frequência cardíaca entre 30 e 220 bpm.');return;}
      for(const k of ['spo2Pre','spo2Post']) if(f[k]&&(+f[k]<50||+f[k]>100)){setErr('SpO₂ entre 50 e 100%.');return;}
      const exDone=plan.filter(it=>done[it.uid]?.on).map(it=>({exId:it.exId,version:it.version,sets:done[it.uid].sets||'',reps:done[it.uid].reps||'',load:done[it.uid].load||''}));
      const others=f.otherExercises.split('\n').map(x=>x.trim()).filter(Boolean);
      data={patientId:patient.id,date:f.date,status:'done',reason:'',moduleId:+f.moduleId,duration:+f.duration||0,

        performance:f.performance,rpe:f.rpe===''?null:+f.rpe,vitals:vit,adherence:f.adherence,
        soap:{s:f.soapS.trim(),o:f.soapO.trim(),a:f.soapA.trim(),p:f.soapP.trim()},notes:'',
        incidents:f.incidents,incidentNotes:f.incidentNotes.trim()};

    onClose();

  const Seg=({k,opts})=><div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{opts.map(([v,l])=><button key={v} type="button" className={`btn btn-sm ${f[k]===v?'btn-primary':'btn-secondary'}`} onClick={()=>set(k,v)}>{l}</button>)}</div>;
  return(

      {err&&<div className="alert alert-warning">{err}</div>}
      <div className="form-group"><label>Estado</label><Seg k="status" opts={[['done','✓ Realizada'],['missed','Falta'],['cancelled','Cancelada']]}/></div>
      <div className="grid-2">
        <div className="form-group"><label>Data *</label><input type="date" value={f.date} onChange={e=>set('date',e.target.value)}/></div>

      </div>

        <div className="form-group"><label>Motivo</label><textarea rows={3} value={f.reason} onChange={e=>set('reason',e.target.value)} placeholder={f.status==='missed'?'Ex.: doença, esquecimento, transporte...':'Ex.: cancelada pelo terapeuta, feriado...'}/></div>

        <Section title="Exercícios realizados"/>
        {plan.length?(
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {plan.map(it=>{const {ex}=findExercise(it.exId);const d=done[it.uid]||{};return(
              <div key={it.uid} style={{border:'1px solid #e2e8f0',borderRadius:10,padding:'10px 12px',background:d.on?'#f8fafc':'#fff'}}>

                  <input type="checkbox" checked={!!d.on} onChange={e=>setEx(it.uid,'on',e.target.checked)} style={{width:18,height:18}}/>
                  <span style={{flex:1}}>{ex.name} <span style={{fontWeight:400,color:'#64748b',fontSize:12}}>· {versionLabel(it,ex.ebook)}{it.dose?` · ${it.dose}`:''}</span></span>

                  <input aria-label="Carga ou nível" placeholder="Carga" value={d.load} onChange={e=>setEx(it.uid,'load',e.target.value)}/>
                </div>}
              </div>);})}
            <div className="form-group" style={{marginTop:4}}><label>Outros exercícios (um por linha)</label><textarea rows={2} value={f.otherExercises} onChange={e=>set('otherExercises',e.target.value)} placeholder="Ex.: Marcha com obstáculos 2×5 m"/></div>
          </div>

          <span/><span style={{color:'#64748b'}}>TA (mmHg)</span><span style={{color:'#64748b'}}>FC (bpm)</span><span style={{color:'#64748b'}}>SpO₂ (%)</span>

        <div className="grid-2" style={{marginTop:12}}>

        <button className="btn btn-primary" onClick={save}>{session?'Guardar alterações':'Guardar sessão'}</button>
      </div>
    </Modal>
  );

            {s.notes&&<div><strong>Notas:</strong> {s.notes}</div>}
            {(s.incidents||[]).length>0&&<div style={{color:'#b91c1c'}}><strong>Ocorrências:</strong> {s.incidents.join(', ')}{s.incidentNotes?` — ${s.incidentNotes}`:''}</div>}
          </>}

            <button className="btn btn-sm btn-secondary" onClick={onEdit}>✏️ Editar</button>

            <button className="btn btn-sm btn-danger" onClick={onDelete}>Eliminar</button>
          </div>
        </div>
      )}
    </div>
  );
}

Object.values(SCALE_FORMS).forEach(f=>(f.info||[]).forEach(id=>f.sections.forEach(s=>s.items.forEach(i=>{if(i.id===id)i.info=true;}))));
const sfAllItems=f=>f.sections.flatMap(s=>s.items);
// Resultado do formulário: total, subtotais e itens em falta
function scaleFormResult(k,ans,patient){
  const f=SCALE_FORMS[k];
  const missing=sfAllItems(f).filter(i=>!i.info&&(ans[i.id]==null||ans[i.id]==='')).length;
  const base=f.compute?f.compute(f,ans,patient):{total:sumItems(f,ans)};
  const subs=base.subs||(f.sections.length>1?sectionSubs(f,ans):null);
  return {total:missing?null:base.total,subs,missing};
}
// Linhas legíveis dos itens respondidos (para o PDF e o histórico)
function scaleFormLines(k,ans){
  const f=SCALE_FORMS[k];if(!f||!ans) return [];
  return f.sections.flatMap(s=>s.items.map(i=>{
    const v=ans[i.id];if(v==null||v==='') return [s.title,i.label,'—'];
    if(i.options){const o=i.options.find(o=>String(o.v)===String(v));return [s.title,i.label,i.info?(o?o.l:v):`${o?o.l:v}${o&&o.l!==String(o.v)?` (${o.v})`:''}`];}
    return [s.title,i.label,v==='x'?'Não conseguiu':`${String(v).replace('.',',')}${i.type==='time'?' s':''}`];
  }));
}

function TimeField({value,onChange,unable,type}){
  const [run,setRun]=useState(false);
  const ref=React.useRef(null);
  useEffect(()=>()=>clearInterval(ref.current),[]);
  const toggle=()=>{
    if(run){clearInterval(ref.current);setRun(false);return;}
    const start=performance.now();setRun(true);
    ref.current=setInterval(()=>onChange(((performance.now()-start)/1000).toFixed(1)),100);
  };
  const isX=value==='x';

function validateScales(values){
  const parsed={};
  for(const [k,v] of Object.entries(values)){
    const n=numOrNull(v);const sc=SCALES[k];
    if(n!=null&&(n<sc.min||n>sc.max)) return {error:`${sc.name}: valor entre ${sc.min} e ${sc.max}.`};
    parsed[k]=n;
  }
  return {parsed};
}

// ─── GRÁFICO DE EVOLUÇÃO DAS ESCALAS ───────────────────────────────────────
function ScaleChart({points,scale,patient}){
  const [hover,setHover]=useState(null);
  const sc=SCALES[scale];
  const lo=sc.min||0, hiVal=Math.max(sc.chartMax||sc.max,...points.map(p=>+p.value)), cuts=scaleCuts(scale,patient);
  const narrow=useNarrow();
  const W=narrow?400:1000,H=narrow?250:260,ml=narrow?32:44,mr=narrow?10:20,mt=18,mb=30,iw=W-ml-mr,ih=H-mt-mb,pad=points.length>1?Math.min(60,iw/(points.length*2)):0;
  const xi=i=>points.length===1?ml+iw/2:ml+pad+(i/(points.length-1))*(iw-2*pad);
  const y=v=>mt+ih-((v-lo)/(hiVal-lo))*ih;
  const nt=4;const ticks=Array.from({length:nt+1},(_,i)=>Math.round((lo+(hiVal-lo)*i/nt)*10)/10);
  const path=points.map((p,i)=>`${i?'L':'M'}${xi(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const first=+points[0].value,last=+points[points.length-1].value,delta=Math.round((last-first)*10)/10;
  const better=sc.inverse?delta<0:delta>0;
  const xLabels=points.length<=(narrow?4:8)?points.map((p,i)=>[p,i]):[[points[0],0],[points[Math.floor(points.length/2)],Math.floor(points.length/2)],[points[points.length-1],points.length-1]];
  const it=interpretScale(scale,last,patient);
  return(
    <div>
      <div style={{display:'flex',gap:16,marginBottom:8,fontSize:13,color:'#64748b',flexWrap:'wrap',alignItems:'center'}}>
        <span>Atual: <strong style={{color:'#0f172a',fontSize:16}}>{fmtScale(scale,last)}</strong></span>
        {it.label&&<span className={`badge badge-${LEVEL_BADGE[it.level]}`}>{it.label}</span>}
        {points.length>1&&<span>Variação desde {fmtDate(points[0].date)}: <strong style={{color:delta===0?'#64748b':better?'#16a34a':'#dc2626'}}>{delta>0?'+':''}{String(delta).replace('.',',')}</strong></span>}
        <span>{points.length} {points.length===1?'registo':'registos'}</span>
      </div>
      <div style={{position:'relative'}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}} role="img" aria-label={`Evolução ${sc.name}`}>
          {ticks.map(t=>(<g key={t}><line x1={ml} x2={W-mr} y1={y(t)} y2={y(t)} stroke="#f1f5f9"/><text x={ml-8} y={y(t)+4} textAnchor="end" fontSize="11" fill="#94a3b8">{String(t).replace('.',',')}</text></g>))}
          {cuts.filter(c=>c.v>=lo&&c.v<=hiVal).map(c=>(<g key={c.v}><line x1={ml} x2={W-mr} y1={y(c.v)} y2={y(c.v)} stroke="#cbd5e1" strokeDasharray="4 4"/><text x={W-mr} y={y(c.v)-4} textAnchor="end" fontSize="10" fill="#94a3b8">{c.label}</text></g>))}
          {xLabels.map(([p,i])=><text key={'x'+p.id} x={xi(i)} y={H-10} textAnchor="middle" fontSize="11" fill="#94a3b8">{fmtDate(p.date).slice(0,5)}/{p.date.slice(2,4)}</text>)}
          {points.length>1&&<path d={path} fill="none" stroke="#4361EE" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>}
          {points.map((p,i)=>(
            <g key={p.id} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)} onClick={()=>setHover(h=>h===i?null:i)}>
              <circle cx={xi(i)} cy={y(p.value)} r="12" fill="transparent"/>
              <circle cx={xi(i)} cy={y(p.value)} r={hover===i?5:3.5} fill="#4361EE" stroke="#fff" strokeWidth="2" style={{pointerEvents:'none'}}/>
            </g>
          ))}
          {points.length<=(narrow?6:8)&&points.map((p,i)=><text key={'v'+p.id} x={xi(i)} y={y(p.value)-10} textAnchor="middle" fontSize="11" fontWeight="700" fill="#334155" style={{pointerEvents:'none'}}>{String(p.value).replace('.',',')}</text>)}
        </svg>
        {hover!=null&&(()=>{const p=points[hover];return(
          <div style={{position:'absolute',left:`${xi(hover)/W*100}%`,top:`${y(p.value)/H*100}%`,transform:'translate(-50%,calc(-100% - 14px))',background:'#0f172a',color:'#fff',fontSize:12,padding:'6px 10px',borderRadius:6,whiteSpace:'nowrap',pointerEvents:'none'}}>
            <strong>{fmtScale(scale,p.value)}</strong> · {fmtDate(p.date)}{p.notes?<div style={{color:'#cbd5e1',maxWidth:240,whiteSpace:'normal'}}>{p.notes}</div>:null}
          </div>);})()}
      </div>
    </div>
  );
}

  return {name:form.name.trim(),dob:form.dob,age:ageFromDob(form.dob),gender:form.gender,phone:form.phone.trim(),email:form.email.trim(),address:form.address.trim(),
    sns:String(form.sns||'').trim(),education:numOrNull(form.education),caregiver:form.caregiver.trim(),caregiverPhone:form.caregiverPhone.trim(),
    emergencyName:form.emergencyName.trim(),emergencyPhone:form.emergencyPhone.trim(),diagnosis:form.diagnosis,module:+form.module,frequency:form.frequency,
    referral:form.referral.trim(),medication:form.medication.trim(),history:form.history.trim(),falls12m:numOrNull(form.falls12m),
    goals:form.goals.trim(),notes:form.notes.trim(),consent:!!form.consent,consentDate:form.consent?form.consentDate:''};
}
function validatePatientForm(form,{requireDob=true}={}){
  if(!form.name.trim()) return 'Indique o nome completo.';
  if(requireDob&&!form.dob) return 'Indique a data de nascimento.';
  if(form.dob){const a=ageFromDob(form.dob);if(a==null||a<0||a>120)return 'Data de nascimento inválida.';}
  if(form.education!==''&&form.education!=null&&(+form.education<0||+form.education>25)) return 'Escolaridade entre 0 e 25 anos.';
  if(form.sns&&!/^\d{9}$/.test(String(form.sns).trim())) return 'O nº de utente do SNS tem 9 dígitos.';
  if(!form.diagnosis) return 'Selecione o diagnóstico principal.';
  return '';
}

// Compara a primeira e a última avaliação de cada escala
function scaleComparison(assessments,patient){
  const pa=assessments.filter(a=>a.patientId===patient.id);
  return Object.keys(SCALES).map(k=>{
    const list=pa.filter(a=>a.scale===k).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
    if(!list.length) return null;
    const first=list[0],last=list[list.length-1];
    const d=Math.round((last.value-first.value)*10)/10;
    const better=SCALES[k].inverse?d<0:d>0;
    const thr=Math.abs(DECLINE_THRESHOLD[k]||1);
    return {k,first,last,delta:d,trend:list.length<2||d===0?'Sem alteração':Math.abs(d)<thr?'Variação ligeira':better?'Melhoria':'Agravamento'};
  }).filter(Boolean);
}

        </table></div>}
        <p style={{fontSize:13,color:'#475569',marginBottom:12}}>{pl(att.done,'sessão realizada','sessões realizadas')} · {pl(att.missed,'falta','faltas')}{att.rate!=null?` · assiduidade ${att.rate}%`:''}</p>

// ─── ÁREA DA FAMÍLIA ───────────────────────────────────────────────────────
// O terapeuta gera um link com um resumo do acompanhamento. O resumo vai CIFRADO dentro do próprio link
// (depois do #, parte que o browser nunca envia a nenhum servidor) e só abre com o PIN.
// Cifra: AES-GCM 256 com chave derivada do PIN por PBKDF2 (SHA-256, 150 000 iterações), sal e IV aleatórios.
const APP_PUBLIC_URL='https://ageinmove.pt/';
const FAMILY_SCALE={mmse:'Memória e orientação',moca:'Memória e raciocínio',gds:'Humor',barthel:'Autonomia no dia a dia',tug:'Levantar e caminhar',berg:'Equilíbrio',tinetti:'Equilíbrio e marcha',sppb:'Força e mobilidade',chair30:'Força das pernas',zarit:'Cansaço do cuidador'};
const FAMILY_DEFAULT_OFF=['gds','zarit'];
const b64uEnc=bytes=>{let s='';const a=new Uint8Array(bytes);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const b64uDec=str=>{let s=str.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;};
async function streamBytes(bytes,stream){return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());}
async function familyKey(pin,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptFamily(obj,pin){
  let data=new TextEncoder().encode(JSON.stringify(obj));let flag=0;
  if(typeof CompressionStream!=='undefined'){try{data=await streamBytes(data,new CompressionStream('deflate-raw'));flag=1;}catch(e){flag=0;}}
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await familyKey(pin,salt),data));
  const out=new Uint8Array(2+16+12+ct.length);out.set([1,flag],0);out.set(salt,2);out.set(iv,18);out.set(ct,30);
  return b64uEnc(out);
}
async function decryptFamily(str,pin){
  const a=b64uDec(str);
  if(a[0]!==1) throw new Error('Link de uma versão desconhecida.');
  const flag=a[1],salt=a.slice(2,18),iv=a.slice(18,30),ct=a.slice(30);
  let data=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},await familyKey(pin,salt),ct));
  if(flag===1){
    if(typeof DecompressionStream==='undefined') throw new Error('Este browser é demasiado antigo para abrir o link. Atualize o telemóvel ou use outro browser.');
    data=await streamBytes(data,new DecompressionStream('deflate-raw'));
  }
  return JSON.parse(new TextDecoder().decode(data));
}
const randomPin=()=>String(crypto.getRandomValues(new Uint32Array(1))[0]%1000000).padStart(6,'0');

// Resumo mínimo enviado à família: primeiro nome, sem contactos, morada, diagnóstico nem notas clínicas
function buildFamilySummary(patient,{assessments,events,sessions,profile},opt){
  const pa=assessments.filter(a=>a.patientId===patient.id);
  const sc=opt.scales.map(k=>{
    const list=pa.filter(a=>a.scale===k).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
    if(!list.length) return null;
    const first=list[0].value,last=list[list.length-1].value,d=Math.round((last-first)*10)/10,thr=Math.abs(DECLINE_THRESHOLD[k]||1);
    const better=SCALES[k].inverse?d<0:d>0;
    const it=interpretScale(k,last,patient);
    return {k,u:SCALES[k].unit||'',mx:SCALES[k].max,mn:SCALES[k].min||0,inv:!!SCALES[k].inverse,p:list.slice(-8).map(a=>[a.date,a.value]),l:it.label,lv:it.level,
      tr:list.length<2?'first':Math.abs(d)<thr?'stable':better?'up':'down'};
  }).filter(Boolean);
  const out={v:1,n:patient.name.split(' ')[0],t:profile.name,r:profile.role||'',d:todayISO(),m:opt.message.trim(),sc};
  if(opt.plan) out.pl=(patient.plan||[]).map(it=>{const f=findExercise(it.exId);return f?{n:f.ex.name,h:planInstructions(it),f:PLAN_FREQ[it.frequency]||'',o:it.dose||'',mt:f.ex.materials||'',du:f.ex.duration||''}:null;}).filter(Boolean);
  if(opt.events) out.ev=events.filter(e=>e.patientId===patient.id&&e.date>=todayISO()&&!e.done).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,4).map(e=>[e.date,e.time||'']);
  if(opt.attendance){const since=addDaysISO(todayISO(),-30);const ps=sessions.filter(s=>s.patientId===patient.id&&s.date>=since);out.at=[ps.filter(s=>sessionStatus(s)==='done').length,ps.filter(s=>sessionStatus(s)==='missed').length];}
  if(opt.contact&&profile.phone) out.ph=profile.phone;
  return out;
}

function FamilyShareModal({patient,onClose}){
  const {assessments,events,sessions,profile,updatePatient}=useStore();
  const available=Object.keys(SCALES).filter(k=>assessments.some(a=>a.patientId===patient.id&&a.scale===k));
  const [scales,setScales]=useState(available.filter(k=>!FAMILY_DEFAULT_OFF.includes(k)));
  const [opt,setOpt]=useState({plan:true,events:true,attendance:true,contact:!!profile.phone,message:''});
  const [pin,setPin]=useState(randomPin);
  const [link,setLink]=useState('');
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const [copied,setCopied]=useState(false);
  const toggle=k=>setScales(s=>s.includes(k)?s.filter(x=>x!==k):[...s,k]);
  const base=/^https?:$/.test(location.protocol)?location.origin+location.pathname:APP_PUBLIC_URL;
  const create=async()=>{
    if(!/^\d{4,8}$/.test(pin)){setErr('O PIN tem de ter entre 4 e 8 algarismos.');return;}
    if(!window.crypto||!crypto.subtle){setErr('Este browser não permite cifrar o link. Abra a app pelo endereço https.');return;}
    setErr('');setBusy(true);
    try{
      const summary=buildFamilySummary(patient,{assessments,events,sessions,profile},{...opt,scales});
      const enc=await encryptFamily(summary,pin);
      setLink(`${base}#familia=${enc}`);
      updatePatient(patient.id,{familyShares:[...(patient.familyShares||[]),{date:todayISO(),scales,plan:opt.plan,events:opt.events}]});
    }catch(e){setErr('Não foi possível criar o link: '+e.message);}
    setBusy(false);
  };
  const copy=async()=>{try{await navigator.clipboard.writeText(link);setCopied(true);setTimeout(()=>setCopied(false),2000);}catch(e){setErr('Não foi possível copiar. Selecione o link e copie à mão.');}};
  const share=async()=>{try{await navigator.share({title:'Age in Move — acompanhamento',text:`Acompanhamento de ${patient.name.split(' ')[0]} na Age in Move. Abra o link e introduza o PIN que lhe vou enviar à parte.`,url:link});}catch(e){}};
  const C=(k,label)=><label key={k} style={{display:'flex',gap:8,alignItems:'center',fontWeight:400,fontSize:14,margin:'4px 0',cursor:'pointer'}}><input type="checkbox" checked={!!opt[k]} onChange={e=>setOpt(o=>({...o,[k]:e.target.checked}))}/>{label}</label>;
  return(
    <Modal title={`Partilhar com a família — ${patient.name}`} onClose={onClose} wide>
      {err&&<div className="alert alert-warning">{err}</div>}
      {!link?(<>
        <p style={{fontSize:14,color:'#475569',marginBottom:12}}>Cria um link para a família ver a evolução em linguagem simples, os exercícios de casa e as próximas sessões. O resumo vai cifrado dentro do link e só abre com o PIN; não fica guardado em nenhum servidor. Mostra apenas o primeiro nome do cliente, sem contactos, diagnóstico nem notas clínicas.</p>
        <Section title="Escalas a mostrar"/>
        {available.length===0?<p style={{fontSize:13,color:'#64748b'}}>Sem avaliações registadas.</p>:
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{available.map(k=><button key={k} type="button" className={`btn btn-sm ${scales.includes(k)?'btn-primary':'btn-secondary'}`} onClick={()=>toggle(k)}>{scales.includes(k)?'✓ ':''}{FAMILY_SCALE[k]} ({SCALES[k].name})</button>)}</div>}
        <p style={{fontSize:12.5,color:'#64748b',marginTop:6}}>Humor (GDS) e cansaço do cuidador (Zarit) ficam de fora por omissão.</p>

// ─── PÁGINA DA FAMÍLIA (só de leitura, abre pelo link) ──────────────────────
function FamilySpark({pts,mn,mx,inv}){
  const W=220,H=56,pad=6;
  const vals=pts.map(p=>+p[1]);const lo=Math.min(mn,...vals),hi=Math.max(mx,...vals);
  const x=i=>pts.length===1?W/2:pad+i*(W-2*pad)/(pts.length-1);
  const y=v=>H-pad-((v-lo)/(hi-lo||1))*(H-2*pad);
  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',maxWidth:260,height:'auto',display:'block'}} aria-hidden="true">
      <line x1={pad} x2={W-pad} y1={H-pad} y2={H-pad} stroke="#e2e8f0"/>
      {pts.length>1&&<polyline points={pts.map((p,i)=>`${x(i)},${y(+p[1])}`).join(' ')} fill="none" stroke="#4361EE" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>}
      {pts.map((p,i)=><circle key={i} cx={x(i)} cy={y(+p[1])} r={i===pts.length-1?4:2.5} fill="#4361EE"/>)}
    </svg>
  );
}

const pathwayById=id=>PATHWAYS.find(p=>p.id===id)||null;
// Sugestões a partir do diagnóstico e do risco de queda
function suggestPathways(p){
  const out=PATHWAYS.filter(pw=>pw.match.test(p.diagnosis||''));
  const fallRisk=(+p.falls12m>=1)||(p.tug!=null&&+p.tug>=13.5)||(p.berg!=null&&+p.berg<=45);
  if(fallRisk&&!out.some(x=>x.id==='quedas')) out.push(pathwayById('quedas'));
  return out;
}
// Aplica um percurso: junta objetivos e exercícios que ainda não existem
function applyPathwayData(patient,pw,{goals,planIds}){
  const existing=new Set((patient.plan||[]).map(x=>+x.exId));
  let uid=Date.now();
  const add=pw.plan.filter(([id])=>planIds.includes(id)&&!existing.has(id)).map(([exId,version,frequency,dose])=>({uid:uid++,exId,version,frequency,dose,addedAt:todayISO(),pathway:pw.id}));
  const g=(patient.goals||'').trim();
  const newGoals=goals.filter(x=>!g.includes(x));
  return {pathway:pw.id,plan:[...(patient.plan||[]),...add],goals:[g,...newGoals.map(x=>'• '+x)].filter(Boolean).join('\n')};
}

function PathwayModal({patient,onClose,onAssess}){
  const {updatePatient,assessments}=useStore();
  const sug=suggestPathways(patient);
  const [pid,setPid]=useState(patient.pathway||(sug[0]&&sug[0].id)||PATHWAYS[0].id);
  const pw=pathwayById(pid);
  const inPlan=new Set((patient.plan||[]).map(x=>+x.exId));
  const [goals,setGoals]=useState(pw.goals);
  const [planIds,setPlanIds]=useState(pw.plan.map(x=>x[0]).filter(id=>!inPlan.has(id)));
  useEffect(()=>{setGoals(pw.goals);setPlanIds(pw.plan.map(x=>x[0]).filter(id=>!inPlan.has(id)));},[pid]);
  const lastOf=k=>assessments.filter(a=>a.patientId===patient.id&&a.scale===k).map(a=>a.date).sort().pop();
  const tg=(list,set,v)=>set(list.includes(v)?list.filter(x=>x!==v):[...list,v]);

// ─── PROGRAMA INTENSIVO ────────────────────────────────────────────────────
// Bloco de N semanas com várias sessões por semana, avaliação no início e reavaliação no fim.
const PROGRAM_WEEKDAYS=[[1,'Seg'],[2,'Ter'],[3,'Qua'],[4,'Qui'],[5,'Sex'],[6,'Sáb']];
function programRange(pr){return {start:pr.start,end:pr.end};}
function programStats(patient,{sessions,events,assessments}){
  const pr=patient.program;if(!pr) return null;
  const today=todayISO();
  const planned=events.filter(e=>e.programId===pr.id&&e.kind!=='reassess').length;
  const ps=sessions.filter(s=>s.patientId===patient.id&&s.date>=pr.start&&s.date<=pr.end);
  const done=ps.filter(s=>sessionStatus(s)==='done').length,missed=ps.filter(s=>sessionStatus(s)==='missed').length;
  const week=Math.min(pr.weeks,Math.max(1,Math.floor(daysBetween(pr.start,today)/7)+1));
  const pa=assessments.filter(a=>a.patientId===patient.id);
  const baseFrom=addDaysISO(pr.start,-14),baseTo=addDaysISO(pr.start,7),finalFrom=addDaysISO(pr.end,-7);
  const keys=Object.keys(SCALES);
  const cmp=keys.map(k=>{
    const list=pa.filter(a=>a.scale===k).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
    const b=list.filter(a=>a.date>=baseFrom&&a.date<=baseTo).pop();
    const f=list.filter(a=>a.date>=finalFrom).pop();
    if(!b&&!f) return null;
    let trend=null;
    if(b&&f&&f.id!==b.id){const d=Math.round((f.value-b.value)*10)/10,thr=Math.abs(DECLINE_THRESHOLD[k]||1),better=SCALES[k].inverse?d<0:d>0;trend=d===0?'Sem alteração':Math.abs(d)<thr?'Variação ligeira':better?'Melhoria':'Agravamento';}
    return {k,b,f:f&&b&&f.id===b.id?null:f,trend};
  }).filter(Boolean);
  const hasBaseline=cmp.some(c=>c.b), hasFinal=cmp.some(c=>c.f);
  const phase=today<pr.start?'antes':today>pr.end?'terminado':'a decorrer';
  return {pr,planned,done,missed,rate:done+missed?Math.round(done/(done+missed)*100):null,week,cmp,hasBaseline,hasFinal,phase};
}
function ProgramModal({patient,onClose}){
  const {addEvents,updatePatient}=useStore();
  const pw=pathwayById(patient.pathway);
  const [f,setF]=useState({start:nextWeekdayISO(1),weeks:'4',days:[1,3,5],time:'',final:true,goal:''});
  const [err,setErr]=useState('');
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const weeks=Math.max(1,Math.min(12,+f.weeks||4));
  const dates=[];for(let i=0;i<weeks*7;i++){const d=addDaysISO(f.start,i);if(f.days.includes(new Date(d+'T12:00:00').getDay()))dates.push(d);}
  const end=addDaysISO(f.start,weeks*7-1);
  const save=()=>{
    if(!f.days.length){setErr('Escolha pelo menos um dia da semana.');return;}
    if(f.days.length<2){setErr('Um programa intensivo tem pelo menos 2 sessões por semana.');return;}
    const id='p'+Date.now();const short=`${patient.name.split(' ')[0]} ${patient.name.split(' ').slice(-1)[0]}`;
    const evs=dates.map((d,i)=>({date:d,time:f.time||undefined,title:`Intensivo: ${short} (${i+1}/${dates.length})`,type:'session',patientId:patient.id,programId:id,color:'#1d4ed8'}));
    if(f.final) evs.push({date:end,time:f.time||undefined,title:`Reavaliação final: ${short}`,type:'session',patientId:patient.id,programId:id,kind:'reassess',color:'#1d4ed8'});
    addEvents(evs);
    const past=patient.program?[...(patient.pastPrograms||[]),{...patient.program,endedAt:patient.program.endedAt||todayISO(),note:'Substituído por um novo programa'}]:(patient.pastPrograms||[]);
    updatePatient(patient.id,{program:{id,start:f.start,end,weeks,perWeek:f.days.length,days:f.days,time:f.time,goal:f.goal.trim(),createdAt:todayISO()},pastPrograms:past});
    onClose();
  };
  return(
    <Modal title={`Programa intensivo — ${patient.name}`} onClose={onClose} wide>
      {err&&<div className="alert alert-warning">{err}</div>}
      <p style={{fontSize:14,color:'#475569',marginBottom:10}}>Um bloco de várias semanas com sessões frequentes, avaliação no início e reavaliação no fim, para medir o efeito do programa.</p>
      <div className="grid-3">
        <div className="form-group"><label>Início</label><input type="date" value={f.start} onChange={e=>set('start',e.target.value)}/></div>
        <div className="form-group"><label>Semanas (1–12)</label><input type="number" min={1} max={12} value={f.weeks} onChange={e=>set('weeks',e.target.value)}/></div>
        <div className="form-group"><label>Hora</label><input type="time" value={f.time} onChange={e=>set('time',e.target.value)}/></div>
      </div>
      <div className="form-group"><label>Dias da semana ({f.days.length} sessões por semana)</label>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{PROGRAM_WEEKDAYS.map(([d,l])=><button key={d} type="button" className={`btn btn-sm ${f.days.includes(d)?'btn-primary':'btn-secondary'}`} onClick={()=>set('days',f.days.includes(d)?f.days.filter(x=>x!==d):[...f.days,d].sort())}>{l}</button>)}</div>
      </div>
      <div className="form-group"><label>Objetivo do programa</label><input value={f.goal} onChange={e=>set('goal',e.target.value)} placeholder={pw?pw.goals[0]:'Ex.: TUG abaixo de 13,5 s no fim das 4 semanas'}/></div>
      <label style={{display:'flex',gap:8,alignItems:'center',fontWeight:400,fontSize:14,cursor:'pointer'}}><input type="checkbox" checked={f.final} onChange={e=>set('final',e.target.checked)}/>Agendar a reavaliação final no último dia ({fmtDate(end)})</label>
      <div className="alert alert-info" style={{marginTop:12,fontSize:13.5}}>Vão ser criadas <strong>{dates.length} sessões</strong> entre {fmtDate(f.start)} e {fmtDate(end)}{f.final?' e a reavaliação final':''}. Registe a avaliação inicial{pw?` (${pw.scales.map(([k])=>SCALES[k].name).join(', ')})`:''} até 7 dias depois do início.</div>
      {patient.program&&<p style={{fontSize:12.5,color:'#b45309'}}>Este cliente já tem um programa: o atual passa para o histórico.</p>}
      <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:12}}>
        <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={save}>Criar programa</button>
      </div>
    </Modal>
  );
}
function ProgramCard({patient,onAssess}){
  const store=useStore();const {updatePatient,setEvents}=store;

  const [confirm,setConfirm]=useState(null);
  if(!s) return null;
  const {pr}=s;
  const finish=cancel=>{
    if(cancel) setEvents(es=>es.filter(e=>!(e.programId===pr.id&&!e.done&&e.date>=todayISO())));
    updatePatient(patient.id,{program:null,pastPrograms:[...(patient.pastPrograms||[]),{...pr,endedAt:todayISO(),done:s.done,missed:s.missed,cancelled:!!cancel}]});
    setConfirm(null);

  return(
    <div className="card" style={{borderLeft:'4px solid #4361EE'}}>
      <div className="card-header" style={{marginBottom:6}}>

      <p style={{fontSize:13.5,color:'#475569'}}>{fmtDate(pr.start)} a {fmtDate(pr.end)} · {pr.perWeek}x por semana{pr.goal?` · ${pr.goal}`:''}</p>

        <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'#475569',marginBottom:4}}><span>Sessões realizadas</span><strong>{s.done}/{s.planned}{s.rate!=null?` · assiduidade ${s.rate}%`:''}</strong></div>
        <div className="progress-bar"><div className="progress-fill" style={{width:`${s.planned?Math.min(100,s.done/s.planned*100):0}%`,background:'#4361EE'}}/></div>
      </div>
      {!s.hasBaseline&&<p style={{fontSize:13,color:'#b45309'}}>Falta a avaliação inicial (até 7 dias depois do início). {onAssess&&<a href="#" onClick={e=>{e.preventDefault();onAssess();}}>Registar</a>}</p>}
      {s.phase==='terminado'&&!s.hasFinal&&<p style={{fontSize:13,color:'#b45309'}}>O programa terminou: falta a reavaliação final. {onAssess&&<a href="#" onClick={e=>{e.preventDefault();onAssess();}}>Registar</a>}</p>}
      {s.cmp.some(c=>c.b&&c.f)&&<div className="table-scroll" style={{marginTop:6}}><table className="table">
        <thead><tr><th>Escala</th><th>Início</th><th>Fim</th><th>Evolução</th></tr></thead>
        <tbody>{s.cmp.filter(c=>c.b&&c.f).map(c=><tr key={c.k}><td style={{fontWeight:600}}>{SCALES[c.k].name}</td><td>{fmtScale(c.k,c.b.value)}</td><td>{fmtScale(c.k,c.f.value)}</td><td><span className={`badge badge-${c.trend==='Melhoria'?'green':c.trend==='Agravamento'?'red':'gray'}`}>{c.trend}</span></td></tr>)}</tbody>
      </table></div>}
      {confirm&&<ConfirmBar text={confirm==='cancel'?'Cancelar o programa? As sessões futuras do programa são retiradas do calendário.':'Dar o programa por terminado? Fica no histórico do cliente.'} yes={confirm==='cancel'?'Cancelar programa':'Terminar'} onNo={()=>setConfirm(null)} onYes={()=>finish(confirm==='cancel')}/>}
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:8}}>
        <button className="btn btn-sm btn-secondary" onClick={()=>setConfirm('finish')}>Terminar programa</button>
        {s.phase!=='terminado'&&<button className="btn btn-sm btn-danger" onClick={()=>setConfirm('cancel')}>Cancelar</button>}
      </div>
    </div>
  );
}

function NewPatientPage({setPage,openPatient}){
  const {addPatient,addAssessments}=useStore();
  const [step,setStep]=useState(1);
  const [err,setErr]=useState('');
  const [form,setForm]=useState({...EMPTY_PATIENT});
  const [scores,setScores]=useState(()=>Object.fromEntries(Object.keys(SCALES).map(k=>[k,''])));
  const [scoreDetails,setScoreDetails]=useState({});
  const [scoreForm,setScoreForm]=useState(null);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const suggested=suggestPathways({diagnosis:form.diagnosis,falls12m:form.falls12m,tug:numOrNull(scores.tug),berg:numOrNull(scores.berg)});
  const [usePw,setUsePw]=useState('auto');
  const pwChoice=usePw==='auto'?(suggested[0]?suggested[0].id:''):usePw;
  const steps=[{n:1,label:'Identificação'},{n:2,label:'Clínico'},{n:3,label:'Avaliações'},{n:4,label:'Plano'}];
  const validate=st=>{
    if(st===1){
      if(!form.name.trim()) return 'Indique o nome completo.';
      if(!form.dob) return 'Indique a data de nascimento.';
      const a=ageFromDob(form.dob); if(a==null||a<0||a>120) return 'Data de nascimento inválida.';
      if(form.education!==''&&(+form.education<0||+form.education>25)) return 'Escolaridade entre 0 e 25 anos.';
      if(form.sns&&!/^\d{9}$/.test(form.sns.trim())) return 'O nº de utente do SNS tem 9 dígitos.';
    }
    if(st===2&&!form.diagnosis) return 'Selecione o diagnóstico principal.';
    if(st===3){const {error}=validateScales(scores);if(error)return error;}
    if(st===4&&!form.consent) return 'Registe o consentimento informado antes de criar o processo.';
    return '';
  };
  const next=()=>{
    const e=validate(step); setErr(e); if(e) return;
    if(step<4){setStep(s=>s+1);return;}
    const {parsed}=validateScales(scores);
    const t=todayISO();
    let data={...patientFromForm(form),...parsed,lastAssessed:Object.fromEntries(Object.entries(parsed).filter(([,v])=>v!=null).map(([k])=>[k,t]))};
    const pw=pwChoice&&pathwayById(pwChoice);
    if(pw) data={...data,...applyPathwayData(data,pw,{goals:pw.goals,planIds:pw.plan.map(x=>x[0])})};
    const p=addPatient(data);
    addAssessments(p.id,t,parsed,'Avaliação inicial',scoreDetails);
    openPatient(p.id);
  };
  const preview={education:numOrNull(form.education)};
  return(
    <div className="page" style={{maxWidth:760,margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:24}}>
        <button className="btn btn-secondary btn-sm" onClick={()=>setPage('patients')}>← Voltar</button>
        <div><h2 style={{fontSize:20,fontWeight:800,color:'#0f172a'}}>Novo Cliente</h2><p style={{fontSize:13,color:'#64748b'}}>Passo {step} de {steps.length}</p></div>
      </div>
      <div style={{display:'flex',marginBottom:28}}>
        {steps.map((s,i)=>(
          <React.Fragment key={s.n}>
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',flex:1}}>
              <div style={{width:32,height:32,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:14,background:step>s.n?'#16a34a':step===s.n?'#4361EE':'#e2e8f0',color:step>=s.n?'#fff':'#64748b'}}>{step>s.n?'✓':s.n}</div>
              <div style={{fontSize:11,marginTop:4,fontWeight:step===s.n?700:400,color:step===s.n?'#0f172a':'#64748b'}}>{s.label}</div>
            </div>
            {i<steps.length-1&&<div style={{flex:1,height:2,background:step>s.n?'#16a34a':'#e2e8f0',marginTop:16,alignSelf:'flex-start'}}/>}
          </React.Fragment>
        ))}
      </div>
      <div className="card">
        {err&&<div className="alert alert-warning">{err}</div>}
        {step===1&&(<>
          <div className="card-title" style={{marginBottom:12}}>Identificação</div>
          <PatientFields form={form} set={set} section="personal"/>
          <Section title="Cuidador e emergência"/>
          <PatientFields form={form} set={set} section="contacts"/>
        </>)}
        {step===2&&(<>
          <div className="card-title" style={{marginBottom:12}}>Informação clínica</div>
          <PatientFields form={form} set={set} section="clinical"/>
        </>)}
        {step===3&&(<>
          <div className="card-title" style={{marginBottom:4}}>Avaliação inicial</div>
          <p style={{fontSize:13,color:'#64748b',marginBottom:6}}>Preencha as escalas que aplicou. As restantes podem ser registadas mais tarde.{preview.education!=null?` O MMSE usa o corte para ${preview.education} anos de escolaridade.`:''}</p>
          <ScaleInputs values={scores} set={(k,v,typed)=>{setScores(x=>({...x,[k]:v}));if(typed)setScoreDetails(d=>{const n={...d};delete n[k];return n;});}} patient={preview} compact onOpenForm={setScoreForm} details={scoreDetails}/>
          {scoreForm&&<ScaleFormModal scale={scoreForm} patient={{...preview,name:form.name}} initial={scoreDetails[scoreForm]&&scoreDetails[scoreForm].items} onClose={()=>setScoreForm(null)} onApply={(total,d)=>{setScores(x=>({...x,[scoreForm]:String(total)}));setScoreDetails(x=>({...x,[scoreForm]:d}));}}/>}
        </>)}
        {step===4&&(<>
          <div className="card-title" style={{marginBottom:12}}>Plano terapêutico</div>
          <PatientFields form={form} set={set} section="plan"/>
          <div style={{border:'1px solid #ddd6fe',background:'#f5f3ff',borderRadius:10,padding:12,margin:'4px 0 12px'}}>
            <label style={{fontWeight:700,marginBottom:6}}>🧭 Percurso por condição</label>
            <select value={pwChoice} onChange={e=>setUsePw(e.target.value)}><option value="">Não aplicar</option>{PATHWAYS.map(x=><option key={x.id} value={x.id}>{x.icon} {x.name}{suggested.some(s=>s.id===x.id)?' (sugerido)':''}</option>)}</select>
            {pwChoice&&<p style={{fontSize:12.5,color:'#5b21b6',marginTop:6}}>Junta os objetivos-tipo e o plano inicial de "{pathwayById(pwChoice).name}" ({pathwayById(pwChoice).plan.length} exercícios). Pode ajustar tudo depois.</p>}
          </div>
          <PatientFields form={form} set={set} section="consent"/>
          <div className="alert alert-info" style={{marginTop:12}}><strong>Resumo:</strong> {form.name||'(sem nome)'} · {form.diagnosis||'(sem diagnóstico)'} · {MODULES.find(m=>m.id==form.module)?.name}{Object.entries(scores).filter(([,v])=>v!=='').map(([k,v])=>` · ${SCALES[k].name} ${v}`).join('')}</div>
        </>)}
        <div style={{display:'flex',justifyContent:'space-between',marginTop:24}}>
          <button className="btn btn-secondary" onClick={()=>{setErr('');step>1?setStep(s=>s-1):setPage('patients');}}>{step===1?'Cancelar':'← Anterior'}</button>
          <button className="btn btn-primary" onClick={next}>{step===4?'✓ Criar Cliente':'Seguinte →'}</button>
        </div>
      </div>
    </div>
  );
}

const EVENT_DONE={done:{icon:'✓',label:'Realizada',badge:'green'},missed:{icon:'✗',label:'Falta',badge:'red'},cancelled:{icon:'–',label:'Cancelada',badge:'gray'}};
const REPEAT={none:{label:'Não repetir',days:0},weekly:{label:'Todas as semanas',days:7},biweekly:{label:'De 15 em 15 dias',days:14},twice:{label:'2x por semana (+3 dias)',days:0}};
function addDaysISO(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function CalendarPage({openPatient}){
  const {events,setEvents,addEvents,patients,groups}=useStore();
  const [groupFor,setGroupFor]=useState(null);
  const NOW=new Date();
  const [cur,setCur]=useState({y:NOW.getFullYear(),m:NOW.getMonth()});
