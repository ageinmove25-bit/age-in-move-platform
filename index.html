<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Age in Move — idade em movimento</title>
<meta name="description" content="Age in Move — idade em movimento. Plataforma clínica de exercício físico e estimulação cognitiva."/>
<meta name="theme-color" content="#FF6200"/>
<link rel="preconnect" href="https://unpkg.com"/>
<link rel="preconnect" href="https://cdnjs.cloudflare.com"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;color:#1a202c}
:root{--primary:#FF6200;--primary-dark:#EE2800;--secondary:#EE2800;--primary-light:#fff4ec;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--sidebar-w:240px}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:#1e293b;color:#e2e8f0;display:flex;flex-direction:column;z-index:100}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid #334155;display:flex;align-items:center;gap:10px}
.sidebar-logo .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#FF6200,#EE2800);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.sidebar-logo span{font-weight:700;font-size:17px;color:#fff}
.sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto}
.nav-section{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.08em;padding:12px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:#94a3b8;font-size:14px;transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:#334155;color:#e2e8f0}
.nav-item.active{background:#FF6200;color:#fff}
.nav-item .icon{font-size:17px;width:22px;text-align:center}
.nav-item .badge{margin-left:auto;background:#ef4444;color:#fff;font-size:10px;padding:1px 6px;border-radius:10px}
.sidebar-footer{padding:12px 8px;border-top:1px solid #334155}
.main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-weight:700;font-size:18px;color:#0f172a}
.topbar-actions{display:flex;align-items:center;gap:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:500;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
.btn-secondary:hover{background:#e2e8f0}
.btn-danger{background:#fee2e2;color:#dc2626}
.btn-danger:hover{background:#fecaca}
.btn-sm{padding:5px 12px;font-size:13px}
.page{padding:24px;flex:1}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:20px;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-weight:700;font-size:16px;color:#0f172a}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;align-items:flex-start;gap:14px}
.stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.stat-label{font-size:12px;color:#64748b;font-weight:500}
.stat-value{font-size:28px;font-weight:800;color:#0f172a;line-height:1.1}
.stat-sub{font-size:12px;color:#64748b;margin-top:2px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
.badge-blue{background:#eff6ff;color:#1d4ed8}
.badge-green{background:#f0fdf4;color:#15803d}
.badge-yellow{background:#fffbeb;color:#b45309}
.badge-red{background:#fef2f2;color:#b91c1c}
.badge-purple{background:#faf5ff;color:#6d28d9}
.badge-gray{background:#f1f5f9;color:#475569}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;color:#1a202c;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,98,0,.15)}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:5px}
.form-group{margin-bottom:14px}
.tab-bar{display:flex;border-bottom:2px solid #e2e8f0;margin-bottom:20px;gap:4px}
.tab{padding:10px 16px;cursor:pointer;font-size:14px;font-weight:500;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
.tab:hover:not(.active){color:#334155}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;padding:10px 12px;font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid #e2e8f0}
.table td{padding:12px;border-bottom:1px solid #f1f5f9;font-size:14px;color:#334155}
.table tr:hover td{background:#f8fafc}
.table tr:last-child td{border-bottom:none}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
.progress-bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .4s}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;padding:28px}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:18px;font-weight:700;color:#0f172a}
.close-btn{width:32px;height:32px;border-radius:8px;background:#f1f5f9;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:#64748b}
.close-btn:hover{background:#e2e8f0}
.alert{padding:12px 16px;border-radius:8px;font-size:14px;margin-bottom:14px}
.alert-info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.alert-success{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.alert-warning{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.landing{min-height:100vh;background:linear-gradient(135deg,#1a0a00 0%,#3a1400 50%,#5a1e00 100%)}
.landing-nav{padding:20px 60px;display:flex;align-items:center;justify-content:space-between}
.landing-hero{padding:90px 60px 70px;text-align:center;color:#fff}
.landing-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,98,0,.2);border:1px solid rgba(255,98,0,.5);border-radius:40px;padding:8px 20px;font-size:13px;font-weight:600;color:#ffb37a;margin-bottom:28px;letter-spacing:.03em}
.landing-pill .dot{width:7px;height:7px;border-radius:50%;background:#FF6200;animation:pulse-dot 1.8s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
.landing-hero h1{font-size:64px;font-weight:900;line-height:1.05;margin-bottom:0;letter-spacing:-.02em}
.landing-hero h1 .line-plain{display:block;color:#fff}
.landing-hero h1 .line-grad{display:block;background:linear-gradient(100deg,#FFB070 0%,#FF6200 50%,#EE2800 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.landing-hero h1 .line-accent{display:block;font-size:42px;font-weight:700;color:rgba(255,255,255,.45);margin-top:6px;letter-spacing:.01em}
.landing-hero .hero-sub{font-size:18px;color:#ffc89a;max-width:560px;margin:24px auto 36px;line-height:1.65}
.landing-hero .hero-sub strong{color:#fff1e6;font-weight:600}
.landing-features{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:0 60px 80px;max-width:1200px;margin:0 auto}
.feature-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:28px;color:#fff}
.feature-card .fi{font-size:36px;margin-bottom:14px}
.feature-card h3{font-size:18px;font-weight:700;margin-bottom:8px}
.feature-card p{font-size:14px;color:#ffc89a;line-height:1.6}
.auth-page{min-height:100vh;background:linear-gradient(135deg,#1a0a00,#5a1e00);display:flex;align-items:center;justify-content:center}
.auth-card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:420px}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .icon{width:56px;height:56px;background:linear-gradient(135deg,#FF6200,#EE2800);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-dow{text-align:center;font-size:12px;font-weight:700;color:#64748b;padding:6px}
.cal-day{min-height:80px;background:#f8fafc;border-radius:8px;padding:6px;cursor:pointer;transition:background .15s;border:1px solid #e2e8f0}
.cal-day:hover{background:#eff6ff}
.cal-day.today{border:2px solid var(--primary);background:#fff4ec}
.cal-day.other-month{opacity:.35}
.cal-day .day-num{font-size:12px;font-weight:700;color:#475569;margin-bottom:3px}
.cal-event{font-size:10px;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.grid-4{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr}}
.pricing-section{padding:60px 60px 80px;max-width:1200px;margin:0 auto}
.pricing-section h2{text-align:center;color:#fff;font-size:36px;font-weight:900;margin-bottom:8px}
.pricing-section .sub{text-align:center;color:#ffc89a;font-size:16px;margin-bottom:48px}
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.pricing-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:32px;color:#fff;position:relative;transition:transform .2s,box-shadow .2s}
.pricing-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.3)}
.pricing-card.featured{background:linear-gradient(135deg,rgba(37,99,235,.5),rgba(124,58,237,.4));border:2px solid rgba(99,102,241,.6);transform:scale(1.04)}
.pricing-card.featured:hover{transform:scale(1.04) translateY(-4px)}
.pricing-badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#FF6200,#EE2800);color:#fff;font-size:12px;font-weight:700;padding:4px 16px;border-radius:20px;white-space:nowrap}
.pricing-name{font-size:14px;font-weight:700;color:#ffc89a;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
.pricing-price{display:flex;align-items:flex-end;gap:4px;margin-bottom:6px}
.pricing-price .amount{font-size:48px;font-weight:900;line-height:1}
.pricing-price .period{font-size:14px;color:#ffc89a;margin-bottom:8px}
.pricing-desc{font-size:13px;color:#ffc89a;margin-bottom:24px;line-height:1.5}
.pricing-features{list-style:none;margin-bottom:28px}
.pricing-features li{padding:7px 0;font-size:13px;color:#e2e8f0;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:8px}
.pricing-features li:last-child{border-bottom:none}
.pricing-features li .check{color:#34d399;font-size:14px;flex-shrink:0}
.pricing-features li .cross{color:#f87171;font-size:14px;flex-shrink:0}
.btn-outline-white{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff}
.btn-outline-white:hover{background:rgba(255,255,255,.1)}
.pricing-note{text-align:center;color:#64748b;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a0a00,#5a1e00);color:#fff;font-family:'Segoe UI',sans-serif"><div style="font-size:26px;font-weight:800">Age in Move</div><div style="color:#FF9040;font-style:italic;margin-top:4px">idade em movimento</div><div style="margin-top:18px;font-size:13px;color:#ffc89a">A carregar a plataforma…</div></div></div>
<script type="text/babel">
const {useState,useEffect,useContext,createContext,useCallback}=React;

const MODULES=[
  {id:1,name:'Memória e Atenção',icon:'🧠',color:'#4f46e5',bg:'#ede9fe',exercises:8,duration:'45 min',difficulty:'Moderado',type:'cognitivo',
   description:'Exercícios para estimulação da memória episódica, memória de trabalho e capacidade de atenção sustentada. Baseados no modelo multicomponente de Baddeley & Hitch e no treino de memória contextual.',
   exercises_list:[
    {id:101,name:'Sequências de Palavras',objective:'Treinar a memória verbal de curto prazo através da codificação e evocação imediata de listas de palavras com complexidade crescente (3 a 7 itens).',cognitive:'Memória verbal a curto prazo, loop fonológico, atenção seletiva',duration:'10 min',difficulty:'Fácil',materials:'Cartões com palavras (conjuntos A/B/C por dificuldade), folha de registo',instructions:'Apresentar lista oralmente a 1 palavra/segundo. Aguardar 10s e pedir evocação livre. Registar número correto, intrusões e ordem. Repetir 3 tentativas.'},
    {id:102,name:'Histórias e Detalhes',objective:'Estimular a memória episódica e a capacidade de recordação narrativa com histórias de contexto quotidiano familiar ao paciente geriátrico.',cognitive:'Memória episódica, compreensão verbal, memória semântica',duration:'15 min',difficulty:'Moderado',materials:'Textos curtos (8-12 frases), folha de perguntas com 10 itens de controlo',instructions:'Ler história em voz alta (2 vezes). Após 5 minutos de distração, aplicar questionário. Pontuar: 1 ponto por detalhe correto. Registar evocação imediata e diferida (30 min).'},
    {id:103,name:'Atenção Dividida',objective:'Desenvolver a capacidade de distribuir e manter atenção em dois fluxos de informação simultâneos, simulando exigências da vida diária.',cognitive:'Atenção dividida, velocidade de processamento, memória de trabalho',duration:'12 min',difficulty:'Difícil',materials:'Cronómetro digital, fichas de dupla tarefa (contagem + identificação visual)',instructions:'Tarefa A: contar em voz alta de 3 em 3. Tarefa B: identificar imagens de animais em sequência visual. Aplicar combinadas. Registar erros em cada tarefa. Aumentar ritmo progressivamente.'},
    {id:104,name:'Span de Dígitos',objective:'Avaliar e treinar a capacidade de memória imediata através de sequências numéricas em ordem direta e inversa — adaptação do subteste WAIS.',cognitive:'Memória de trabalho, atenção sustentada, executivo central',duration:'8 min',difficulty:'Moderado',materials:'Protocolo de dígitos (sequências 3 a 9 dígitos), folha de registo',instructions:'Ordem direta: ditar sequência e pedir repetição imediata. Ordem inversa: ditar e pedir em sentido contrário. Iniciar com 3 dígitos. Avançar após 2 acertos. Registar span máximo.'},
    {id:105,name:'Memória de Localização',objective:'Trabalhar a memória espacial implícita e explícita através da identificação e recordação de posições de objetos num quadro de referência.',cognitive:'Memória visuo-espacial, memória episódica, atenção visual',duration:'10 min',difficulty:'Fácil',materials:'Tabuleiro 4x4 com 8 objetos do quotidiano, coberta opaca, cronómetro',instructions:'Mostrar tabuleiro 30 segundos. Cobrir e remover/mover 3 objetos. Pedir ao paciente que identifique o que mudou e reponha posição original. 4 tentativas com grau crescente.'},
    {id:106,name:'Recordação com Pistas',objective:'Estimular estratégias de codificação semântica e recuperação assistida por pistas categoriais e fonéticas para contornar falhas de evocação.',cognitive:'Memória semântica, memória episódica, estratégias mnemónicas',duration:'12 min',difficulty:'Moderado',materials:'Lista de 12 palavras (4 categorias), fichas de pistas categoriais e fonéticas',instructions:'Fase de codificação: apresentar 12 palavras com pistas semânticas. Evocação livre (5 min intervalo). Se falha: pista categorial. Se continua: pista fonética. Registar tipo de ajuda necessária por item.'},
    {id:107,name:'Atenção Sustentada — CPT Simplificado',objective:'Medir e treinar a capacidade de manter atenção ao longo do tempo através de tarefa de vigilância com estímulos-alvo dispersos em sequência.',cognitive:'Atenção sustentada, vigilância, inibição de resposta',duration:'15 min',difficulty:'Difícil',materials:'Baralhado de 60 cartas (20 alvo, 40 distratores), folha de registo, cronómetro',instructions:'Apresentar cartas a 1/segundo. Paciente bate na mesa apenas ao ver carta-alvo (ex: animais). Registar acertos, omissões e falsas alarmes. Calcular índice de sensibilidade. 3 blocos de 20 cartas.'},
    {id:108,name:'Reconhecimento Visual Diferido',objective:'Avaliar a retenção de informação visual ao longo de um intervalo de retenção, distinguindo entre memória de reconhecimento e de evocação.',cognitive:'Memória de reconhecimento, memória visual a longo prazo, discriminação percetual',duration:'10 min',difficulty:'Moderado',materials:'20 imagens coloridas (10 alvo + 10 distratores), timer, folha de resposta Sim/Não',instructions:'Fase de estudo: mostrar 10 imagens (3s cada). Intervalo 15 min (tarefas distratoras). Fase de teste: mostrar 20 imagens misturadas, resposta Sim/Não. Calcular % acertos e falsos alarmes.'},
  ]},
  {id:2,name:'Linguagem e Comunicação',icon:'💬',color:'#0891b2',bg:'#e0f2fe',exercises:6,duration:'40 min',difficulty:'Fácil',type:'cognitivo',
   description:'Estimulação da fluência verbal, nomeação, compreensão auditiva e discurso narrativo. Protocolos adaptados de terapia da linguagem geriátrica com foco na comunicação funcional.',
   exercises_list:[
    {id:201,name:'Fluência Verbal Semântica',objective:'Avaliar e estimular o acesso lexical e a organização categorial através de tarefas de geração verbal por categorias semânticas com tempo controlado.',cognitive:'Linguagem expressiva, memória semântica, velocidade de processamento',duration:'8 min',difficulty:'Fácil',materials:'Folha de registo por categoria, cronómetro, lápis',instructions:'Dar 60 segundos por categoria (animais, frutas, profissões, palavras com letra F). Registar total, intrusões e perseverações. Comparar com normas: <10 palavras/min = abaixo do esperado. 4 categorias por sessão.'},
    {id:202,name:'Nomeação por Confrontação',objective:'Estimular o acesso à representação léxico-semântica de objetos, ações e conceitos através de confrontação visual com imagens standardizadas.',cognitive:'Linguagem expressiva, memória semântica, processamento visual',duration:'12 min',difficulty:'Moderado',materials:'Baralho de 30 imagens (BNT adaptado), fichas de pistas semânticas e fonéticas',instructions:'Mostrar imagem 5 segundos. Aguardar resposta espontânea. Se falha (10s): pista semântica. Se continua: pista fonética (1ª sílaba). Registar: espontâneo / com pista semântica / com pista fonética / falha. Calcular perfil de erros.'},
    {id:203,name:'Completamento de Frases',objective:'Trabalhar o acesso lexical em contexto sintático, ativando o conhecimento enciclopédico e a memória semântica procedural.',cognitive:'Linguagem expressiva e receptiva, memória semântica, processamento sintático',duration:'10 min',difficulty:'Fácil',materials:'20 frases incompletas impressas (4 níveis de dificuldade), caneta',instructions:'Ler frase em voz alta, deixando última palavra em aberto. Ex: "O sol nasce de ___". Aguardar 5s. Aceitar sinónimos semânticos. Registar latência de resposta e tipo de erro. Progredir para frases com 2 lacunas.'},
    {id:204,name:'Compreensão de Ordens Complexas',objective:'Estimular a compreensão de comandos verbais de complexidade crescente, avaliando o processamento de informação sintática e semântica encadeada.',cognitive:'Linguagem receptiva, memória de trabalho, atenção auditiva',duration:'10 min',difficulty:'Moderado',materials:'Protocolo de ordens (simples, duplas, triplas), objetos do quotidiano na mesa',instructions:'Dar ordens progressivas: "Toque no copo" → "Pegue no lápis e coloque-o à esquerda do papel" → "Antes de me dar o livro, bata 3 vezes na mesa e diga o seu nome". Registar execução correta por nível. Máx. 3 tentativas por nível.'},
    {id:205,name:'Descrição de Cenas',objective:'Estimular a linguagem espontânea, organização do discurso e capacidade narrativa através da descrição estruturada de imagens complexas de contexto social.',cognitive:'Linguagem expressiva espontânea, atenção visual, memória de trabalho',duration:'12 min',difficulty:'Moderado',materials:'3 imagens de cenas quotidianas (em casa, na rua, no mercado), grelha de análise do discurso',instructions:'Mostrar imagem e pedir: "Descreva tudo o que vê". Registar: nº de unidades de informação, coerência, fluência, erros gramaticais. Orientar com perguntas-guia se produção < 3 frases. Cronometrar 2 minutos por imagem.'},
    {id:206,name:'Compreensão de Provérbios',objective:'Trabalhar a linguagem figurada, o raciocínio abstrato e o acesso ao conhecimento cultural, diferenciando compreensão literal de metafórica.',cognitive:'Linguagem abstrata, memória semântica cultural, raciocínio',duration:'8 min',difficulty:'Difícil',materials:'Lista de 10 provérbios portugueses familiares à geração, fichas de interpretação múltipla escolha',instructions:'Ler provérbio. Pedir explicação espontânea. Se falha: apresentar 3 opções de interpretação (1 correta, 1 literal, 1 absurda). Registar tipo de resposta. Discutir contextos de uso. Excelente atividade para validação da identidade cultural.'},
  ]},
  {id:3,name:'Funções Executivas',icon:'⚙️',color:'#059669',bg:'#d1fae5',exercises:7,duration:'50 min',difficulty:'Difícil',type:'cognitivo',
   description:'Treino do sistema executivo prefrontal: planeamento, inibição de resposta, flexibilidade cognitiva, monitorização e raciocínio abstrato. Baseado no modelo de Luria e nos paradigmas de Miyake et al.',
   exercises_list:[
    {id:301,name:'Torre de Hanói Simplificada',objective:'Desenvolver o planeamento sequencial, a antecipação de consequências e a resolução de problemas através da versão adaptada de 3 discos.',cognitive:'Planeamento, raciocínio, memória de trabalho, inibição de resposta prepotente',duration:'15 min',difficulty:'Difícil',materials:'Set de Torre de Hanói (3 pinos, 3 discos), folha de registo de movimentos',instructions:'Demonstrar regra (apenas um disco por vez, disco maior nunca sobre menor). Meta: mover torre do pino A ao pino C. Registar nº de movimentos (óptimo=7), tempo, erros de regra. Começar com 2 discos. Progredir para 3.'},
    {id:302,name:'Sequências e Padrões Numéricos',objective:'Identificar regras em sequências numéricas e completar padrões, trabalhando o raciocínio indutivo e a memória de trabalho numérica.',cognitive:'Raciocínio numérico, raciocínio indutivo, flexibilidade cognitiva',duration:'10 min',difficulty:'Moderado',materials:'Fichas com 15 sequências numéricas (3 níveis), lápis, borracha',instructions:'Apresentar sequência com lacuna: ex. 2, 4, 6, __ ou 3, 6, 12, __. Pedir o número em falta e a regra. Registar acertos e tipo de erro. Nível 1: aritméticas simples. Nível 2: múltiplas operações. Nível 3: padrões figurativos.'},
    {id:303,name:'Classificação de Objetos',objective:'Exercitar a flexibilidade cognitiva através da categorização de objetos segundo critérios múltiplos e alternados (forma, cor, função, material).',cognitive:'Flexibilidade cognitiva, abstração, inibição de set cognitivo',duration:'10 min',difficulty:'Moderado',materials:'20 cartões com objetos variados, caixas de categorias, cronómetro',instructions:'Fase 1: classificar por cor. Fase 2 (sem aviso): classificar pelos mesmos objetos por função. Registar tempo de adaptação à mudança de critério, erros de perseveração. Simulação do Wisconsin Card Sorting Test simplificado.'},
    {id:304,name:'Semelhanças e Diferenças Abstratas',objective:'Estimular o pensamento abstrato e conceptual através da identificação de categorias superordenadas e distinções entre pares de conceitos.',cognitive:'Pensamento abstrato, linguagem semântica, raciocínio conceptual',duration:'8 min',difficulty:'Difícil',materials:'Lista de 12 pares de palavras (concretas → abstratas), grelha de pontuação (0-2)',instructions:'Apresentar par: "Em que se parecem um cão e um leão?" Pontuar: 0=sem resposta/errada; 1=resposta concreta (têm patas); 2=abstrata (são animais/mamíferos). Progredir para pares abstratos: alegria/tristeza, mentira/engano.'},
    {id:305,name:'Planeamento de Tarefas Quotidianas',objective:'Exercitar o planeamento e a organização temporal de atividades da vida diária, trabalhando a tomada de decisões em contexto ecológico.',cognitive:'Planeamento, organização, tomada de decisão, memória prospetiva',duration:'12 min',difficulty:'Moderado',materials:'Fichas com cenários quotidianos, cartões de tarefas para ordenar, cronómetro',instructions:'Apresentar cenário: "Tem uma consulta às 10h, precisa de ir ao banco e comprar pão. O banco fecha às 12h, a padaria abre às 8h." Pedir ordem de tarefas + justificação. Avaliar viabilidade do plano e eficiência.'},
    {id:306,name:'Go/No-Go — Inibição de Resposta',objective:'Treinar o controlo inibitório e a supressão de respostas automáticas através de tarefa de resposta/não-resposta a estímulos-alvo e distratores.',cognitive:'Inibição de resposta, atenção seletiva, controlo executivo',duration:'10 min',difficulty:'Difícil',materials:'Baralho de 40 cartas (25 Go + 15 No-Go), cronómetro, folha de registo',instructions:'Instrução: bater palma APENAS quando ver animal (Go). NÃO bater se for planta (No-Go). Ritmo: 1 carta/2s. Registar: tempo de reação, omissões (animais não batidos), erros comissão (plantas batidas). 3 blocos.'},
    {id:307,name:'Trail Making Adaptado',objective:'Avaliar e estimular a atenção alternada e a flexibilidade cognitiva através de tarefa de conexão sequencial alternada de números e letras.',cognitive:'Atenção alternada, velocidade de processamento, flexibilidade cognitiva',duration:'8 min',difficulty:'Difícil',materials:'Folhas Trail Making A e B (versão geriátrica com fonte ampliada), lápis, cronómetro',instructions:'Parte A: ligar números 1-2-3...25 por ordem. Parte B: alternar números e letras (1-A-2-B-3-C...). Cronometrar cada parte. Calcular índice B/A (normal < 3). Erros contam +30s ao tempo. Referência: TMT-A < 90s; TMT-B < 3 min.'},
  ]},
  {id:4,name:'Orientação Espacial',icon:'🗺️',color:'#d97706',bg:'#fef3c7',exercises:5,duration:'35 min',difficulty:'Moderado',type:'cognitivo',
   description:'Estimulação da orientação espaço-temporal, reconhecimento de ambientes familiares e navegação espacial. Trabalha a memória topográfica e a orientação alocêntrica e egocêntrica.',
   exercises_list:[
    {id:401,name:'Rotação Mental de Figuras',objective:'Treinar a capacidade de imaginar e manipular mentalmente objetos tridimensionais, estimulando o raciocínio espacial e a visualização cognitiva.',cognitive:'Perceção espacial, raciocínio visual, imagem mental',duration:'12 min',difficulty:'Difícil',materials:'Fichas com pares de figuras geométricas 2D/3D em diferentes orientações, cronómetro',instructions:'Mostrar figura-alvo e 4 alternativas. Pedir qual é a mesma figura em orientação diferente. Cronometrar decisão. Nível 1: figuras 2D rotações 90°. Nível 2: figuras 3D. Nível 3: rotações múltiplos eixos. Registar acertos e latência.'},
    {id:402,name:'Orientação no Mapa do Bairro',objective:'Trabalhar a orientação topográfica através do reconhecimento e navegação em mapas simplificados de ambientes familiares (bairro, cidade).',cognitive:'Memória topográfica, orientação espacial, raciocínio espacial',duration:'10 min',difficulty:'Moderado',materials:'Mapa simplificado do bairro/cidade do paciente (escala 1:5000), fichas de perguntas',instructions:'Mostrar mapa. Pedir ao paciente que identifique pontos de referência conhecidos. Tarefa: "Como vai da sua casa ao mercado?" Registar estratégia de navegação (marcos vs. coordenadas). Adaptar ao nível de familiaridade geográfica.'},
    {id:403,name:'Reconhecimento de Trajetos',objective:'Estimular a memória de rota e o reconhecimento de percursos através de sequências fotográficas de ambientes reais.',cognitive:'Memória episódica espacial, reconhecimento visual, memória de rota',duration:'8 min',difficulty:'Fácil',materials:'Sequência de 8 fotografias de um percurso real, versão embaralhada para reconhecimento',instructions:'Mostrar sequência correta do trajeto. 5 min de distração. Apresentar versão embaralhada e pedir reordenação. Variante: identificar "onde foi tirada esta foto" num mapa. Usar trajetos familiares ao paciente (entre casa e ponto de referência habitual).'},
    {id:404,name:'Perspetiva Visual — O Que Vê o Outro?',objective:'Desenvolver a capacidade de adotar perspetivas espaciais alternativas, crucial para a navegação e para a compreensão de descrições espaciais.',cognitive:'Tomada de perspetiva, raciocínio espacial egocêntrico vs. alocêntrico',duration:'8 min',difficulty:'Difícil',materials:'Mesa com 4 objetos, fotografia da disposição de diferentes ângulos, fichas de resposta',instructions:'Colocar 4 objetos na mesa. Mostrar fotografia tirada de outro ângulo. Perguntar: "Se eu estivesse sentado do outro lado, o que estaria à minha direita?" Aumentar complexidade com mais objetos e rotações de 45°.'},
    {id:405,name:'Orientação Temporal e Calendário',objective:'Reforçar a orientação no tempo real (data, estação, eventos recentes) através de atividades estruturadas com calendário e jornal.',cognitive:'Orientação temporal, memória episódica recente, atenção',duration:'8 min',difficulty:'Fácil',materials:'Calendário de parede, jornal do dia, relógio analógico, folha de orientação temporal',instructions:'10 questões de orientação: data, dia da semana, mês, estação, ano, hora, último evento noticiado. Pontuação: 1 ponto cada. Score < 7 indica desorientação significativa. Complementar com discussão de eventos recentes relevantes para o paciente.'},
  ]},
  {id:5,name:'Habilidades Visuo-Espaciais',icon:'👁️',color:'#7c3aed',bg:'#f3e8ff',exercises:6,duration:'40 min',difficulty:'Moderado',type:'cognitivo',
   description:'Estimulação das capacidades percetivo-visuais, práxis construtiva e integração visuo-motora. Exercícios baseados em provas neuropsicológicas clássicas adaptadas à população geriátrica.',
   exercises_list:[
    {id:501,name:'Cópia de Figuras Geométricas',objective:'Avaliar e estimular a práxis construtiva bidimensional através da reprodução de figuras geométricas com complexidade crescente.',cognitive:'Práxis construtiva, perceção visual, coordenação visuo-motora',duration:'15 min',difficulty:'Moderado',materials:'Fichas com figuras (cubo, casa, pentágonos, figura de Rey simplificada), lápis de carvão',instructions:'Apresentar figura modelo, pedir cópia lado a lado. Critérios: proporção, orientação, elementos presentes. Pontuar 0-2 por figura. Progredir: quadrado → losango → cubo → figura complexa. Não apagar — os erros são informativos.'},
    {id:502,name:'Puzzles e Montagem de Objetos',objective:'Estimular a perceção da parte-todo, o raciocínio espacial e a práxis construtiva tridimensional através de montagem de peças.',cognitive:'Análise perceptual, síntese visuo-espacial, práxis construtiva',duration:'12 min',difficulty:'Moderado',materials:'Puzzles de 12-24 peças com imagens familiares (paisagens, objetos do quotidiano)',instructions:'Começar com 12 peças para DCL/DA. Usar 24 peças para pacientes com bom funcionamento. Cronometrar. Observar estratégia: bordas primeiro? Cores? Registar necessidade de dicas espaciais. Excelente para sessões em grupo.'},
    {id:503,name:'Continuação de Padrões Visuais',objective:'Trabalhar a identificação de regularidades visuais e a capacidade de projetar sequências de padrões, estimulando o raciocínio indutivo não-verbal.',cognitive:'Raciocínio visual indutivo, atenção visual, perceção de padrões',duration:'8 min',difficulty:'Moderado',materials:'Fichas com 12 sequências visuais incompletas (3 níveis: cor, forma, padrão combinado)',instructions:'Mostrar sequência com quadrado vazio no final: ex. ○ △ □ ○ △ __. Pedir completamento. Nível 1: cores alternadas. Nível 2: formas em progressão. Nível 3: matriz 3x3 (tipo Raven). Registar estratégia verbal do paciente.'},
    {id:504,name:'Matrizes Visuais de Reconhecimento',objective:'Estimular a discriminação visual fina e a memória de reconhecimento de padrões complexos através de matrizes estímulo-resposta.',cognitive:'Perceção visual fina, discriminação de forma, memória de reconhecimento visual',duration:'10 min',difficulty:'Difícil',materials:'20 fichas matriz (1 estímulo + 4 opções), lupa opcional para baixa visão',instructions:'Mostrar figura estímulo 5s. Cobrir. Apresentar 4 opções (1 idêntica + 3 distractores com pequenas diferenças). Pedir identificação. Progredir de diferenças grandes para subtis. Adaptar tamanho para condições visuais do paciente.'},
    {id:505,name:'Blocos de Kohs Adaptado',objective:'Estimular a análise e síntese visuo-espacial tridimensional através da reprodução de padrões com blocos coloridos.',cognitive:'Análise visuo-espacial, planeamento, práxis construtiva 3D',duration:'10 min',difficulty:'Difícil',materials:'Set de 9 cubos com faces bicolores (vermelho/branco), 6 cartões de padrões-alvo',instructions:'Mostrar cartão-modelo. Pedir reprodução com blocos. Iniciar com padrão 2x2. Progredir para 3x3. Cronometrar (limite 120s/padrão). Não corrigir durante execução — observar estratégia. Registar rotações erradas vs. inversões de cor.'},
    {id:506,name:'Reconhecimento de Faces e Expressões',objective:'Trabalhar a perceção de identidade facial e o reconhecimento de emoções básicas através de expressões faciais, área frequentemente afetada nas demências.',cognitive:'Perceção facial, reconhecimento emocional, memória de identidade',duration:'10 min',difficulty:'Fácil',materials:'20 fotografias de faces (10 pares identidade + 10 expressões emocionais), folha de resposta',instructions:'Parte A: mostrar 5 faces de pessoas famosas (contexto cultural português). Parte B: 6 expressões básicas (alegria, tristeza, raiva, medo, surpresa, nojo). Registar acertos e confusões. Iniciar conversa sobre emoções — potencial terapêutico adicional.'},
  ]},
  {id:6,name:'Praxias e Motricidade',icon:'✋',color:'#e11d48',bg:'#ffe4e6',exercises:8,duration:'45 min',difficulty:'Fácil',type:'cognitivo',
   description:'Estimulação das praxias ideomotoras, ideacionais e construtivas, e da motricidade fina. Exercícios essenciais para manter a independência nas AVDs e prevenir o declínio motor-cognitivo.',
   exercises_list:[
    {id:601,name:'Sequências de Movimentos das Mãos',objective:'Executar e memorizar sequências rítmicas de movimentos manuais de complexidade crescente, estimulando a memória procedimental e a coordenação.',cognitive:'Memória procedimental, atenção, coordenação motora, ritmo',duration:'10 min',difficulty:'Fácil',materials:'Nenhum (opcional: superfície de mesa plana)',instructions:'Demonstrar sequência: punho-palma-lado (Luria). Pedir imitação. Progredir para 5 passos. Depois sem modelo (de memória). Registar erros de sequência vs. erros de movimento. Variante bimanhual: mão D e E com movimentos diferentes simultâneos.'},
    {id:602,name:'Gestos Simbólicos e Transitivos',objective:'Avaliar e estimular as praxias ideomotoras através da execução de gestos com e sem objeto, diferenciando praxia simbólica de instrumental.',cognitive:'Praxia ideomotora, representação motora, memória semântica motora',duration:'10 min',difficulty:'Fácil',materials:'Objetos do quotidiano (escova, colher, tesoura, pente), fichas de imitação',instructions:'Parte A (transitivos com objeto): usar escova para pentear. Parte B (transitivos sem objeto): fazer como se penteia o cabelo. Parte C (intransitivos): acenar adeus, fazer sinal de silêncio. Registar latência e qualidade do gesto. Erros de conteúdo vs. erros de produção.'},
    {id:603,name:'Traçado em Labirintos',objective:'Desenvolver a coordenação visuo-motora fina e o planeamento de percurso através de labirintos com complexidade progressiva.',cognitive:'Coordenação visuo-motora, planeamento, atenção visuo-espacial',duration:'8 min',difficulty:'Moderado',materials:'6 fichas de labirintos (3 níveis), lápis, borracha, cronómetro',instructions:'Nível 1: percurso simples sem impasses. Nível 2: 3 impasses. Nível 3: múltiplos caminhos falsos. Cronometrar. Contar toques nas paredes. Observar estratégia: ensaio mental antes de traçar? Impulsividade? Avaliar tremor e precisão do traço.'},
    {id:604,name:'Coordenação Bimanual',objective:'Estimular a coordenação de movimentos simultâneos e alternados entre as duas mãos, fundamental para AVDs como abotoar, preparar refeições e escrever.',cognitive:'Coordenação bimanual, atenção, automatização motora',duration:'10 min',difficulty:'Moderado',materials:'Painel de encaixes bimanual, botões/molas para AVDs, bolas de estimulação',instructions:'Tarefa 1: tampar/destampar recipientes com mãos alternadas. Tarefa 2: apertar parafusos com chave e segurar com outra mão. Tarefa 3: dobrar lenço com ambas as mãos. Cronometrar e registar erros. Progredir para tarefas de ritmos assimétricos.'},
    {id:605,name:'Origami Terapêutico — Dobrar Papel',objective:'Estimular a motricidade fina, o planeamento espacial e a memória procedimental através de dobragens de papel com grau crescente de complexidade.',cognitive:'Motricidade fina, planeamento, memória procedimental, perceção espacial',duration:'12 min',difficulty:'Moderado',materials:'Papel A4 colorido (mínimo 10 folhas), fichas com instruções visuais passo-a-passo',instructions:'Progressão: 1. dobrar ao meio (envelope simples); 2. barco de papel (4 passos); 3. avião (6 passos); 4. flor simples (8 passos). Demonstrar cada passo. Verificar execução paralela. Excelente para motivação: o produto final é tangível e pode ser dado ao cuidador.'},
    {id:606,name:'Destreza com Objetos — Peg Board',objective:'Avaliar e estimular a velocidade e precisão da motricidade fina unilateral e bilateral através de tarefa de inserção e transferência de pinos.',cognitive:'Motricidade fina, velocidade psicomotora, atenção',duration:'8 min',difficulty:'Fácil',materials:'Purdue Peg Board adaptado (ou alternativa: caixas de ovos com berlindes/botões)',instructions:'Tarefa 1 (mão dominante): inserir o máximo de pinos em 30s. Tarefa 2 (mão não-dominante): idem. Tarefa 3 (bimanual): 1 pino com cada mão alternado. Registar contagem por condição. Comparar mão D vs. E. Normas geriátricas disponíveis no protocolo.'},
    {id:607,name:'Escrita e Grafomotricidade',objective:'Manter a automatização do grafismo e estimular a expressão escrita através de tarefas de cópia, ditado e escrita espontânea.',cognitive:'Praxia grafomotora, ortografia, linguagem escrita, atenção',duration:'10 min',difficulty:'Fácil',materials:'Folhas com linhas, caneta de ponta grossa (adaptar para tremor), modelo de texto',instructions:'Sequência: 1. cópia de frase curta; 2. escrita do próprio nome e morada; 3. ditado de 5 palavras; 4. escrever 1 frase sobre o que fez ontem. Observar: tremor, micrografia (Parkinson), omissões de letras, hemineglect. Valioso para monitorização longitudinal.'},
    {id:608,name:'Praxia Ideacional — Sequências de AVDs',objective:'Avaliar e treinar a capacidade de executar sequências de ações funcionais complexas na ordem correta, fundamental para a independência nas AVDs.',cognitive:'Praxia ideacional, planeamento de ação, memória procedimental, sequenciação',duration:'10 min',difficulty:'Moderado',materials:'Objetos reais de AVDs: copo, saqueta de chá, chaleira (fria), colher, açúcar',instructions:'Pedir ao paciente que prepare um chá (sem demonstração prévia). Observar: ordem de ações, uso correto dos utensílios, segurança, necessidade de pistas. Pontuação por passo completado corretamente. Elevada validade ecológica — correlaciona com índice de Barthel.'},
  ]},

  {id:7,name:'Equilíbrio e Prevenção de Quedas',icon:'🦵',color:'#ea580c',bg:'#fff7ed',exercises:8,duration:'45 min',difficulty:'Moderado',type:'fisico',
   description:'Programa de treino de equilíbrio estático e dinâmico baseado no Otago Exercise Programme e nas diretrizes da OMS. Foco na redução do risco de queda — principal causa de hospitalização geriátrica.',
   exercises_list:[
    {id:701,name:'Apoio Unipodal Progressivo',objective:'Desenvolver o equilíbrio estático em apoio unilateral, fortalecendo o sistema propriocetivo e os estabilizadores do tornozelo e anca.',cognitive:'Atenção, controlo motor, propriocepção',duration:'8 min',difficulty:'Moderado',materials:'Cadeira de apoio, superfície antiderrapante, cronómetro',instructions:'Fase 1: apoio unipodal com olhos abertos (meta: 30s). Fase 2: olhos fechados (meta: 10s). Fase 3: sobre superfície instável (almofada). Registar tempo máximo por pé e sessão. Progressão semanal de 5s. Sempre com apoio de cadeira disponível. Critério de segurança: 3 falhas = regressar fase anterior.'},
    {id:702,name:'Marcha Tandem — Pé-ante-Pé',objective:'Melhorar o equilíbrio dinâmico na marcha através de padrão de passo com base de suporte reduzida, simulando situações desafiadoras do quotidiano.',cognitive:'Controlo motor, atenção visuo-espacial, planeamento motor',duration:'8 min',difficulty:'Moderado',materials:'Fita adesiva no chão (linha de 3 metros), corredores laterais de segurança',instructions:'Colocar pé à frente com calcanhar a tocar a ponta do pé anterior. Percurso de 3m ida e volta. Fase 1: com apoio de parede. Fase 2: sem apoio. Fase 3: com dupla tarefa (contar em voz alta). Registar nº de desequilíbrios por tentativa. 4 repetições.'},
    {id:703,name:'Teste de Alcance Funcional',objective:'Avaliar e treinar os limites de estabilidade anterior através do alcance máximo sem deslocar a base de suporte — preditor validado de risco de queda.',cognitive:'Controlo postural, propriocepção, tomada de decisão motora',duration:'6 min',difficulty:'Fácil',materials:'Fita métrica fixada à parede ao nível do ombro, marcador',instructions:'Em pé junto à parede, levantar braço dominant a 90°. Marcar posição inicial. Alcançar o máximo para a frente sem dar passo. Medir deslocamento (norma: >25cm — baixo risco; <15cm — alto risco queda). 3 tentativas. Registar média. Reavaliar mensalmente.'},
    {id:704,name:'Transferências Sentado-Pé (5x STS)',objective:'Fortalecer os membros inferiores e melhorar as transferências funcionais — exercício com maior evidência isolada na prevenção de quedas (Cochrane 2019).',cognitive:'Planeamento motor, controlo da atenção, sequenciação',duration:'8 min',difficulty:'Moderado',materials:'Cadeira firme sem rodas (altura padrão 43cm), cronómetro',instructions:'Levantar e sentar 5 vezes consecutivas o mais rápido possível, sem usar as mãos. Cronometrar. Normas: <12s = normal; 12-16s = risco moderado; >16s = risco elevado. Fazer 3 séries com 2 min repouso. Progredir para 10 repetições com carga (saco de areia 1kg por tornozelo).'},
    {id:705,name:'Rotações de Cabeça e Controlo Vestibular',objective:'Estimular o sistema vestibular e melhorar a estabilidade da cabeça em movimento — essencial para prevenção de quedas em viragem e mudança de direção.',cognitive:'Integração sensorial, atenção, orientação espacial',duration:'6 min',difficulty:'Fácil',materials:'Cadeira, almofada cervical opcional, metrónomo (60bpm)',instructions:'Sentado: rotações lentas da cabeça E-D (10x), inclinações C-C (10x), flexão-extensão (10x). Sincronizar com respiração. Fase 2 em pé: mesmos movimentos com apoio. Fase 3: movimentos durante marcha. STOP se tonturas > 3s. Contraindicado na BPPV não tratada.'},
    {id:706,name:'Treino em Superfície Instável',objective:'Desafiar o sistema propriocetivo e os mecanismos de equilíbrio reflexo através de superfícies que alterem o feedback sensorial plantar.',cognitive:'Propriocepção, integração sensoriomotora, controlo postural reativo',duration:'8 min',difficulty:'Difícil',materials:'Almofada de equilíbrio (foam pad) ou colchão fino, barras paralelas ou parede',instructions:'Progressão: 1. estar de pé na almofada (30s); 2. transferência de peso L-D; 3. marcha no local na almofada; 4. apanhar e lançar bola enquanto em cima. Sempre com supervisão. Nunca sem apoio disponível. Registo de tempo de equilíbrio e qualidade de controlo.'},
    {id:707,name:'Step Lateral e Degrau',objective:'Melhorar o equilíbrio dinâmico em movimentos laterais e em subida/descida de degrau — situações de alto risco de queda no quotidiano.',cognitive:'Planeamento motor, atenção, coordenação olho-pé',duration:'8 min',difficulty:'Moderado',materials:'Step de 10cm (ou degrau real), barras de apoio laterais',instructions:'Step lateral: 10 repetições cada lado. Subida/descida degrau: pé dominante primeiro na subida, pé não-dominante primeiro na descida. Fase 1: apoio bilateral. Fase 2: apoio de um lado. Fase 3: sem apoio. Cronometrar 10 repetições. Registar qualidade de apoio e desequilíbrios.'},
    {id:708,name:'Programa Otago Completo — Sessão Tipo',objective:'Executar a sequência completa do Otago Exercise Programme validado — redução de 35% de quedas em RCT com idosos >80 anos (Campbell et al.).',cognitive:'Memória procedimental, atenção, sequenciação',duration:'30 min',difficulty:'Moderado',materials:'Cadeira, pesos de tornozelo (0,5-1kg), escada, espaço 3x3m',instructions:'Sequência: 1. aquecimento 5min (rotações articulares sentado); 2. exercícios de força MMII (10 min); 3. exercícios de equilíbrio (10 min); 4. marcha com variações (5 min). Aplicar 3x/semana. Registar nº de quedas/mês como outcome primário. Prescrever caminhada diária 30 min como complemento.'},
  ]},

  {id:8,name:'Força e Prevenção da Sarcopenia',icon:'💪',color:'#dc2626',bg:'#fef2f2',exercises:8,duration:'50 min',difficulty:'Moderado',type:'fisico',
   description:'Treino de resistência progressiva para combater a sarcopenia — perda de massa e força muscular com o envelhecimento. Baseado nas diretrizes ACSM/EWGSOP2. Fundamental para manutenção da independência funcional.',
   exercises_list:[
    {id:801,name:'Levantamento da Cadeira — Chair Stand',objective:'Fortalecer o quadricípite, glúteos e isquiotibiais através do padrão de agachamento funcional, melhorando a capacidade de transferências independentes.',cognitive:'Planeamento motor, controlo da atenção',duration:'8 min',difficulty:'Fácil',materials:'Cadeira firme 43cm, pesos de tornozelo 0,5-2kg (progressão)',instructions:'Sem ajuda das mãos: levantar completamente e sentar controlado (excêntrico 3s). Séries: 2x10 semana 1-2; 3x10 semana 3-4; 3x12 semana 5+. Pausa 90s entre séries. Adicionar carga (pesos tornozelo) quando 3x10 for fácil. Critério progressão: RPE 5-6/10.'},
    {id:802,name:'Extensão do Joelho em Cadeira',objective:'Isolar e fortalecer o quadricípite — músculo mais crítico para a marcha independente e prevenção de quedas. Eficaz mesmo em sarcopenia avançada.',cognitive:'Controlo motor, atenção',duration:'8 min',difficulty:'Fácil',materials:'Cadeira com encosto, pesos de tornozelo 0,5-3kg, cronómetro',instructions:'Sentado, estender joelho até posição horizontal, manter 2s, baixar 3s (excêntrico). Fase 1: sem carga (2x15). Fase 2: 0,5kg. Progressão semanal 0,5kg quando RPE < 5. Registo de carga e repetições por sessão. Bilateral alternado. Indicador: mini-sarcopenia toolkit — força preensão < 27kg H / < 16kg M.'},
    {id:803,name:'Flexão Plantar — Elevação dos Calcanhares',objective:'Fortalecer o trícipite sural (gémeos + solear), fundamental para a propulsão na marcha e estabilidade do tornozelo na prevenção de quedas.',cognitive:'Controlo motor, propriocepção',duration:'6 min',difficulty:'Fácil',materials:'Degrau ou step de 10cm, barra de apoio',instructions:'Em pé no degrau, subir ao máximo na ponta dos pés (2s), baixar controlado abaixo da linha do degrau (3s de excêntrico). Fase 1: bilateral (3x15). Fase 2: unilateral alternado. Fase 3: unilateral com mini-mochila (0,5-1kg). Excelente para contrariar marcha "escorregada" típica dos idosos.'},
    {id:804,name:'Abdução e Extensão da Anca',objective:'Fortalecer abdutor médio, glúteo máximo e estabilizadores da anca — essenciais para a estabilidade pélvica na marcha e prevenção de fracturas do colo do fémur.',cognitive:'Controlo motor, propriocepção, atenção',duration:'8 min',difficulty:'Fácil',materials:'Cadeira ou barra de apoio, banda elástica leve-moderada, pesos tornozelo',instructions:'Abdução lateral: em pé, elevar perna lateralmente 30° (sem inclinação do tronco). 2x15 cada lado. Extensão: elevar perna para trás 20°, manter tronco ereto. 2x12. Adicionar banda elástica quando RPE < 4. Progressão: adicionar 0,5kg quinzenal.'},
    {id:805,name:'Treino de Força dos Membros Superiores',objective:'Manter a força funcional dos MMSS para AVDs (levantar objetos, abrir portas, carregar compras) e contrariar a sarcopenia do ombro e braço.',cognitive:'Planeamento motor, controlo da atenção, sequenciação',duration:'10 min',difficulty:'Fácil',materials:'Halteres 0,5-3kg ou garrafas de água cheias, cadeira',instructions:'Circuito sentado: 1. curl bicipital (2x12); 2. extensão trícipite (2x12); 3. elevação lateral ombro (2x10); 4. remada baixa com banda (2x12). Pausa 60s entre exercícios. Carga inicial: conseguir 12 reps com RPE 5-6. Progressão 0,5kg quando 3 sessões fáceis consecutivas.'},
    {id:806,name:'Agachamento Assistido Progressivo',objective:'Treinar o padrão de agachamento funcional com progressão de carga e amplitude — simula as exigências das AVDs mais críticas para a independência.',cognitive:'Planeamento motor, controlo postural, atenção',duration:'8 min',difficulty:'Moderado',materials:'Cadeira ou TRX, espelho (feedback visual), pesos tornozelo opcionais',instructions:'Fase 1: agachamento para cadeira (apenas tocar e levantar). Fase 2: semi-agachamento livre (70° flexão joelho). Fase 3: agachamento completo. Alinhamento: joelhos sobre 2º/3º dedo, peso no calcanhar, coluna neutra. 3x10. Progressão quinzenal. Monitorizar dor joelho (parar se > 3/10 NRS).'},
    {id:807,name:'Preensão e Força da Mão',objective:'Manter a força de preensão — marcador independente de mortalidade, fragilidade e qualidade de vida em idosos (Leong et al., Lancet 2015).',cognitive:'Controlo motor fino, atenção',duration:'6 min',difficulty:'Fácil',materials:'Dinamómetro de mão (avaliação), bolas de resistência (3 níveis), massa de modelar',instructions:'Avaliação: 3 medições com dinamómetro, melhor valor. Normas EWGSOP2: H < 27kg = baixa força; M < 16kg. Treino: 3 séries de 10 squeezes com bola resistência. Progressão por resistência da bola. Também: exercícios de pinça, oponência polegar, extensão de dedos com banda. Registar valor mensal.'},
    {id:808,name:'Programa FITT Completo — Sessão de Força',objective:'Executar sessão completa de treino de resistência progressiva conforme ACSM para adultos >65 anos — 2-3x/semana, todos os grandes grupos musculares.',cognitive:'Memória procedimental, atenção, sequenciação',duration:'50 min',difficulty:'Moderado',materials:'Set de halteres 0,5-3kg, bandas elásticas (3 resistências), cadeira, colchão',instructions:'ACSM FITT: Freq. 2-3x/sem; Intensidade 60-80% 1RM (RPE 5-7); Tipo: resistência progressiva; Tempo 45-60 min. Sequência: aquecimento 5min → MMII 20min → MMSS 15min → core 10min → arrefecimento 5min. Registo: exercício, carga, reps, séries, RPE. Meta 12 semanas: ganho 15-20% força.'},
  ]},

  {id:9,name:'Mobilidade e Flexibilidade',icon:'🧘',color:'#0891b2',bg:'#ecfeff',exercises:7,duration:'40 min',difficulty:'Fácil',type:'fisico',
   description:'Programa de mobilidade articular e flexibilidade muscular adaptado à população geriátrica. Combate a rigidez articular, melhora a amplitude de movimento funcional e reduz a dor musculoesquelética crónica.',
   exercises_list:[
    {id:901,name:'Mobilização Cervical Ativa',objective:'Restaurar a mobilidade do raquis cervical, reduzir a tensão muscular cervical e melhorar a postura da cabeça — fator de risco para desequilíbrio e quedas.',cognitive:'Controlo motor, propriocepção cervical, atenção',duration:'6 min',difficulty:'Fácil',materials:'Cadeira com encosto reto, almofada cervical opcional',instructions:'Sentado, coluna ereta: 1. Flexão-extensão suave (5x); 2. Rotação E-D (5x cada); 3. Inclinação lateral C-C (5x cada); 4. Retração cervical (chin tuck) 10x. Ritmo: 3s por movimento, expirar no esforço. STOP imediato se tonturas, irradiação para MS ou parestesias. Contraindicado: estenose cervical grave não tratada.'},
    {id:902,name:'Mobilização do Complexo do Ombro',objective:'Manter e melhorar a amplitude de movimento do ombro, prevenindo a capsulite adesiva e mantendo a capacidade funcional para AVDs acima da cabeça.',cognitive:'Controlo motor, atenção, propriocepção',duration:'8 min',difficulty:'Fácil',materials:'Vara/bengala, toalha, parede',instructions:'Sequência: 1. pêndulo de Codman (30s cada sentido); 2. elevação frontal com vara até amplitude máxima (10x); 3. rotação externa com cotovelo a 90° (10x); 4. mão atrás das costas ascendente (10x). Sempre dentro do arco livre de dor. Aplicar calor 10min antes se rigidez matinal.'},
    {id:903,name:'Extensão Torácica e Postura',objective:'Contrariar a cifose dorsal progressiva do envelhecimento, melhorar a capacidade respiratória e reduzir o centro de gravidade anterior que aumenta o risco de queda.',cognitive:'Consciência corporal, controlo postural, atenção',duration:'8 min',difficulty:'Fácil',materials:'Rolo de espuma (foam roller) ou toalha enrolada, cadeira',instructions:'1. Extensão sobre rolo dorsal (2 min, respiração profunda); 2. Abertura do tórax sentado com mãos atrás da cabeça (10x); 3. Rotação torácica em cadeira (10x cada lado); 4. "Anjo da guarda" — deslizar braços pela parede (10x). Observar: aumento da cifose torácica > 50° indica referenciação ortopédica.'},
    {id:904,name:'Flexibilidade dos Isquiotibiais',objective:'Manter a extensibilidade da cadeia posterior, reduzindo a tensão lombar e melhorando a amplitude de passo na marcha — essencial para a independência locomotora.',cognitive:'Consciência corporal, propriocepção',duration:'8 min',difficulty:'Fácil',materials:'Colchão, cadeira, faixa de alongamento (yoga strap)',instructions:'Método PNF simplificado: 1. Contração isométrica isquiotibiais 6s; 2. Relaxar e aprofundar alongamento 20s; 3. Repetir 3x. Posição deitada: elevar perna estendida com faixa. Sentado: inclinar tronco sobre perna estendida. Alvo: 60-70° extensão joelho sem dor. NUNCA forçar amplitude dolorosa.'},
    {id:905,name:'Mobilidade do Tornozelo e Pé',objective:'Melhorar a amplitude de dorsiflexão do tornozelo — fator biomecânico crítico para a marcha segura, subida de degraus e mecanismo de proteção na queda.',cognitive:'Propriocepção, controlo motor distal, atenção',duration:'6 min',difficulty:'Fácil',materials:'Cadeira, rolo de massagem, resistência elástica leve',instructions:'Sentado: 1. Circundução do pé 10x cada sentido; 2. Dorsiflexão-flexão plantar 15x; 3. Inversão-eversão 10x. Em pé (apoio): 4. Lunges à parede (dorsiflexão com carga 3x30s). Massagem plantar com bola de ténis (1 min cada pé). Meta: dorsiflexão ≥ 20° com joelho estendido.'},
    {id:906,name:'Mobilização Lombar e Core Suave',objective:'Manter a mobilidade do raquis lombar e ativar o core de forma suave e segura, reduzindo a dor lombar crónica — prevalência >60% em idosos.',cognitive:'Consciência corporal, controlo motor, atenção',duration:'8 min',difficulty:'Fácil',materials:'Colchão firme, almofada pequena',instructions:'Deitado em decúbito dorsal: 1. Báscula pélvica 15x; 2. Joelhos ao peito alternados 10x; 3. Rotação lombar com joelhos fletidos 8x cada lado; 4. Ponte (glute bridge) 10x (manter 3s). Respiração diafragmática durante todos. STOP se dor irradiada > 3/10. Indicado como complemento ao treino de força.'},
    {id:907,name:'Sequência de Mobilização Global — "Wake-up Body"',objective:'Executar rotina matinal completa de mobilização de todas as articulações principais — programa independente prescritível para casa, 10 min/dia.',cognitive:'Memória procedimental, atenção, sequenciação',duration:'10 min',difficulty:'Fácil',materials:'Cadeira (inicio), colchão (opcional)',instructions:'Sequência de 10 exercícios x 10 repetições cada: cervical → ombros → cotovelos → pulsos → tronco → ancas → joelhos → tornozelos. Ritmo lento (3s/rep). Ensinar em 3 sessões. Fornecer ficha ilustrada para casa. Verificar execução autónoma na 4ª sessão. Meta: adesão ≥ 5 dias/semana. Excelente para autonomia e autoeficácia.'},
  ]},

  {id:10,name:'Exercício Aeróbico Adaptado',icon:'🚶',color:'#16a34a',bg:'#f0fdf4',exercises:6,duration:'45 min',difficulty:'Moderado',type:'fisico',
   description:'Programa de condicionamento cardiovascular adaptado à capacidade funcional do idoso. Melhora o VO₂max, reduz fatores de risco cardiovascular e tem efeito neuroprotetor direto comprovado (aumento BDNF, neurogénese hipocampal).',
   exercises_list:[
    {id:1001,name:'Programa de Marcha Progressiva',objective:'Desenvolver a capacidade aeróbica e resistência através de programa de caminhada estruturado com progressão de intensidade e duração — intervenção com melhor custo-efetividade em geriatria.',cognitive:'Atenção, orientação espacial, memória topográfica',duration:'30-45 min',difficulty:'Fácil',materials:'Calçado adequado, podómetro ou smartphone, ficha de registo semanal',instructions:'Semana 1-2: 10 min/dia a ritmo confortável. Progressão: +5 min/semana até 30 min contínuos. Intensidade: RPE 4-5/10 (consegue falar em frases curtas). Meta 12 semanas: 150 min/semana intensidade moderada (OMS). Usar escala de Borg. Monitorizar FC se doença cardiovascular — alvo 50-70% FCmáx.'},
    {id:1002,name:'Aeróbica em Cadeira — Chair Aerobics',objective:'Melhorar a capacidade cardiovascular e resistência muscular em pacientes com limitações de mobilidade, dor ou risco de queda elevado — sem risco de queda.',cognitive:'Coordenação, atenção, memória de sequências',duration:'20 min',difficulty:'Fácil',materials:'Cadeira firme, música rítmica (60-120 bpm), garrafas de água (0,5L) como halteres',instructions:'Sequência 20 min: aquecimento 3min (movimentos suaves) → 12 min aeróbico (elevações de joelhos, pontapés frontais, movimentos de braços coordenados, "marcha sentada") → arrefecimento 5 min. Intensidade: RPE 4-5. Música como motivador. Excelente em grupo. Progressão: aumentar ritmo musical e amplitude de movimento.'},
    {id:1003,name:'Cicloergómetro Sentado — Cycling',objective:'Proporcionar exercício aeróbico de baixo impacto articular com carga cardiovascular controlável, ideal para pacientes com gonartrose, coxartrose ou instabilidade na marcha.',cognitive:'Atenção, controlo motor rítmico',duration:'20 min',difficulty:'Fácil',materials:'Cicloergómetro reclinado ou pedais de mesa (desk bike), monitor FC',instructions:'Protocolo: 5 min aquecimento (resistência 1) → 10-15 min intensidade moderada (resistência 2-3, RPE 4-5) → 5 min arrefecimento. Meta: 20 min contínuos até 45 min. Cadência alvo: 50-70 rpm. Progressão resistência: +1 nível/2 semanas quando esforço < 4/10. FC monitor se disponível.'},
    {id:1004,name:'Dança Terapêutica — Movimento com Sentido',objective:'Utilizar a dança como exercício aeróbico e de coordenação com elevada componente motivacional e social, ativando simultaneamente áreas cognitivas e motoras.',cognitive:'Memória de sequências, atenção, coordenação, processamento rítmico',duration:'30 min',difficulty:'Fácil',materials:'Sistema de som, músicas portuguesas familiares (povo, valsas, marchas), espaço amplo',instructions:'Sequência: 1. Reconhecimento rítmico (palmas com música, 5 min); 2. Passos básicos sentado (5 min); 3. Em pé com apoio — marcha rítmica + braços (10 min); 4. Sequências simples de 4 passos (8 min); 5. Arrefecimento (2 min). A familiaridade musical ativa memória episódica. Adaptável a qualquer nível funcional.'},
    {id:1005,name:'Treino Intervalado de Baixa Intensidade — LIIT',objective:'Alternar períodos de atividade e repouso para maximizar o estímulo cardiovascular mantendo segurança e adesão — superiora à intensidade contínua em populações descondicionadas.',cognitive:'Atenção, controlo da fadiga, memória de trabalho',duration:'25 min',difficulty:'Moderado',materials:'Cronómetro, cadeira de apoio, banda elástica opcional',instructions:'Protocolo 10 ciclos: 60s ativo (marcha no local + movimentos braços) + 60s repouso ativo (respiração + mobilização suave). Total: 20 min + 5 min aquecimento. RPE durante fase ativa: 5-6/10. Progressão: aumentar fase ativa para 90s, diminuir repouso para 45s. Adaptar à frequência cardíaca e percepção de esforço.'},
    {id:1006,name:'Hidroginástica Adaptada — Protocolo Terra',objective:'Simular os benefícios do exercício aquático (descarga articular, resistência proporcional) através de exercícios inspirados na hidroginástica executáveis em terra, com bastão.',cognitive:'Coordenação bilateral, atenção, ritmo',duration:'30 min',difficulty:'Fácil',materials:'Bastão de natação (ou cabide), música, espaço amplo',instructions:'Simular resistência da água com bastão: 1. Pedalagem sentada com resistência imaginária (5 min); 2. "Remada" com bastão (5 min); 3. "Treading water" — movimentos circulares MMSS em pé (5 min); 4. Agachamentos com resistência do bastão (10 min); 5. Arrefecimento (5 min). Indicado para pacientes que participavam em hidroginástica mas perderam mobilidade.'},
  ]},

  {id:11,name:'Coordenação e Dupla Tarefa',icon:'🎯',color:'#7c3aed',bg:'#faf5ff',exercises:6,duration:'45 min',difficulty:'Difícil',type:'fisico',
   description:'Treino de coordenação motora, propriocepção e desempenho em dupla tarefa motor-cognitiva. A dupla tarefa é o paradigma de maior evidência para prevenção de quedas e preservação cognitiva simultânea (Mirelman et al., Lancet Neurology 2016).',
   exercises_list:[
    {id:1101,name:'Lançamento e Receção de Bola',objective:'Desenvolver a coordenação olho-mão, reflexos de receção e capacidade de seguimento visual — habilidades essenciais para reações de proteção na queda.',cognitive:'Atenção visuo-espacial, velocidade de processamento, coordenação olho-mão',duration:'10 min',difficulty:'Fácil',materials:'Bola de espuma (tamanhos variados), distâncias marcadas no chão (1m, 2m, 3m)',instructions:'Progressão: 1. Lançamento bi-manual (1m); 2. Uni-manual dominante (1,5m); 3. Uni-manual não-dominante; 4. Sentado → em pé; 5. Com mudança de direção. Variante cognitiva: dizer categoria da bola antes de lançar. Registar acertos/erros e distância máxima. Excelente para trabalho em pares.'},
    {id:1102,name:'Dupla Tarefa Motora-Cognitiva — DT Training',objective:'O paradigma de maior evidência: treinar simultaneamente tarefa motora (marcha, equilíbrio) e tarefa cognitiva (verbal, aritmética) para melhorar o desempenho em ambas e reduzir quedas.',cognitive:'Atenção dividida, memória de trabalho, flexibilidade cognitiva, controlo motor',duration:'15 min',difficulty:'Difícil',materials:'Corredor de marcha 6m, obstáculos baixos, cronómetro',instructions:'Combinações: 1. Marchar + contar de 3 em 3 (DT aritmética); 2. Marchar + nomear animais (DT semântica); 3. Carregar tabuleiro com copo (DT motora); 4. Marchar + responder a perguntas pessoais. Registar: velocidade de marcha, nº de erros cognitivos, variabilidade do passo. Comparar com condição simples (DT cost).'},
    {id:1103,name:'Marcha com Obstáculos e Variações',objective:'Treinar a adaptação da marcha a desafios ambientais — obstáculos, mudanças de superfície, viragens — contexto de maior risco de queda no quotidiano.',cognitive:'Atenção, planeamento motor, adaptação, tomada de decisão',duration:'12 min',difficulty:'Moderado',materials:'Obstáculos de espuma (5cm, 10cm, 15cm), fitas coloridas no chão, sinalizadores',instructions:'Circuito: 1. Contornar obstáculos laterais; 2. Passar por cima de obstáculos baixos (step over); 3. Mudança de direção a sinal visual; 4. Paragem súbita a comando; 5. Apanhar objeto do chão em marcha. Cronometrar circuito. Progressão: aumentar velocidade, reduzir pistas visuais. Simular ambientes domésticos reais.'},
    {id:1104,name:'Coordenação Rítmica Bimanual',objective:'Treinar padrões de coordenação bimanual simétrica e assimétrica, estimulando a integração inter-hemisférica e a automatização de padrões motores complexos.',cognitive:'Coordenação bimanual, atenção, ritmo, memória procedimental',duration:'10 min',difficulty:'Moderado',materials:'Percussão simples (dois tubos de cartão), metrónomo, mesa',instructions:'Fase 1: bater ambas as mãos ao mesmo tempo (tempo 60bpm). Fase 2: alternado E-D. Fase 3: padrão 3:2 (D bate 3x, E bate 2x em paralelo). Fase 4: sequências bimanuais diferentes. Aumentar BPM progressivamente. Registar fase máxima alcançada por sessão. Excelente para estimulação corpo caloso.'},

// Todos os dados ficam guardados apenas neste browser, neste computador.
const STORAGE_PREFIX='aim_v1_';
const STORE_KEYS=['patients','sessions','assessments','events','posts','profile','prefs'];
const AVATAR_COLORS=['#4f46e5','#0891b2','#059669','#d97706','#7c3aed','#e11d48','#0d9488','#ea580c'];

const DEFAULT_PREFS={duration:'45',scale:'mmse',reminders:true,declineAlerts:true,monthlyReports:false,nSessions:true,nRisk:true,nForum:false,nUpdates:true};

function storageRead(key,fallback){
  try{const raw=localStorage.getItem(STORAGE_PREFIX+key);return raw==null?fallback:JSON.parse(raw);}
  catch(e){return fallback;}
}
function storageWrite(key,value){
  try{localStorage.setItem(STORAGE_PREFIX+key,JSON.stringify(value));return true;}
  catch(e){console.warn('Não foi possível guardar',key,e);return false;}
}
function usePersistentState(key,initial){
  const [value,setValue]=useState(()=>storageRead(key,typeof initial==='function'?initial():initial));
  useEffect(()=>{storageWrite(key,value);},[key,value]);
  return [value,setValue];
}

const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const fmtDate=iso=>{if(!iso)return '—';const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`;};
const initialsOf=name=>name.trim().split(/\s+/).filter(Boolean).map(w=>w[0]).filter((_,i,a)=>i===0||i===a.length-1).join('').toUpperCase()||'?';
const ageFromDob=dob=>{if(!dob)return null;const b=new Date(dob),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a;};
const numOrNull=v=>v===''||v==null||isNaN(+v)?null:+v;
function computeRisk(p){
  const {mmse,gds,barthel}=p;
  if((mmse!=null&&mmse<20)||(gds!=null&&gds>10)||(barthel!=null&&barthel<70)) return 'high';
  if((mmse!=null&&mmse<25)||(gds!=null&&gds>5)||(barthel!=null&&barthel<90)) return 'medium';
  return 'low';
}
const mmseColor=v=>v==null?'#94a3b8':v<20?'#dc2626':v<25?'#d97706':'#16a34a';
const nextId=list=>list.reduce((m,x)=>Math.max(m,+x.id||0),0)+1;

function seedSessions(){

  const out=[];let id=1;

function seedAssessments(){

    out.push({id:id++,patientId:p.id,date:'2026-04-10',scale:'mmse',value:Math.min(30,p.mmse+1),notes:'Ligeira descida face ao mês anterior'});

const SEED={
  patients:()=>SAMPLE_PATIENTS,
  sessions:seedSessions,
  assessments:seedAssessments,
  events:()=>SAMPLE_EVENTS,
  posts:()=>INITIAL_POSTS,
  profile:()=>DEFAULT_PROFILE,
  prefs:()=>DEFAULT_PREFS,
};

const StoreContext=createContext(null);
const useStore=()=>useContext(StoreContext);

function StoreProvider({children}){
  const [patients,setPatients]=usePersistentState('patients',SEED.patients);
  const [sessions,setSessions]=usePersistentState('sessions',SEED.sessions);
  const [assessments,setAssessments]=usePersistentState('assessments',SEED.assessments);
  const [events,setEvents]=usePersistentState('events',SEED.events);
  const [posts,setPosts]=usePersistentState('posts',SEED.posts);
  const [profile,setProfile]=usePersistentState('profile',SEED.profile);
  const [prefs,setPrefs]=usePersistentState('prefs',SEED.prefs);
  const setters={patients:setPatients,sessions:setSessions,assessments:setAssessments,events:setEvents,posts:setPosts,profile:setProfile,prefs:setPrefs};

  const addPatient=data=>{
    const id=nextId(patients);
    const created={...data,id,initials:initialsOf(data.name),avatar:AVATAR_COLORS[id%AVATAR_COLORS.length],sessions:0,createdAt:todayISO()};
    created.risk=computeRisk(created);
    setPatients(ps=>[...ps,created]);
    return created;
  };
  const updatePatient=useCallback((id,patch)=>{
    setPatients(ps=>ps.map(p=>{if(p.id!==id)return p;const n={...p,...patch};n.risk=computeRisk(n);return n;}));
  },[]);
  const deletePatient=useCallback(id=>{
    setPatients(ps=>ps.filter(p=>p.id!==id));
    setSessions(ss=>ss.filter(s=>s.patientId!==id));
    setAssessments(as=>as.filter(a=>a.patientId!==id));
    setEvents(es=>es.filter(e=>e.patientId!==id));
  },[]);
  const addSession=useCallback(s=>{
    setSessions(ss=>[...ss,{...s,id:nextId(ss)}]);
    setPatients(ps=>ps.map(p=>p.id===s.patientId?{...p,sessions:(p.sessions||0)+1}:p));
  },[]);
  const deleteSession=useCallback(s=>{
    setSessions(ss=>ss.filter(x=>x.id!==s.id));
    setPatients(ps=>ps.map(p=>p.id===s.patientId?{...p,sessions:Math.max(0,(p.sessions||0)-1)}:p));
  },[]);
  const addAssessments=useCallback((patientId,date,values,notes)=>{
    const entries=Object.entries(values).filter(([,v])=>v!=null);
    if(!entries.length) return;
    setAssessments(as=>{let id=nextId(as);return [...as,...entries.map(([scale,value])=>({id:id++,patientId,date,scale,value,notes}))];});
    // Atualiza os valores atuais do paciente se esta for a avaliação mais recente
    setPatients(ps=>ps.map(p=>{
      if(p.id!==patientId) return p;
      const n={...p};
      entries.forEach(([scale,value])=>{if(!p.lastAssessed||!p.lastAssessed[scale]||date>=p.lastAssessed[scale]){n[scale]=value;n.lastAssessed={...(n.lastAssessed||{}),[scale]:date};}});
      n.risk=computeRisk(n);
      return n;
    }));
  },[]);

  const exportData=()=>({app:'age-in-move',version:1,exportedAt:new Date().toISOString(),data:{patients,sessions,assessments,events,posts,profile,prefs}});
  const importData=json=>{
    const d=json&&json.data;
    if(!d||json.app!=='age-in-move') throw new Error('Ficheiro não reconhecido como backup Age in Move.');
    ['patients','sessions','assessments','events','posts'].forEach(k=>{if(d[k]!=null&&!Array.isArray(d[k]))throw new Error(`Campo "${k}" inválido.`);});
    STORE_KEYS.forEach(k=>{if(d[k]!=null)setters[k](d[k]);});
  };
  const resetDemo=()=>STORE_KEYS.forEach(k=>setters[k](SEED[k]()));
  const clearAll=()=>{['patients','sessions','assessments','events'].forEach(k=>setters[k]([]));setPosts(SEED.posts());};

  const value={patients,sessions,assessments,events,posts,profile,prefs,
    setEvents,setPosts,setProfile,setPrefs,
    addPatient,updatePatient,deletePatient,addSession,deleteSession,addAssessments,
    exportData,importData,resetDemo,clearAll};
  return <StoreContext.Provider value={value}>{children}</StoreContext.Provider>;
}

function downloadJSON(obj,filename){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

    'fluência verbal semântica':{s:'Categoria: apenas animais domésticos. 30 segundos.',c:'Versão "Leilão Verbal": pontuação por raridade da palavra. "Cão" = 1 ponto; "chimpanzé" = 3 pontos. A gamificação dobra a produção lexical espontânea.'},
