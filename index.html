    'completamento de frases':{s:'Frases de 4 palavras com lacuna no final. Ex: "O sol é ___".',c:'Transformar em provérbios incompletos da infância. A familiaridade cultural funciona como âncora mnemónica poderosa para geração born before 1960.'},
    'compreensão de ordens':{s:'Ordens simples com 1 objeto. "Toque no copo."',c:'Contexto culinário: "Prepare a mesa para o almoço seguindo estas instruções." Máxima validade ecológica. Equivalente funcional ao Barthel.'},
    'descrição de cenas':{s:'Imagem com 3 personagens e 2 ações simples.',c:'Paciente é o "jornalista" que noticia a cena para um jornal imaginário. Atribuir nome ao jornal. Estrutura narrativa (quem, o quê, quando, onde) organiza o pensamento.'},
    'compreensão de provérbios':{s:'Apresentar 2 opções de interpretação (uma correta e uma absurda).',c:'"Teatro dos Provérbios": encenar fisicamente o provérbio literal antes de discutir o sentido figurado. O absurdo do movimento literal gera humor e facilita a abstração.'},
    'torre de hanói':{s:'Apenas 2 discos. Demonstração visual passo-a-passo disponível.',c:'"Missão Espacial": discos são módulos de nave espacial. Narrar em voz alta cada movimento como manobra espacial. A narrativa ativa o planeamento verbal e reduz erros de impulsividade.'},
    'sequências e padrões numéricos':{s:'Progressões aritméticas simples +2. Apenas 4 números na sequência.',c:'Criar "cifra secreta" pessoal: usar datas de aniversário para criar padrão. Paciente ensina a cifra ao terapeuta — o papel de professor aumenta a consolidação.'},
    'classificação de objetos':{s:'Classificar apenas por cor. 8 objetos.',c:'Criar "museu pessoal": organizar objetos da bolsa/bolso do paciente por categorias que ele decide. Autonomia de critério ativa o lobo frontal de forma diferente da tarefa imposta.'},
    'semelhanças e diferenças':{s:'Pares concretos com resposta múltipla escolha: A=animais B=plantas C=objetos.',c:'"Filósofo por um dia": "Em que se parecem a vida e uma viagem?" Questões existenciais familiares ativam sabedoria acumulada e têm impacto emocional positivo demonstrado.'},
    'planeamento de tarefas':{s:'Cenário com 2 tarefas e 1 restrição de tempo.',c:'Planear a festa de aniversário do neto: lista de compras, local, hora, convidados. O investimento emocional maximiza o esforço de planeamento e gera produto concreto.'},
    'go/no-go':{s:'Apenas 1 categoria alvo. Ritmo mais lento (1 carta/3s).',c:'Versão musical: bater palma ao som de guitarra (Go), ficar quieto ao piano (No-Go). O processamento auditivo-motor é mais resiliente na DA que o visual.'},
    'trail making':{s:'Apenas Parte A (números). Fonte maior. Máximo 15 elementos.',c:'Trail Making com fotografias: ligar fotos de locais conhecidos em ordem (casa → café → farmácia → igreja). O contexto topográfico familiar reduz a carga de processamento.'},
    'rotação mental':{s:'Figuras 2D simples. Rotações de 90° apenas.',c:'"Arquiteto da Casa": rodar planta simplificada da própria casa para planear rearranjos de mobiliário. O contexto pessoal aumenta motivação e relevância funcional.'},
    'orientação no mapa':{s:'Mapa simplificado com apenas 4 pontos de referência.',c:'Criar "mapa da memória" da rua da infância. Desenhar de memória com locais emocionalmente relevantes. Reminiscência topográfica com elevado potencial narrativo.'},
    'reconhecimento de trajetos':{s:'Sequência de 4 fotos de percurso muito familiar.',c:'Criar "guia turístico" do próprio bairro em 8 fotografias. Paciente narra para familiar como se fosse turista. Inversão de papéis: o paciente é o especialista.'},
    'perspetiva visual':{s:'2 objetos apenas. Diferença de perspetiva de 180°.',c:'"Detetive de Objetos Perdidos": "O seu gato escondeu o novelo. Estando do outro lado da mesa, onde estaria o novelo?" Contexto narrativo facilita tomada de perspetiva.'},
    'cópia de figuras':{s:'Quadrado e triângulo apenas. Papel quadriculado disponível.',c:'Usar azulejos portugueses como modelo: copiar padrões geométricos tradicionais. A identidade cultural aumenta a motivação e o produto final tem valor estético.'},
    'puzzles e montagem':{s:'8 peças. Imagem familiar (casa, animal).',c:'Construir cenário de Natal/Páscoa com peças de puzzle representando elementos da tradição do paciente. O puzzle final vai para a divisão do quarto.'},
    'continuação de padrões':{s:'Apenas alternância de 2 cores.',c:'"Criador de Tecidos": criar padrão de bordado ou tecido alentejano com as sequências. Ligar à identidade cultural regional do paciente.'},
    'matrizes visuais':{s:'3 opções apenas. Diferenças grosseiras.',c:'"Detetive de Arte": encontrar diferença entre 2 quadros famosos reproduzidos. Contexto artístico humanístico gera discussão sobre preferências e memórias culturais.'},
    'blocos de kohs':{s:'Padrão 2x2 com 2 blocos apenas.',c:'"Construtor de Calçada Portuguesa": reproduzir padrões de calçada com cubos brancos e pretos. Identidade cultural fortíssima — quase todos os pacientes reconhecem os padrões.'},
    'reconhecimento de faces':{s:'4 expressões básicas apenas: alegria, tristeza, raiva, surpresa.',c:'"Novela da Tarde": mostrar fotograma de cena dramática conhecida. Identificar emoções de todos os personagens e prever o que vai acontecer. Ativa teoria da mente.'},
    'sequências de movimentos':{s:'Apenas 2 movimentos alternados. Com espelho de apoio.',c:'"Orquestra do Corpo": cada sequência de movimentos representa um instrumento. Criar composição em grupo de 3 pacientes. A sincronia social tem efeito neurológico adicional.'},
    'gestos simbólicos':{s:'5 gestos intransitivos muito frequentes. Com demonstração antes.',c:'"Cinema Mudo": encenar cenas do quotidiano (ir às compras, cumprimentar vizinho) usando apenas gestos. Outro participante ou terapeuta adivinha. Alta motivação e riso terapêutico.'},
    'traçado em labirintos':{s:'Labirinto simples com 1 caminho correto e 1 impasse.',c:'"Explorador de Aldeias": labirinto temático com ruas de aldeia portuguesa, pontos de interesse (fonte, igreja, padaria). Contexto familiar reduz ansiedade de performance.'},
    'coordenação bimanual':{s:'Apenas bater ambas as mãos ao mesmo tempo. Ritmo lento.',c:'"Percussão Alentejana/Minhota": aprender padrão rítmico de música folclórica regional. A identidade musical cria engajamento sustentado. Pode ensinar ao neto.'},
    'origami terapêutico':{s:'Apenas dobrar ao meio e criar envelope simples.',c:'"Carta ao Neto": criar envelope origami personalizado e escrever bilhete de afeto para colocar dentro. Produto com significado relacional real. Combina praxia + linguagem + emoção.'},
    'destreza com objetos':{s:'Apenas inserção dominante. 10 pinos. 60 segundos.',c:'"Atelier de Jóias": inserir miçangas em fio para criar pulseira. Produto final oferecido a familiar. A finalidade do objeto transforma exercício clínico em ato de cuidado.'},
    'escrita e grafomotricidade':{s:'Copiar apenas o próprio nome. Caneta de ponta grossa.',c:'"Postal de Época": escrever postal para familiar em papel especial (Natal, Páscoa, aniversário). Caligrafia com significado relacional. Produto enviado por correio real.'},
    'praxia ideacional':{s:'Preparar um copo de água. Apenas 3 passos.',c:'"Chef por um Dia": preparar receita simples real (torrada, iogurte com fruta). Culinária como terapia — máxima validade ecológica e identidade de papel social preservado.'},
    // FÍSICOS
    'apoio unipodal':{s:'Sentado, elevar apenas os calcanhares do chão alternadamente.',c:'"Flamingo Musical": manter apoio unipodal durante intervalo musical. Quando música para, trocar de pé. Versão em grupo cria competição amistosa e aumenta adesão.'},
    'marcha tandem':{s:'Marcha com pés alinhados mas não encostados (base 10cm). Com apoio de parede.',c:'"Passarela da Fama": colocar tapete vermelho (fita adesiva). Paciente desfila com música de fundo ao ritmo. Componente teatral reduz medo de queda.'},
    'teste de alcance funcional':{s:'Alcance com ambas as mãos. Sem registo de distância — apenas exploração do limite.',c:'"Jardineiro": alcançar para apanhar "frutos" (bolas coloridas penduradas a alturas diferentes). Cada cor = pontuação diferente. Gamificação aumenta esforço de alcance.'},
    'transferências sentado-pé':{s:'Com apoio de mãos no apoio de braços. Altura da cadeira aumentada com almofada.',c:'"Elevador de Prémios": colocar objeto apetecível no assento da cadeira que o paciente só pode apanhar ao levantar completamente. Motivação intrínseca máxima.'},
    'rotações de cabeça':{s:'Apenas inclinação lateral suave. Olhos abertos. Sentado.',c:'"Pássaro Observador": durante passeio ou junto à janela, observar e nomear tudo o que aparece no campo visual ao girar lentamente a cabeça. Integra estimulação sensorial real.'},
    'treino em superfície instável':{s:'Apenas transferência de peso lateral em pé, sem almofada, com apoio de parede.',c:'"Surfista": com música de praia, simular ondas com o peso corporal sobre almofada. Narrativa lúdica reduz o medo de instabilidade e aumenta o tempo de prática.'},
    'step lateral':{s:'Apenas passo lateral no chão (sem step). 5 repetições.',c:'"Dança do Forró Simplificada": passo lateral ao ritmo de música animada. A coreografia mínima (2 passos) torna o exercício em dança. Excelente para grupos.'},
    'programa otago':{s:'Apenas 3 exercícios fundamentais: cadeira, calcanhares, marcha tandem.',c:'"Olimpíadas Geriátricas": protocolo Otago em formato de circuito com estações numeradas. Medalhas simbólicas por sessão completa. Registo em "livro de recordes pessoal".'},
    'levantamento da cadeira':{s:'Com apoio das mãos. 5 repetições. Cadeira alta.',c:'"Treinador de Futebol": imaginar que está a dar instruções aos jogadores que estão em campo. Levantar para ver melhor o campo. Narrativa desvia atenção do esforço.'},
    'extensão do joelho':{s:'Sem carga. Apenas 8 repetições. Amplitude reduzida.',c:'"Pontapé do Penalty": objetivo visual (caixote de reciclagem a 30cm). Cada "golo" marcado é um ponto. A motivação competitiva aumenta o número de repetições voluntárias.'},
    'flexão plantar':{s:'No chão plano. Bilateral apenas. 10 repetições.',c:'"Dança das Pontas": com música de bailado (suave), elevar em pontas de forma sincronizada com a melodia. A associação musical melhora recrutamento motor.'},
    'abdução e extensão da anca':{s:'Sentado, apenas elevação lateral a 15°. Sem carga.',c:'"Passos de Flamenco": padrão rítmico de pisadas laterais com percussão suave. A identidade cultural (flamenco é conhecido) cria contexto motivador.'},
    'força membros superiores':{s:'Com garrafas de 250ml de água. Apenas curl bicipital bilateral.',c:'"Mercearia Vintage": "ajeitar prateleiras" de loja imaginária — elevar, rodar, organizar objetos a diferentes alturas. O contexto funcional elimina a estranheza do exercício.'},
    'agachamento assistido':{s:'Apenas descida de 30° (mini-agachamento). Com apoio frontal.',c:'"Apanha das Azeitonas": agachar para apanhar "azeitonas" (bolas) do chão para cesto. Contexto cultural (colheita) é profundamente familiar à geração e motiva repetições.'},
    'preensão e força da mão':{s:'Apertar bola mole 5 vezes cada mão. Sem cronómetro.',c:'"Oleiro/Ceramista": amassar e modelar bola de barro ou massa de sal. Criar pequena forma — tartaruga, pão, coração. Produto levado para casa. Arte + força + identidade.'},
    'programa fitt completo':{s:'Apenas MMII: 3 exercícios x 8 repetições. 20 minutos total.',c:'"Treino da Equipa": com música de fundo motivadora (hinos desportivos). Cada série = "jogo" ganho. Contador visual de pontos. Terminar com "hino da vitória".'},
    'mobilização cervical':{s:'Apenas rotação E-D suave. Amplitude mínima (30°). 5 repetições.',c:'"Seguir o Pássaro": terapeuta move uma marioneta de pássaro no ar a diferentes alturas e direções. Paciente segue com olhos e cabeça. O estímulo visual torna o exercício fascinante.'},
    'mobilização do ombro':{s:'Apenas pêndulo de Codman (braço pendente com gravidade). 30 segundos.',c:'"Maestro de Orquestra": dirigir orquestra imaginária com ambos os braços ao ritmo de música clássica familiar. Elevação e rotação surgem naturalmente.'},
    'extensão torácica':{s:'Apenas sentar ereto e abrir o peito com uma respiração profunda. 5 vezes.',c:'"Aula de Yoga Real": usar nomes em sânscrito simplificados ("cobra suave", "montanha"). O contexto do yoga tem conotação de saúde e bem-estar que aumenta a adesão.'},
    'flexibilidade dos isquiotibiais':{s:'Deitado, elevar perna com apoio de faixa a apenas 30° de amplitude.',c:'"Dança do Ventre Sentada": inclinações do tronco para a frente com acompanhamento musical árabe lento. A estranheza cultural cria curiosidade e reduz foco na sensação de alongamento.'},
    'mobilidade do tornozelo':{s:'Sentado, apenas círculos do tornozelo. Sem resistência.',c:'"Pintor com os Pés": com caneta presa entre os dedos do pé, "pintar" letras do nome ou desenho simples no papel no chão. Destreza plantar incomum gera humor e foco.'},
    'mobilização lombar':{s:'Apenas báscula pélvica deitado. 10 repetições suaves.',c:'"Gato e Vaca de Yoga": em cadeira, alternar entre coluna arqueada (gato com dor) e coluna em extensão (vaca contente). Contexto animal gera riso e facilita o movimento.'},
    'sequência wake-up body':{s:'Apenas 5 movimentos: pescoço, ombros, pulsos, ancas, tornozelos. 5 rep cada.',c:'"Rádio Matinal do Corpo": criar rotina com música de manhã favorita. Cada canção = uma zona do corpo. A associação musical cria hábito autónomo. Prescrever para casa.'},
    'programa de marcha':{s:'5 minutos de marcha lenta em corredor. Com apoio disponível.',c:'"Rota das Memórias": criar percurso que passa por locais com significado (bancos onde costumava sentar, árvores especiais). Cada ponto = história. A narrativa transforma a marcha em expedição.'},
    'aeróbica em cadeira':{s:'Apenas elevação de joelhos alternada durante 5 minutos com música lenta.',c:'"Studio de Dança Vintage": coreografia sentada inspirada nos "Bailes do Recreio" dos anos 60-70. Reconhecimento musical + movimento = dupla ativação corticosubcortical.'},
    'cicloergómetro':{s:'Pedalagem livre sem resistência. 10 minutos. Foco na respiração.',c:'"Volta a Portugal Imaginária": mapa de Portugal no ecrã/parede. Cada 5 minutos = nova etapa (Porto → Coimbra → Lisboa). Paciente "visita" cidades que conhece.'},
    'dança terapêutica':{s:'Apenas movimento dos braços sentado ao ritmo de música. 10 minutos.',c:'"Rancho Folclórico": aprender 4 passos básicos de dança regional do local de origem do paciente. Identidade cultural máxima. Ensinar ao terapeuta — inversão de papel especialista.'},
    'treino intervalado':{s:'30s ativo (marcha no local) + 90s repouso. 5 ciclos apenas.',c:'"HIIT dos Anos 50": alternância de movimentos de danças da época (twist, valsa, marcha) com repouso. A nostalgia musical reduz a percepção de esforço em 20%.'},
    'lançamento e receção':{s:'Bola grande, 80cm de distância, lançamento bi-manual.',c:'"Bowling da Cognição": nomear categoria de palavra antes de cada lançamento. Acerto físico + resposta correta = ponto duplo. Dual task cognitivo-motora integrada.'},
    'dupla tarefa':{s:'Marcha lenta + contar em voz alta de 2 em 2.',c:'"Jornalista em Campo": marchar e descrever ao vivo tudo o que se passa em redor como locutor desportivo. O discurso espontâneo é mais ecológico que a contagem e tem maior transferência.'},
    'marcha com obstáculos':{s:'Apenas 2 obstáculos baixos. Percurso reto. Sem tempo.',c:'"Safari no Corredor": cada obstáculo é um "animal" (etiqueta com imagem). Ao passar, nomear animal e característica. Enriquecimento semântico do contexto motor.'},
    'coordenação rítmica bimanual':{s:'Apenas bater ambas as mãos em simultâneo ao ritmo de música lenta.',c:'"Percussão do Rancho": aprender padrão de percussão de música folclórica (ex: corridinho algarvio). Gravar vídeo para família. O produto social valoriza o esforço.'},
    'treino de reação':{s:'Apenas 1 tipo de estímulo (palma ao meu sinal). 10 tentativas.',c:'"Voleibol de Balão": tentar não deixar balão tocar o chão. A imprevisibilidade do balão é o estímulo de reação mais ecológico e motivador que existe.'},
    'tai chi simplificado':{s:'Apenas 2 formas: abrir e fechar as mãos lentamente com respiração.',c:'"Tai Chi ao Pôr do Sol": sessão junto à janela ao fim da tarde com música de meditação chinesa. O contexto sensorial (luz, som) amplifica o efeito de bem-estar e adesão.'},
  };
  const key=Object.keys(V).find(k=>n.includes(k));
  if(key) return V[key];
  // Fallback por tipo e dificuldade
  if(isFis){
    if(ex.difficulty==='Fácil') return {s:'Reduzir amplitude a 50%. Sentado com apoio bilateral. Tempo alargado.',c:'"Com Música Favorita": executar todo o exercício com playlist pessoal do paciente. Ritmo aumenta performance motora em 15-20% (evidência RCT).'};
    if(ex.difficulty==='Moderado') return {s:'Remover carga/resistência. Apoio unilateral disponível.',c:'"Circuito Social": em grupo de 3. Competição amistosa com pontos visíveis. A componente social aumenta adesão e tem efeito neuroprotetor adicional.'};
    return {s:'Versão adaptada: metade das repetições, amplitude reduzida, pausa dupla.',c:'"Desafio Funcional Real": integrar movimento numa tarefa de vida diária real (arrumar, cozinhar, jardinar). Máxima transferência ecológica.'};
  } else {
    if(ex.difficulty==='Fácil') return {s:'Reduzir estímulos a metade. Tempo alargado. Resposta oral em vez de escrita.',c:'"Com Arte": combinar tarefa cognitiva com desenho, plasticina ou colagem. Atividade artística reduz ansiedade e ativa memória procedimental em paralelo.'};
    if(ex.difficulty==='Moderado') return {s:'Versão com pistas visuais permanentes. Resposta escolha múltipla (3 opções).',c:'"Reminiscência Cultural": adaptar conteúdo à época de vida (anos 50-80). Música, imagens e vocabulário da era. Familiaridade aumenta desempenho 25-30%.'};
    return {s:'Versão simplificada: 1 critério apenas. Resposta binária (sim/não).',c:'"Role-Play Clínico": terapeuta assume papel de paciente. O paciente explica e ensina. Inversão de papel ativa lobo frontal e autoestima de forma diferente.'};
  }
}

// ─── BLOCO HTML DE UM EXERCÍCIO ──────────────────────────────────────────────
function buildExBlock(ex, mod, num, c, cbg){
  const v=getVariants(ex,mod);
  const bClass=ex.difficulty==='Fácil'?'b-easy':ex.difficulty==='Moderado'?'b-med':'b-hard';
  const stimLabel=mod.type==='fisico'?'CAPACIDADES FÍSICAS':'FUNÇÕES COGNITIVAS';
  return`<div class="ex-card">
  <div class="ex-num-row">
    <div class="ex-num" style="background:${c}">${num}</div>
    <div style="flex:1">
      <div class="ex-title">${ex.name}</div>
      <div class="ex-badges">
        <span class="badge ${bClass}">${ex.difficulty}</span>
        <span class="badge b-dur">⏱ ${ex.duration}</span>
        <span class="badge b-dur">📦 ${ex.materials}</span>
      </div>
    </div>
  </div>
  <div class="grid2">
    <div class="info-box">
      <div class="info-label">🎯 Objetivo Clínico</div>
      <div class="info-text">${ex.objective}</div>
    </div>
    <div class="info-box">
      <div class="info-label">🧩 ${stimLabel}</div>
      <div class="info-text">${ex.cognitive}</div>
    </div>
  </div>
  ${ex.instructions?`<div class="instr-box"><div class="instr-label">📋 Instruções de Aplicação</div><div class="instr-text">${ex.instructions}</div></div>`:''}
  <div class="simple-box">
    <div class="simple-label">🟢 VERSÃO SIMPLES (pacientes com menor capacidade funcional)</div>
    <div class="simple-text">${v.s}</div>
  </div>
  <div class="creative-box">
    <div class="creative-label">✨ VARIANTE CRIATIVA (maximizar engagement e transferência)</div>
    <div class="creative-text">${v.c}</div>
  </div>
  <div class="record-box">
    <div class="record-label">📝 Registo de Sessão</div>
    <div class="record-grid">
      <div class="record-cell">Data: ___/___/______</div>
      <div class="record-cell">Duração real: _____ min</div>
      <div class="record-cell">Esforço RPE: ___/10</div>
      <div class="record-cell">Desempenho: □ Exc □ Bom □ Raz □ Fraco</div>
      <div class="record-cell">Adesão: □ Total □ Parcial □ Recusa</div>
      <div class="record-cell">Versão usada: □ Std □ Simples □ Criativa</div>
    </div>
    <div style="margin-top:8px;font-size:8.5pt;color:#374151">Observações: <span style="border-bottom:1px solid #cbd5e1;display:inline-block;width:calc(100% - 90px)">&nbsp;</span></div>
    <div style="margin-top:5px;font-size:8.5pt;color:#374151">Próxima sessão: <span style="border-bottom:1px solid #cbd5e1;display:inline-block;width:calc(100% - 105px)">&nbsp;</span></div>
  </div>
</div>`;
}

// ─── SECÇÃO DE PROGRESSÃO ────────────────────────────────────────────────────
function buildProgressHTML(mod, c){
  const rows=Array.from({length:8},(_,i)=>`<tr>
    <td style="font-weight:600">Semana ${i+1}</td>
    <td></td><td></td><td></td>
    <td style="text-align:center">□ Exc □ Bom □ Raz</td>
    <td></td>
  </tr>`).join('');
  return`<div class="prog-section">
  <h3 style="font-size:12pt;font-weight:700;color:#0f172a;margin-bottom:12px">Plano de 8 Semanas — ${mod.name}</h3>
  <table class="prog-table">
    <thead><tr>
      <th>Semana</th><th>Data Sessão</th><th>Exercícios</th><th>Carga/Nível</th><th>Desempenho</th><th>Notas</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <div style="margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div class="info-box">
      <div class="info-label">Objetivos terapêuticos</div>
      ${['1.','2.','3.'].map(n=>`<div style="border-bottom:1px solid #e2e8f0;padding:6px 0;font-size:9pt">${n} <span style="display:inline-block;width:200px">&nbsp;</span></div>`).join('')}
    </div>
    <div class="info-box">
      <div class="info-label">Avaliação de resultados (8ª semana)</div>
      ${['Escala/Teste:','Resultado inicial:','Resultado final:','Variação (%):'].map(n=>`<div style="border-bottom:1px solid #e2e8f0;padding:6px 0;font-size:9pt">${n} <span style="display:inline-block;width:140px">&nbsp;</span></div>`).join('')}
    </div>
  </div>

// Gera o logótipo Age in Move — versão melhorada
function getAgeInMoveLogo(size=320){
  const c=document.createElement('canvas');
  c.width=c.height=size;
  const ctx=c.getContext('2d');
  const s=size, cx=s/2, cy=s/2+s*.02;
  ctx.clearRect(0,0,s,s);

  // ── Blob orgânico (forma cérebro) com 80 pontos + ondas seno ──────────────
  const blobPath=()=>{
    ctx.beginPath();
    const pts=90, baseR=s*.41;
    for(let i=0;i<=pts;i++){
      const a=(i/pts)*Math.PI*2 - Math.PI/2;
      // Múltiplas ondas para textura orgânica
      const bump=
        Math.sin(a*3+0.5)*s*.042 +
        Math.sin(a*5+1.4)*s*.022 +
        Math.sin(a*7-0.9)*s*.014 +
        Math.sin(a*2+0.3)*s*.028 +
        Math.sin(a*4+2.1)*s*.016;
      const r=baseR+bump;
      const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();
  };

  // Sombra exterior suave
  ctx.save();
  ctx.shadowColor='rgba(30,30,140,.32)';
  ctx.shadowBlur=s*.07;
  ctx.shadowOffsetX=s*.025;
  ctx.shadowOffsetY=s*.035;

  // Gradiente principal azul → violeta (degradé azul-violeta da v1.0: #2563EB → #7C3AED)
  const gMain=ctx.createRadialGradient(cx-s*.12,cy-s*.14,s*.01, cx+s*.04,cy+s*.06,s*.52);
  gMain.addColorStop(0.00,'#BFD4FF'); // azul muito claro (brilho)
  gMain.addColorStop(0.18,'#6E9BFF'); // azul claro
  gMain.addColorStop(0.50,'#2563EB'); // azul principal
  gMain.addColorStop(0.82,'#5B3FE0'); // azul-violeta
  gMain.addColorStop(1.00,'#7C3AED'); // violeta borda
  ctx.fillStyle=gMain;
  blobPath();
  ctx.fill();
  ctx.restore();

  // Brilho interno (reflexo luz — canto superior esquerdo)
  blobPath();
  ctx.save();
  ctx.clip();
  const gHL=ctx.createRadialGradient(cx-s*.20,cy-s*.22,0, cx-s*.06,cy-s*.10,s*.42);
  gHL.addColorStop(0.00,'rgba(235,242,255,.60)');
  gHL.addColorStop(0.30,'rgba(190,210,255,.20)');
  gHL.addColorStop(0.70,'rgba(160,185,255,.06)');
  gHL.addColorStop(1.00,'rgba(255,255,255,.00)');
  ctx.fillStyle=gHL;
  ctx.fillRect(0,0,s,s);
  ctx.restore();

  // Bordadura suave (claridade na borda interior)
  blobPath();
  ctx.save();
  ctx.clip();
  const gEdge=ctx.createRadialGradient(cx,cy,s*.28,cx,cy,s*.44);
  gEdge.addColorStop(0,'rgba(0,0,0,.00)');
  gEdge.addColorStop(1,'rgba(0,0,0,.18)');
  ctx.fillStyle=gEdge;
  ctx.fillRect(0,0,s,s);
  ctx.restore();

  // ── Figura humana dançante ────────────────────────────────────────────────
  const lw=s*.046;
  const fy=cy-s*.06; // centro vertical da figura

  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.lineWidth=lw;

  // Cabeça (círculo sólido negro)
  ctx.fillStyle='#0A0A0A';
  ctx.strokeStyle='#0A0A0A';
  ctx.beginPath();
  ctx.arc(cx, fy-s*.20, s*.082, 0, Math.PI*2);
  ctx.fill();

  // Pescoço + torso
  ctx.beginPath();
  ctx.moveTo(cx, fy-s*.118);
  ctx.lineTo(cx+s*.010, fy+s*.088);
  ctx.stroke();

  // Braço esquerdo — levantado e aberto (pose vitória)
  ctx.beginPath();
  ctx.moveTo(cx-s*.005, fy-s*.022);
  ctx.lineTo(cx-s*.265, fy-s*.195);
  ctx.stroke();

  // Braço direito — levantado, ligeiramente assimétrico (pose dinâmica)
  ctx.beginPath();
  ctx.moveTo(cx-s*.005, fy-s*.022);
  ctx.lineTo(cx+s*.245, fy-s*.168);
  ctx.stroke();

  // Perna esquerda — passada aberta para baixo-esquerda
  ctx.beginPath();
  ctx.moveTo(cx+s*.010, fy+s*.088);
  ctx.lineTo(cx-s*.225, fy+s*.375);
  ctx.stroke();

  // Perna direita — passada aberta para baixo-direita
  ctx.beginPath();
  ctx.moveTo(cx+s*.010, fy+s*.088);
  ctx.lineTo(cx+s*.245, fy+s*.348);
  ctx.stroke();

  // ── Coração no peito (elemento identitário da marca) ──────────────────────
  const hx=cx+s*.004, hy2=fy-s*.010;
  const hr=s*.048;
  ctx.fillStyle='#0A0A0A';
  ctx.beginPath();
  // Coração via 2 semicírculos + ponto em baixo
  ctx.moveTo(hx, hy2+hr*.75);
  ctx.bezierCurveTo(hx-hr*.05, hy2+hr*.30, hx-hr*1.20, hy2+hr*.20, hx-hr*1.20, hy2-hr*.42);
  ctx.bezierCurveTo(hx-hr*1.20, hy2-hr*1.10, hx-hr*.10, hy2-hr*1.20, hx, hy2-hr*.55);
  ctx.bezierCurveTo(hx+hr*.10, hy2-hr*1.20, hx+hr*1.20, hy2-hr*1.10, hx+hr*1.20, hy2-hr*.42);
  ctx.bezierCurveTo(hx+hr*1.20, hy2+hr*.20, hx+hr*.05, hy2+hr*.30, hx, hy2+hr*.75);
  ctx.closePath();
  ctx.fill();

  return c.toDataURL('image/png');
}

// Cache do logótipo (evita regenerar em cada chamada)
let _logoCache=null;
function getLogo(){
  if(!_logoCache) _logoCache=getAgeInMoveLogo(320);

// Preview do logo na app (componente React)
function LogoPreview({size=60}){
  const ref=React.useRef(null);
  useEffect(()=>{
    if(!ref.current) return;
    const img=new Image();
    img.onload=()=>{
      const ctx=ref.current.getContext('2d');
      ctx.clearRect(0,0,size,size);
      ctx.drawImage(img,0,0,size,size);
    };
    img.src=getLogo();
  },[size]);
  return React.createElement('canvas',{ref,width:size,height:size,style:{display:'block'}});
}

// Converte caracteres especiais portugueses (Helvetica não suporta UTF-8)
const pt=s=>(s||'')
  .replace(/[àáâãä]/g,'a').replace(/[ÀÁÂÃÄ]/g,'A')
  .replace(/[èéêë]/g,'e').replace(/[ÈÉÊË]/g,'E')
  .replace(/[ìíîï]/g,'i').replace(/[ÌÍÎÏ]/g,'I')
  .replace(/[òóôõö]/g,'o').replace(/[ÒÓÔÕÖ]/g,'O')
  .replace(/[ùúûü]/g,'u').replace(/[ÙÚÛÜ]/g,'U')
  .replace(/ç/g,'c').replace(/Ç/g,'C')
  .replace(/ñ/g,'n').replace(/Ñ/g,'N')
  .replace(/[""]/g,'"').replace(/['']/g,"'")
  .replace(/—/g,'-').replace(/→/g,'->').replace(/←/g,'<-')
  .replace(/[✓✗□✨🟢📋📅📦📚📊]/g,'');

function makePDF(mod, singleEx){
  if(!window.jspdf){alert('A biblioteca PDF ainda esta a carregar. Aguarde e tente novamente.');return null;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF('p','mm','a4');

  const CL=isFis?[240,253,244]:[237,233,254];
  const CT=[26,32,44]; // texto escuro
  const CG=[100,116,139]; // cinzento
  const CB=[226,232,240]; // borda
  let y=0;

  // Cores da marca AGE IN MOVE (sempre laranja, independente do módulo)
  const BRAND=[232,80,0];      // laranja escuro #E85000
  const BRAND_L=[255,140,30];  // laranja claro
  const logo=getLogo();

  // ── Cabeçalho de cada página ──────────────────────────────────────────────
  const header=()=>{
    // Gradiente simulado com dois rectângulos
    doc.setFillColor(...BRAND);

    y=17;
  };

  // ── Rodapé de cada página ─────────────────────────────────────────────────
  const footer=()=>{
    doc.setFillColor(255,245,235); // laranja muito suave
    doc.rect(0,H-9,W,9,'F');
    doc.setDrawColor(...BRAND_L);
    doc.setLineWidth(0.4);
    doc.line(0,H-9,W,H-9);
    // Logo mini no rodapé
    try{ doc.addImage(logo,'PNG',ML-1,H-8.5,7,7); }catch(e){}
    doc.setTextColor(...BRAND);
    doc.setFontSize(7);
    doc.setFont('helvetica','bold');
    doc.text('Age in Move',ML+8,H-4);
    doc.setFont('helvetica','italic');
    doc.setFontSize(6.5);
    doc.setTextColor(...CG);
    doc.text('idade em movimento  |  @age_in_move  |  Age in Move (c) 2026  |  '+new Date().toLocaleDateString('pt-PT'),
      ML+42,H-4);
  };

  // ── Nova página ───────────────────────────────────────────────────────────
  const newPage=()=>{footer();doc.addPage();header();};

  // ── Verificar espaço ──────────────────────────────────────────────────────
  const checkY=(need)=>{if(y+need>H-14)newPage();};

  // ── Caixa colorida com label + texto ─────────────────────────────────────
  const drawBox=(x,bY,w,h,bg,border,labelColor,label,textColor,textLines)=>{
    doc.setFillColor(...bg);
    doc.setDrawColor(...border);
    doc.setLineWidth(0.4);
    doc.roundedRect(x,bY,w,h,1.5,1.5,'FD');
    if(label){
      doc.setTextColor(...labelColor);
      doc.setFontSize(6.5);
      doc.setFont('helvetica','bold');

      doc.setFontSize(8);
      doc.setFont('helvetica','normal');
      doc.text(textLines,x+3.5,bY+(label?8.5:5.5));

  };

  const exs=singleEx?[singleEx]:[...(mod.exercises_list||[])].sort((a,b)=>{
    const o={Facil:0,Fácil:0,Moderado:1,Dificil:2,Difícil:2};
    return (o[a.difficulty]||0)-(o[b.difficulty]||0);

  // ════════════════════════════════════════════════════════════
  // CAPA (apenas para módulo completo)
  // ════════════════════════════════════════════════════════════
  if(!singleEx){
    header();

    // ── Logo grande centrado ─────────────────────────────────

    doc.setTextColor(...CG);
    doc.text('idade em movimento',W/2,y+7,{align:'center'});
    y+=14;

    // Linha divisória com cor do módulo
    doc.setDrawColor(...C);
    doc.setLineWidth(1.5);
    doc.line(W/2-40,y,W/2+40,y);
    y+=8;

    // Tipo badge + Título do módulo
    doc.setFillColor(...C);
    doc.roundedRect(W/2-28,y,56,8,3,3,'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(8);
    doc.setFont('helvetica','bold');
    doc.text(isFis?'MODULO FISICO':'MODULO COGNITIVO',W/2,y+5.5,{align:'center'});
    y+=12;

    doc.setTextColor(...CT);
    doc.setFontSize(22);
    doc.setFont('helvetica','bold');
    const tLines=doc.splitTextToSize(pt(mod.name),cw-10);
    doc.text(tLines,W/2,y+8,{align:'center'});
    y+=tLines.length*10+8;

    // Stats em 4 caixas
    const statW2=(cw-9)/4;
    const statsData=[
      {v:String(exs.length),l:'Exercicios'},
      {v:mod.duration,l:'Sessao tipo'},
      {v:mod.difficulty,l:'Nivel base'},
      {v:'3',l:'Variacoes'},
    ];
    statsData.forEach((s,i)=>{
      const sx=ML+i*(statW2+3);
      doc.setFillColor(...CL);
      doc.setDrawColor(...C);
      doc.setLineWidth(0.4);
      doc.roundedRect(sx,y,statW2,16,2,2,'FD');
      doc.setTextColor(...C);
      doc.setFontSize(13);
      doc.setFont('helvetica','bold');
      doc.text(pt(s.v),sx+statW2/2,y+9.5,{align:'center'});
      doc.setTextColor(...CG);
      doc.setFontSize(6.5);
      doc.setFont('helvetica','normal');
      doc.text(s.l,sx+statW2/2,y+14,{align:'center'});
    });
    y+=22;

    // Descrição
    const dLines=doc.splitTextToSize(pt(mod.description),cw-8);
    const dH=dLines.length*4.5+10;
    drawBox(ML,y,cw,dH,[248,250,252],C,CG,'DESCRICAO DO MODULO',CT,dLines);
    doc.setFillColor(...C);doc.rect(ML,y,1.5,dH,'F');
    y+=dH+5;

    // Instrução de uso
    const noteLines=doc.splitTextToSize(
      pt('Cada exercicio tem 3 versoes: SIMPLES (menor capacidade funcional), STANDARD (protocolo clinico base) e CRIATIVA (maximizar engagement e transferencia ecologica). Selecionar conforme o perfil do paciente. Registar versao utilizada.'),
      cw-8);
    const noteH=noteLines.length*4.5+10;
    drawBox(ML,y,cw,noteH,[255,250,235],[253,200,60],[150,90,10],'COMO USAR ESTE PROTOCOLO',[100,60,10],noteLines);
    y+=noteH+5;

    // Linha de crédito final da capa
    doc.setTextColor(...BRAND);
    doc.setFontSize(8.5);
    doc.setFont('helvetica','bold');
    doc.text('Age in Move',W/2,y+5,{align:'center'});
    doc.setFont('helvetica','italic');
    doc.setFontSize(8);
    doc.setTextColor(...CG);
    doc.text('idade em movimento  |  @age_in_move',W/2,y+11,{align:'center'});
    y+=16;
    footer();
  }

  // ════════════════════════════════════════════════════════════
  // EXERCÍCIOS
  // ════════════════════════════════════════════════════════════
  exs.forEach((ex,idx)=>{
    newPage();
    const v=getVariants(ex,mod);
    const diffBg=ex.difficulty==='Fácil'||ex.difficulty==='Facil'
      ?[220,252,231]:ex.difficulty==='Moderado'
      ?[254,249,195]:[254,226,226];
    const diffC=ex.difficulty==='Fácil'||ex.difficulty==='Facil'
      ?[21,128,61]:ex.difficulty==='Moderado'
      ?[133,77,14]:[153,27,27];

    // Número + nome
    doc.setFillColor(...C);
    doc.circle(ML+4.5,y+4.5,4.5,'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(8.5);
    doc.setFont('helvetica','bold');
    doc.text(String(singleEx?'':idx+1),ML+4.5,y+6.3,{align:'center'});
    doc.setTextColor(...CT);
    doc.setFontSize(13.5);
    doc.setFont('helvetica','bold');
    const exNameLines=doc.splitTextToSize(pt(ex.name),cw-20);
    doc.text(exNameLines,ML+12,y+6);
    // Badge dificuldade
    const badgeX=ML+12+doc.getTextWidth(pt(ex.name))+4;
    doc.setFillColor(...diffBg);
    doc.roundedRect(ML+12,y+8,20,5,2,2,'F');
    doc.setTextColor(...diffC);
    doc.setFontSize(6.5);
    doc.setFont('helvetica','bold');
    doc.text(pt(ex.difficulty),ML+22,y+11.7,{align:'center'});
    // Duração
    doc.setTextColor(...CG);
    doc.setFontSize(7.5);
    doc.setFont('helvetica','normal');
    doc.text(pt(ex.duration),ML+35,y+11.7);
    y+=exNameLines.length>1?16:13;

    // Grid objetivo | funções
    const half=(cw-4)/2;
    const objL=doc.splitTextToSize(pt(ex.objective),half-8);
    const cogL=doc.splitTextToSize(pt(ex.cognitive),half-8);
    const gridH=Math.max(objL.length*4.5+12,cogL.length*4.5+12);
    checkY(gridH+4);
    drawBox(ML,y,half,gridH,[248,250,252],CB,CG,
      isFis?'OBJETIVO':'OBJETIVO CLINICO',CT,objL);
    drawBox(ML+half+4,y,half,gridH,[248,250,252],CB,CG,
      isFis?'CAPACIDADES FISICAS':'FUNCOES COGNITIVAS',CT,cogL);
    y+=gridH+4;

    // Materiais
    const matL=doc.splitTextToSize(pt(ex.materials),cw-28);
    const matH=matL.length*4.5+9;
    checkY(matH+4);
    doc.setFillColor(250,250,250);
    doc.setDrawColor(...CB);
    doc.setLineWidth(0.3);
    doc.roundedRect(ML,y,cw,matH,1.5,1.5,'FD');
    doc.setTextColor(...CG);doc.setFontSize(6.5);doc.setFont('helvetica','bold');
    doc.text('MATERIAIS:',ML+3.5,y+5);
    doc.setTextColor(...CT);doc.setFontSize(8);doc.setFont('helvetica','normal');
    doc.text(matL,ML+24,y+5);
    y+=matH+4;

    // Instruções
    if(ex.instructions){
      const iL=doc.splitTextToSize(pt(ex.instructions),cw-8);
      const iH=iL.length*4.5+11;
      checkY(iH+4);
      drawBox(ML,y,cw,iH,[239,246,255],[147,197,253],[29,78,216],
        'INSTRUCOES DE APLICACAO',[30,58,95],iL);
      doc.setFillColor(37,99,235);doc.rect(ML,y,1.5,iH,'F');
      y+=iH+4;
    }

    // Versão simples
    const sL=doc.splitTextToSize(pt(v.s),cw-8);
    const sH=sL.length*4.5+11;
    checkY(sH+4);
    drawBox(ML,y,cw,sH,[240,253,244],[134,239,172],[21,128,61],
      'VERSAO SIMPLES - para pacientes com menor capacidade funcional',[20,83,45],sL);
    y+=sH+4;

    // Variante criativa
    const ccL=doc.splitTextToSize(pt(v.c),cw-8);
    const ccH=ccL.length*4.5+11;
    checkY(ccH+4);
    drawBox(ML,y,cw,ccH,CL,C,C,
      'VARIANTE CRIATIVA - maximizar engagement e transferencia ecologica',CT,ccL);
    y+=ccH+4;

    // Ficha de registo
    const recH=28;
    checkY(recH+4);
    doc.setFillColor(249,250,251);
    doc.setDrawColor(...CB);doc.setLineWidth(0.3);
    doc.roundedRect(ML,y,cw,recH,1.5,1.5,'FD');
    doc.setTextColor(...CG);doc.setFontSize(6.5);doc.setFont('helvetica','bold');
    doc.text('REGISTO DE SESSAO',ML+3.5,y+5);
    doc.setTextColor(...CT);doc.setFontSize(8.5);doc.setFont('helvetica','normal');
    doc.text('Data: ____/____/________',ML+3.5,y+11);
    doc.text('Duracao real: ______ min',ML+66,y+11);
    doc.text('Esfoco RPE: ___/10',ML+132,y+11);
    doc.text('Desempenho: [] Excelente  [] Bom  [] Razoavel  [] Fraco',ML+3.5,y+17);
    doc.text('Versao usada: [] Standard  [] Simples  [] Criativa',ML+3.5,y+22.5);
    doc.setDrawColor(...CB);doc.setLineWidth(0.2);
    doc.line(ML+3.5,y+27,ML+cw-3.5,y+27);
    y+=recH+6;
  });

  // ════════════════════════════════════════════════════════════
  // PLANO DE PROGRESSÃO (apenas módulo completo)
  // ════════════════════════════════════════════════════════════
  if(!singleEx){
    newPage();
    doc.setTextColor(...CT);doc.setFontSize(14);doc.setFont('helvetica','bold');
    doc.text(pt('Plano de Progressao - 8 Semanas'),ML,y);
    doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(...CG);
    doc.text(pt(mod.name),ML,y+6);
    y+=13;
    // Tabela
    const cols=['Semana','Data Sessao','Exercicios realizados','Carga / Nivel','Desempenho','Notas'];
    const cws=[20,28,42,28,30,32];
    // Header
    doc.setFillColor(...C);doc.rect(ML,y,cw,8,'F');
    doc.setTextColor(255,255,255);doc.setFontSize(7.5);doc.setFont('helvetica','bold');
    let tx=ML;
    cols.forEach((c,i)=>{doc.text(pt(c),tx+2,y+5.5);tx+=cws[i];});
    y+=8;
    for(let w=1;w<=8;w++){
      if(w%2===0){doc.setFillColor(248,250,252);doc.rect(ML,y,cw,9,'F');}
      doc.setDrawColor(...CB);doc.setLineWidth(0.2);doc.rect(ML,y,cw,9);
      doc.setTextColor(...CT);doc.setFontSize(8);doc.setFont('helvetica','bold');
      doc.text('Sem. '+w,ML+2,y+6);
      doc.setFont('helvetica','normal');
      let tx2=ML+cws[0];
      doc.text('___/___/____',tx2+2,y+6);tx2+=cws[1];
      tx2+=cws[2];tx2+=cws[3];
      y+=9;
    }
    y+=10;
    // Referências
    const refs=isFis
      ?['WHO (2020). Physical activity guidelines for older adults.','ACSM (2022). Exercise prescription guidelines.','Sherrington et al. (2019). Fall prevention. Cochrane Review.','Mirelman et al. (2016). Lancet Neurology - Dual task training.','EWGSOP2 (2018). Sarcopaenia: revised European consensus.']
      :['Baddeley & Hitch (1974). Working memory model.','Petersen (2004). Mild cognitive impairment. J. Internal Medicine.','Rebok et al. (2014). ACTIVE Cognitive Training Trial. JAGS.','Woods et al. (2012). Cochrane Review - Cognitive stimulation.','Guerreiro et al. (1994). MMSE Portuguese normative data.'];
    checkY(refs.length*5+14);
    doc.setFontSize(9.5);doc.setFont('helvetica','bold');doc.setTextColor(...CT);
    doc.text('Referencias Cientificas',ML,y);y+=6;
    doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(...CG);
    refs.forEach(r=>{doc.text('- '+pt(r),ML,y);y+=5;});
    // Marca final com logo
    y+=8;
    try{ doc.addImage(logo,'PNG',W/2-5,y,10,10); }catch(e){}
    y+=13;
    doc.setFontSize(10);doc.setFont('helvetica','bold');doc.setTextColor(...BRAND);
    doc.text('Age in Move',W/2,y,{align:'center'});
    doc.setFont('helvetica','italic');doc.setFontSize(8.5);doc.setTextColor(...CG);
    doc.text('idade em movimento  |  @age_in_move',W/2,y+6,{align:'center'});
  }

  footer();
  return doc;
}

function exportModulePDF(mod){
  const doc=makePDF(mod,null);
  if(doc) doc.save(pt('ageinmove-'+mod.name).replace(/\s+/g,'-').toLowerCase()+'.pdf');
}

function exportExercisePDF(ex,mod){
  const doc=makePDF(mod,ex);
  if(doc) doc.save(pt('ageinmove-'+ex.name).replace(/\s+/g,'-').toLowerCase()+'.pdf');
}

function DashboardHome({setPage,openPatient}){
  const {patients,sessions,events,profile}=useStore();
  const now=new Date();
  const today=todayISO();
  const monthKey=today.slice(0,7);
  const prevMonth=new Date(now.getFullYear(),now.getMonth()-1,1);
  const prevKey=`${prevMonth.getFullYear()}-${String(prevMonth.getMonth()+1).padStart(2,'0')}`;
  const sessMonth=sessions.filter(s=>s.date.startsWith(monthKey)).length;
  const sessPrev=sessions.filter(s=>s.date.startsWith(prevKey)).length;
  const newThisMonth=patients.filter(p=>(p.createdAt||'').startsWith(monthKey)).length;
  const atRisk=patients.filter(p=>p.risk!=='low');
  const highRisk=patients.filter(p=>p.risk==='high').length;
  const upcoming=events.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);
  const todayCount=events.filter(e=>e.date===today&&e.type==='session').length;
  const exCount=MODULES.reduce((n,m)=>n+(m.exercises_list?m.exercises_list.length:(+m.exercises||0)),0);
  const stats=[
    {label:'Pacientes Ativos',value:String(patients.length),sub:newThisMonth?`+${newThisMonth} este mês`:'Sem novos este mês',icon:'👥',bg:'#eff6ff',ic:'#1d4ed8'},
    {label:'Sessões este Mês',value:String(sessMonth),sub:`${sessPrev} no mês anterior`,icon:'📋',bg:'#f0fdf4',ic:'#15803d'},
    {label:'Módulos',value:String(MODULES.length),sub:`${exCount} exercícios`,icon:'📚',bg:'#faf5ff',ic:'#6d28d9'},
    {label:'Alertas',value:String(highRisk),sub:highRisk?'Risco alto — rever':'Sem alertas',icon:'⚠️',bg:'#fffbeb',ic:'#b45309'},
  ];
  const hour=now.getHours();
  const greet=hour<12?'Bom dia':hour<20?'Boa tarde':'Boa noite';
  const dateStr=now.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return(
    <div className="page">
      <div style={{marginBottom:20}}>
        <h2 style={{fontSize:22,fontWeight:800,color:'#0f172a'}}>{greet}, {profile.name.split(' ').slice(0,2).join(' ')}! 👋</h2>
        <p style={{color:'#64748b',fontSize:14}}>{dateStr.charAt(0).toUpperCase()+dateStr.slice(1)} · {todayCount} {todayCount===1?'sessão':'sessões'} hoje</p>
      </div>
      <div className="grid-4" style={{marginBottom:20}}>
        {stats.map(s=>(
          <div className="stat-card" key={s.label}>
            <div className="stat-icon" style={{background:s.bg,color:s.ic,fontSize:24}}>{s.icon}</div>
            <div><div className="stat-label">{s.label}</div><div className="stat-value">{s.value}</div><div className="stat-sub">{s.sub}</div></div>
          </div>
        ))}
      </div>
      <div className="grid-2">
        <div className="card">
          <div className="card-header"><div className="card-title">Próximos Eventos</div><button className="btn btn-sm btn-secondary" onClick={()=>setPage('calendar')}>Ver calendário</button></div>
          {upcoming.length===0&&<p style={{fontSize:14,color:'#64748b',padding:'10px 0'}}>Sem eventos agendados. Adicione sessões no calendário.</p>}
          {upcoming.map(e=>{
            const p=patients.find(x=>x.id===e.patientId);
            return(
              <div key={e.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:'1px solid #f1f5f9',cursor:p?'pointer':'default'}} onClick={()=>p&&openPatient(p.id)}>
                <div style={{width:52,fontSize:13,fontWeight:700,color:'#64748b'}}>{e.date===today?'Hoje':fmtDate(e.date).slice(0,5)}</div>
                <div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{e.title}</div><div style={{fontSize:12,color:'#64748b'}}>{e.time?`${e.time} · `:''}{e.type==='session'?'Sessão':e.type==='meeting'?'Reunião':'Formação'}</div></div>
                <span className={`badge badge-${e.date===today?'blue':'gray'}`}>{e.date===today?'Hoje':'Agendada'}</span>
              </div>
            );
          })}
        </div>
        <div className="card">
          <div className="card-header"><div className="card-title">Pacientes em Risco</div><button className="btn btn-sm btn-secondary" onClick={()=>setPage('patients')}>Ver todos</button></div>
          {atRisk.length===0&&<p style={{fontSize:14,color:'#64748b',padding:'10px 0'}}>Nenhum paciente em risco médio ou alto.</p>}
          {atRisk.map(p=>(
            <div key={p.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:'1px solid #f1f5f9',cursor:'pointer'}} onClick={()=>openPatient(p.id)}>
              <div className="avatar" style={{background:p.avatar}}>{p.initials}</div>
              <div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{p.name}</div><div style={{fontSize:12,color:'#64748b'}}>{p.diagnosis}</div></div>
              <div style={{textAlign:'right'}}>
                <div style={{fontWeight:700,fontSize:15,color:mmseColor(p.mmse)}}>MMSE {p.mmse??'—'}</div>
                <span className={`badge badge-${p.risk==='high'?'red':'yellow'}`}>{p.risk==='high'?'Alto':'Médio'}</span>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

  const sorted=[...(mod.exercises_list||[])].sort((a,b)=>{const o={Fácil:0,Moderado:1,Difícil:2};return o[a.difficulty]-o[b.difficulty];});
  return(
    <div className="page">
      {/* Cabeçalho */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
        <button className="btn btn-secondary btn-sm" onClick={()=>setPage('modules')}>← Voltar</button>

        </div>
        <button className="btn btn-primary btn-sm" style={{background:tc,flexShrink:0}} onClick={()=>exportModulePDF(mod)}>

function NewAssessmentModal({patient,onClose}){
  const {addAssessments}=useStore();
  const [date,setDate]=useState(todayISO());
  const [vals,setVals]=useState({mmse:'',gds:'',barthel:'',moca:''});
  const [notes,setNotes]=useState('');
  const [err,setErr]=useState('');
  const save=()=>{
    const parsed={};
    for(const [k,v] of Object.entries(vals)){
      const n=numOrNull(v);
      if(n!=null&&(n<0||n>SCALES[k].max)){setErr(`${SCALES[k].name}: valor entre 0 e ${SCALES[k].max}.`);return;}
      parsed[k]=n;
    }
    if(Object.values(parsed).every(v=>v==null)){setErr('Preencha pelo menos uma escala.');return;}
    addAssessments(patient.id,date,parsed,notes.trim());
    onClose();
  };
  return(
    <Modal title={`Nova Avaliação — ${patient.name}`} onClose={onClose}>
      {err&&<div className="alert alert-warning" style={{marginBottom:12}}>{err}</div>}
      <div className="form-group"><label>Data *</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
      <div className="grid-2">
        {Object.entries(SCALES).map(([k,s])=>(
          <div key={k} className="form-group"><label>{s.name} (0–{s.max})</label><input type="number" min={0} max={s.max} value={vals[k]} onChange={e=>setVals(v=>({...v,[k]:e.target.value}))} placeholder={patient[k]!=null?`Atual: ${patient[k]}`:'—'}/></div>
        ))}

      <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:16}}>
        <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={save}>Guardar Avaliação</button>
      </div>
    </Modal>
  );
}

// ─── GRÁFICO DE EVOLUÇÃO DAS ESCALAS ───────────────────────────────────────
const SCALE_BANDS={
  mmse:{cuts:[{v:27,label:'Normal ≥27'},{v:24,label:'DCL 24'}],inverse:false},
  moca:{cuts:[{v:26,label:'Normal ≥26'}],inverse:false},
  gds:{cuts:[{v:5,label:'Normal ≤5'},{v:10,label:'Leve ≤10'}],inverse:true},
  barthel:{cuts:[{v:95,label:'Indep. ≥95'},{v:75,label:'Leve ≥75'}],inverse:false},
};
function ScaleChart({points,scale}){
  const [hover,setHover]=useState(null);
  const max=SCALES[scale].max, band=SCALE_BANDS[scale];
  const W=1000,H=260,ml=44,mr=20,mt=18,mb=30,iw=W-ml-mr,ih=H-mt-mb,pad=points.length>1?Math.min(60,iw/(points.length*2)):0;
  // Posição ordinal: cada avaliação tem o seu lugar, mesmo que no mesmo dia
  const idx=new Map(points.map((p,i)=>[p.id,i]));
  const xi=i=>points.length===1?ml+iw/2:ml+pad+(i/(points.length-1))*(iw-2*pad);
  const xp=p=>xi(idx.get(p.id));
  const y=v=>mt+ih-(v/max)*ih;
  const step=max===15?5:max===30?10:25;const ticks=[];for(let t=0;t<=max;t+=step)ticks.push(t);
  const path=points.map((p,i)=>`${i?'L':'M'}${xi(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const first=points[0].value,last=points[points.length-1].value,delta=last-first;
  const better=band.inverse?delta<0:delta>0;
  const xLabels=points.length<=8?points:[points[0],points[Math.floor(points.length/2)],points[points.length-1]];
  return(
    <div>
      <div style={{display:'flex',gap:20,marginBottom:8,fontSize:13,color:'#64748b',flexWrap:'wrap'}}>
        <span>Atual: <strong style={{color:'#0f172a',fontSize:16}}>{last}</strong>/{max}</span>
        {points.length>1&&<span>Variação desde {fmtDate(points[0].date)}: <strong style={{color:delta===0?'#64748b':better?'#16a34a':'#dc2626'}}>{delta>0?'+':''}{delta}</strong></span>}
        <span>{points.length} {points.length===1?'registo':'registos'}</span>
      </div>
      <div style={{position:'relative'}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}} role="img" aria-label={`Evolução ${SCALES[scale].name}`}>
          {ticks.map(t=>(
            <g key={t}>
              <line x1={ml} x2={W-mr} y1={y(t)} y2={y(t)} stroke="#f1f5f9"/>
              <text x={ml-8} y={y(t)+4} textAnchor="end" fontSize="11" fill="#94a3b8">{t}</text>
            </g>
          ))}
          {band.cuts.map(c=>(
            <g key={c.v}>
              <line x1={ml} x2={W-mr} y1={y(c.v)} y2={y(c.v)} stroke="#cbd5e1" strokeDasharray="4 4"/>
              <text x={W-mr} y={y(c.v)-4} textAnchor="end" fontSize="10" fill="#94a3b8">{c.label}</text>
            </g>
          ))}
          {xLabels.map(p=><text key={'x'+p.id} x={xp(p)} y={H-10} textAnchor="middle" fontSize="11" fill="#94a3b8">{fmtDate(p.date).slice(0,5)}/{p.date.slice(2,4)}</text>)}
          {points.length>1&&<path d={path} fill="none" stroke="#FF6200" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>}
          {points.map((p,i)=>(
            <g key={p.id} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)} style={{cursor:'default'}}>
              <circle cx={xp(p)} cy={y(p.value)} r="12" fill="transparent"/>
              <circle cx={xp(p)} cy={y(p.value)} r={hover===i?5:3.5} fill="#FF6200" stroke="#fff" strokeWidth="2" style={{pointerEvents:'none'}}/>
            </g>
          ))}
          {points.length<=8&&points.map(p=><text key={'v'+p.id} x={xp(p)} y={y(p.value)-10} textAnchor="middle" fontSize="11" fontWeight="700" fill="#334155" style={{pointerEvents:'none'}}>{p.value}</text>)}
        </svg>
        {hover!=null&&(()=>{const p=points[hover];return(
          <div style={{position:'absolute',left:`${xp(p)/W*100}%`,top:`${y(p.value)/H*100}%`,transform:'translate(-50%,calc(-100% - 14px))',background:'#0f172a',color:'#fff',fontSize:12,padding:'6px 10px',borderRadius:6,whiteSpace:'nowrap',pointerEvents:'none'}}>
            <strong>{p.value}/{max}</strong> · {fmtDate(p.date)}{p.notes?<div style={{color:'#cbd5e1',maxWidth:240,whiteSpace:'normal'}}>{p.notes}</div>:null}
          </div>);})()}
      </div>
    </div>
  );
}
function ScaleEvolution({assessments}){
  const available=Object.keys(SCALES).filter(k=>assessments.some(a=>a.scale===k));
  const [scale,setScale]=useState(available[0]||'mmse');
  if(!available.length) return null;
  const cur=available.includes(scale)?scale:available[0];
  const points=assessments.filter(a=>a.scale===cur).slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  return(
    <div className="card">
      <div className="card-header" style={{marginBottom:12,flexWrap:'wrap',gap:8}}>
        <div className="card-title">Evolução das Escalas</div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {available.map(k=><button key={k} className={`btn btn-sm ${k===cur?'btn-primary':'btn-secondary'}`} onClick={()=>setScale(k)}>{SCALES[k].name}</button>)}
        </div>
      </div>
      <ScaleChart key={cur} points={points} scale={cur}/>
    </div>
  );
}
