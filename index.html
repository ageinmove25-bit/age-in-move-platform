const EBOOKS=[{"slug":"tonicidade","vol":1,"titulo":"Tonicidade","subtitulo":"Regular o tónus, acalmar o corpo, focar a mente","cor":"#C2410C","corClara":"#FFEDD5","definicao":"A tonicidade é a base de toda a atividade motora: corresponde ao estado de tensão ativa dos músculos, em repouso e em movimento. Regula a postura, prepara o gesto e reflete o estado emocional — um corpo tenso é, muitas vezes, uma mente em alerta.","envelhecimento":"Com a idade surgem com frequência paratonias (dificuldade em descontrair voluntariamente), rigidez e uma menor capacidade de graduar a força. Estas alterações aumentam o gasto energético, reduzem a precisão do gesto e associam-se a ansiedade e a menor bem-estar.","sinais":["Dificuldade em \"deixar cair\" um braço quando mobilizado","Força excessiva em tarefas simples (agarrar um copo, escrever)","Ombros elevados e respiração curta em repouso","Tremor ou rigidez que aumentam com o stress"],"cognicao":"Regular o tónus exige atenção ao próprio corpo, inibição de respostas automáticas e capacidade de modular a ação segundo uma instrução. Por isso, as atividades deste volume treinam também a atenção seletiva, o controlo inibitório e a memória de trabalho.","objetivos":["Melhorar a descontração voluntária e reduzir paratonias","Graduar a força segundo a exigência da tarefa","Promover a autorregulação emocional através da respiração","Treinar atenção e inibição em simultâneo com o controlo tónico"],"pdf":"materiais/ebooks/pdf/Vol1-tonicidade.pdf","atividades":[{"nome":"Contrair e Soltar com Palavras","objetivo":"Alternar contração e relaxamento muscular em resposta a categorias semânticas, associando o controlo tónico à atenção seletiva.","cognitivo":["Atenção seletiva","Controlo inibitório","Memória semântica"],"duracao":"10 min","nivel":"Fácil","posicao":"Sentado","materiais":"Cadeira com encosto; lista de 20 palavras (frutas e animais misturados)","passos":["Ensinar a regra: ouvir uma FRUTA → fechar as mãos com força; ouvir um ANIMAL → abrir e soltar as mãos.","Treinar 4 palavras devagar, confirmando a compreensão.","Dizer a lista a um ritmo de 1 palavra a cada 3 segundos.","Observar a qualidade do relaxamento: as mãos ficam realmente soltas?","No final, pedir que recorde 3 frutas e 3 animais que ouviu."],"facilitar":"Usar apenas uma categoria (só contrair nas frutas) e cartões com imagens.","dificultar":"Acrescentar uma terceira categoria (ex.: cores → contrair os ombros) ou inverter a regra a meio.","dica":"Peça sempre uma expiração lenta no momento de soltar — reforça a descontração."},{"nome":"Forte, Médio, Leve","objetivo":"Graduar a força de preensão em três intensidades, seguindo códigos de cor e sequências memorizadas.","cognitivo":["Memória de trabalho","Associação simbólica","Atenção sustentada"],"duracao":"12 min","nivel":"Moderado","posicao":"Sentado","materiais":"Bola de espuma ou de pressão; cartões vermelho (forte), amarelo (médio) e verde (leve)","passos":["Apresentar os três cartões e demonstrar cada intensidade de aperto.","Mostrar um cartão de cada vez e pedir o aperto correspondente (5 segundos).","Passar a sequências: mostrar 2 cartões, escondê-los e pedir a execução de memória.","Aumentar progressivamente até sequências de 4–5 cores.","Trocar de mão a meio da atividade."],"facilitar":"Manter os cartões visíveis durante a execução.","dificultar":"Dizer a sequência apenas oralmente, ou pedir a execução pela ordem inversa.","dica":"Se dispuser de dinamómetro, registe a força máxima no início e no fim do programa."},{"nome":"Braço de Trapos","objetivo":"Promover o abandono do peso do membro (descontração passiva) enquanto a atenção é desviada para uma tarefa cognitiva.","cognitivo":["Atenção dividida","Cálculo mental","Consciência corporal"],"duracao":"8 min","nivel":"Moderado","posicao":"Sentado","materiais":"Cadeira sem braços; almofada no colo","passos":["Explicar: \"Vou levantar o seu braço; deixe-o pesado, como um boneco de trapos.\"","Levantar o antebraço pelo pulso e largá-lo sobre a almofada. Observar se cai livremente.","Repetir enquanto a pessoa conta de 20 para trás.","Repetir com contagem de 3 em 3 (3, 6, 9…).","Comparar a qualidade da descontração com e sem tarefa cognitiva."],"facilitar":"Contagem simples para a frente ou dizer os dias da semana.","dificultar":"Subtrações de 7 em 7 a partir de 100.","dica":"Segurança: largue apenas de pequenas alturas e sempre sobre a almofada. Interrompa se houver dor no ombro."},{"nome":"Estátuas Musicais Sentadas","objetivo":"Passar do movimento livre à imobilidade total numa postura definida, ao parar a música.","cognitivo":["Controlo inibitório","Atenção auditiva","Memória visual"],"duracao":"10 min","nivel":"Fácil","posicao":"Sentado","materiais":"Música portuguesa conhecida; 6 cartões com posturas desenhadas (braços no ar, mãos nos joelhos, etc.)","passos":["Com música: movimentar livremente braços e tronco.","Antes de parar a música, mostrar um cartão de postura durante 3 segundos.","Quando a música para: assumir a postura e ficar \"estátua\" 5 segundos.","Progredir: mostrar o cartão no início e só parar a música 30 segundos depois.","Conversar: que música era? Que lembranças traz?"],"facilitar":"Manter o cartão visível durante a pausa.","dificultar":"Mostrar 2 cartões e indicar qual usar com um sinal (palma = 1.º, duas palmas = 2.º).","dica":"Excelente para grupos — a componente de reminiscência musical aumenta a adesão."},{"nome":"Respiração das Imagens","objetivo":"Regular o tónus através da respiração guiada por imagens mentais, consolidando depois a sua memorização.","cognitivo":["Imagética mental","Memória episódica","Atenção sustentada"],"duracao":"10 min","nivel":"Fácil","posicao":"Sentado","materiais":"Ambiente calmo; guião com 5 imagens (flor, vela, sopa quente, balão, folha ao vento)","passos":["Sentar confortável, pés apoiados, olhos fechados se desejar.","Imagem 1: \"Cheire uma flor\" (inspirar pelo nariz) — \"apague uma vela\" (expirar pela boca).","Repetir 3 respirações por imagem, percorrendo as 5 imagens.","Abrir os olhos e pedir que recorde as imagens pela ordem.","Perguntar qual a imagem preferida e porquê."],"facilitar":"Usar apenas 3 imagens e cartões ilustrados.","dificultar":"Pedir que crie uma pequena história que ligue todas as imagens.","dica":"Ideal para início ou fim de sessão. Observe a descida dos ombros como indicador de relaxamento."},{"nome":"Pesos Imaginários","objetivo":"Modular o tónus ao manusear objetos imaginários de pesos diferentes e reconhecer objetos através da mímica.","cognitivo":["Gnosia","Imagem mental","Raciocínio dedutivo"],"duracao":"12 min","nivel":"Moderado","posicao":"Misto","materiais":"Lista de objetos: pena, livro, garrafão de água, balde, bebé, saco de compras","passos":["O terapeuta demonstra, por mímica, levantar uma pena e depois um garrafão.","A pessoa reproduz, ajustando a tensão muscular ao \"peso\".","Inversão de papéis: o terapeuta faz mímica e a pessoa adivinha o objeto.","A pessoa escolhe um objeto em segredo e faz a mímica para o grupo adivinhar.","Ordenar os objetos do mais leve ao mais pesado, de memória."],"facilitar":"Usar objetos reais primeiro e só depois os imaginários.","dificultar":"Introduzir objetos frágeis (ovos, copo de cristal) que exigem precisão e pouca força.","dica":"Observe a coerência entre o peso imaginado e a postura do tronco."}]},{"slug":"equilibracao","vol":2,"titulo":"Equilibração","subtitulo":"Firmeza no corpo, agilidade no pensamento","cor":"#0F766E","corClara":"#CCFBF1","definicao":"A equilibração é a capacidade de manter e recuperar o controlo postural, parado ou em movimento. Integra informação visual, vestibular e propriocetiva e depende de uma tonicidade adequada.","envelhecimento":"O declínio do equilíbrio é um dos principais fatores de risco de queda. Cerca de um terço das pessoas com mais de 65 anos cai pelo menos uma vez por ano, e o medo de cair leva frequentemente à redução da atividade e ao isolamento.","sinais":["Alargamento da base de apoio ao andar","Necessidade de se apoiar nos móveis","Dificuldade em virar-se ou em parar de repente","Parar de andar para falar (perda de dupla tarefa)"],"cognicao":"Manter o equilíbrio consome recursos atencionais. Quando a atenção é dividida — falar enquanto se anda — o risco de queda aumenta. Treinar o equilíbrio em dupla tarefa melhora a gestão da atenção e a funcionalidade no dia a dia.","objetivos":["Melhorar o equilíbrio estático e dinâmico","Reduzir o risco e o medo de queda","Treinar a atenção dividida (dupla tarefa)","Aumentar a confiança nas deslocações do dia a dia"],"pdf":"materiais/ebooks/pdf/Vol2-equilibracao.pdf","atividades":[{"nome":"Apoio Unipodal com Contagem","objetivo":"Manter o apoio sobre uma perna, com segurança, enquanto se realiza uma tarefa de sequenciação verbal.","cognitivo":["Atenção dividida","Sequenciação","Memória semântica"],"duracao":"8 min","nivel":"Moderado","posicao":"Em pé","materiais":"Cadeira estável ou bancada para apoio; cronómetro","passos":["Em pé atrás da cadeira, mãos apoiadas no encosto.","Levantar ligeiramente um pé e manter 10 segundos.","Repetir dizendo os dias da semana.","Repetir dizendo os meses do ano pela ordem inversa.","Trocar de perna. Registar o tempo máximo em cada condição."],"facilitar":"Manter as duas mãos no apoio; apenas aliviar o peso de um pé.","dificultar":"Apoio com um só dedo ou sem apoio; olhos fechados (só com supervisão próxima).","dica":"Segurança: o terapeuta posiciona-se ao lado, do lado da perna levantada."},{"nome":"Caminho das Pedras","objetivo":"Deslocar-se com precisão sobre marcas coloridas no chão, seguindo instruções e sequências memorizadas.","cognitivo":["Memória de trabalho","Atenção visual","Planeamento"],"duracao":"12 min","nivel":"Moderado","posicao":"Em pé","materiais":"10 discos ou folhas coloridas antiderrapantes (4 cores) fixas no chão","passos":["Distribuir os discos em duas filas, com passos de comprimento confortável.","Instrução simples: \"Pise apenas nos discos azuis.\"","Instrução sequencial: \"Azul, depois amarelo, depois azul.\"","Pedir que memorize a sequência antes de começar a andar.","No final, perguntar quantos discos de cada cor pisou."],"facilitar":"Discos maiores e mais próximos; uma única cor.","dificultar":"Sequências de 4 cores ou regra condicional (\"se pisar vermelho, o próximo é verde\").","dica":"Fixe bem os discos — nunca use folhas soltas em chão liso."},{"nome":"Rosa dos Ventos","objetivo":"Transferir o peso do corpo em quatro direções, associando cada direção a categorias de palavras.","cognitivo":["Fluência verbal","Orientação espacial","Flexibilidade cognitiva"],"duracao":"10 min","nivel":"Fácil","posicao":"Em pé","materiais":"4 cartões colocados à volta da pessoa: N (frente), S (trás), E (direita), O (esquerda)","passos":["Pés afastados à largura das ancas, apoio próximo.","Ao ouvir \"Norte\", inclinar o corpo para a frente sem tirar os calcanhares do chão; voltar ao centro.","Repetir para as quatro direções.","Associar categorias: Norte = cidade do Norte de Portugal; Sul = cidade do Sul; etc.","Cada inclinação vem acompanhada de uma palavra da categoria."],"facilitar":"Apenas frente e trás; categorias simples (frutas, cores).","dificultar":"Diagonais (Nordeste, Sudoeste) e categorias mais exigentes.","dica":"Peça a inclinação \"a partir dos tornozelos\", com o corpo direito como uma tábua."},{"nome":"O Empregado de Mesa","objetivo":"Andar transportando um tabuleiro com objetos, mantendo a estabilidade enquanto se responde a perguntas.","cognitivo":["Atenção dividida","Memória de curto prazo","Evocação"],"duracao":"10 min","nivel":"Exigente","posicao":"Em pé","materiais":"Tabuleiro leve; copo de plástico com água até meio; 3 objetos pequenos; percurso de 6 metros","passos":["Andar o percurso com o tabuleiro vazio.","Repetir com o copo de plástico.","O terapeuta faz um \"pedido\" de 3 itens (ex.: café, torrada, sumo) antes da partida.","Ao chegar ao fim, a pessoa repete o pedido.","Aumentar o pedido para 4–5 itens."],"facilitar":"Tabuleiro vazio e percurso sem curvas.","dificultar":"Incluir uma curva de 180.º e um obstáculo baixo.","dica":"Use apenas plástico. Para pessoas com auxiliar de marcha, adapte para transporte de um objeto numa bolsa."},{"nome":"Tandem das Letras","objetivo":"Andar sobre uma linha, calcanhar à frente dos dedos, gerando palavras começadas por uma letra definida.","cognitivo":["Fluência fonémica","Atenção","Controlo executivo"],"duracao":"8 min","nivel":"Exigente","posicao":"Em pé","materiais":"Fita adesiva no chão (3 m) junto a uma parede ou barra de apoio","passos":["Andar ao longo da fita, ao lado da parede, em passo normal.","Passar para marcha \"calcanhar-ponta\".","Escolher uma letra (ex.: M). A cada passo, dizer uma palavra começada por M.","Contar os passos e as palavras válidas.","Repetir com nova letra."],"facilitar":"Semitandem (pés ligeiramente afastados) e categorias semânticas em vez de letras.","dificultar":"Letras menos frequentes (L, T, F) ou alternar duas letras.","dica":"Mantenha sempre um apoio a menos de um braço de distância."},{"nome":"Sentar e Levantar com Cálculo","objetivo":"Realizar transferências sentado-em pé apenas quando o resultado de um cálculo cumpre uma regra.","cognitivo":["Cálculo mental","Tomada de decisão","Controlo inibitório"],"duracao":"10 min","nivel":"Moderado","posicao":"Misto","materiais":"Cadeira com braços encostada à parede; lista de somas simples","passos":["Treinar a técnica: chegar à frente na cadeira, pés recuados, inclinar o tronco, levantar.","Regra: o terapeuta diz uma soma; se o resultado for PAR, levantar; se for ÍMPAR, ficar sentado.","Fazer 10 somas, registando acertos e transferências.","Inverter a regra.","Registar o número de levantamentos em 30 segundos (teste de referência)."],"facilitar":"Usar cartões com números (par = levantar) sem cálculo.","dificultar":"Subtrações ou multiplicações simples.","dica":"O teste de levantar da cadeira em 30 segundos é um bom indicador de evolução."}]},{"slug":"lateralizacao","vol":3,"titulo":"Lateralização","subtitulo":"Direita e esquerda: orientar o corpo e o mundo","cor":"#7C3AED","corClara":"#EDE9FE","definicao":"A lateralização traduz a organização funcional dos dois lados do corpo e a preferência de um deles (mão, olho, pé, ouvido). Inclui a capacidade de reconhecer direita e esquerda em si próprio, nos outros e no espaço.","envelhecimento":"Embora a dominância se mantenha, a pessoa idosa pode revelar mais hesitações na distinção direita-esquerda, sobretudo quando tem de a transpor para o outro (frente a frente) ou para mapas. Após um AVC, o lado afetado pode ser negligenciado.","sinais":["Hesitação ao seguir indicações \"vire à direita\"","Confusão ao imitar alguém de frente","Tendência a ignorar um dos lados do corpo ou do espaço","Dificuldade em vestir o casaco pelo lado certo"],"cognicao":"Distinguir direita e esquerda envolve linguagem, orientação espacial e transformação mental (rodar imagens mentalmente). É também um excelente treino de controlo inibitório quando a informação visual e verbal entram em conflito.","objetivos":["Consolidar o reconhecimento direita-esquerda em si e no outro","Estimular a utilização do lado não dominante","Treinar a rotação mental e a orientação em mapas","Promover a atenção a ambos os hemiespaços"],"pdf":"materiais/ebooks/pdf/Vol3-lateralizacao.pdf","atividades":[{"nome":"Direita, Esquerda, Troca!","objetivo":"Identificar segmentos corporais do lado direito e esquerdo, cruzando a linha média do corpo.","cognitivo":["Compreensão verbal","Atenção","Velocidade de processamento"],"duracao":"8 min","nivel":"Fácil","posicao":"Sentado","materiais":"Nenhum; opcional: fita vermelha no pulso direito","passos":["Pedir: \"Levante a mão direita\", \"Mostre o pé esquerdo\".","Cruzamentos: \"Mão direita na orelha esquerda\".","Ao ouvir \"Troca!\", inverter: mão esquerda na orelha direita.","Aumentar a rapidez das instruções.","Pedir à pessoa que dê instruções ao terapeuta."],"facilitar":"Usar a fita no pulso como referência visual.","dificultar":"Instruções compostas: \"Mão direita no joelho esquerdo e olhe para a direita\".","dica":"Cruzar a linha média ativa a comunicação entre os dois hemisférios."},{"nome":"Espelho ou Fotografia?","objetivo":"Imitar gestos do terapeuta em modo espelho e em modo \"fotografia\" (lado real), treinando a transposição espacial.","cognitivo":["Rotação mental","Flexibilidade cognitiva","Atenção visual"],"duracao":"10 min","nivel":"Moderado","posicao":"Sentado","materiais":"Duas cadeiras frente a frente; cartões \"ESPELHO\" e \"FOTOGRAFIA\"","passos":["Modo espelho: o terapeuta levanta a mão direita, a pessoa levanta a esquerda (como num espelho).","Repetir 5 gestos simples.","Modo fotografia: a pessoa usa o mesmo lado anatómico do terapeuta.","Alternar o modo mostrando o cartão antes de cada gesto.","Discutir qual dos modos é mais difícil e porquê."],"facilitar":"Sentar lado a lado (sem inversão) antes de passar a frente a frente.","dificultar":"Gestos assimétricos com as duas mãos em simultâneo.","dica":"Registe o número de erros por modo — o modo fotografia é geralmente mais exigente."},{"nome":"A Minha Casa por Dentro","objetivo":"Descrever a disposição da própria casa usando referências direita-esquerda a partir de pontos de vista diferentes.","cognitivo":["Memória autobiográfica","Representação espacial","Linguagem"],"duracao":"12 min","nivel":"Moderado","posicao":"Sentado","materiais":"Folha A3 e lápis; opcional: planta simples da casa","passos":["Perguntar: \"Ao entrar pela porta, o que fica à sua direita? E à esquerda?\"","Percorrer mentalmente a casa até à cozinha, descrevendo o trajeto.","Mudar de ponto de vista: \"E se estiver na cozinha a olhar para a porta?\"","Desenhar um esboço simples da planta.","Recordar a casa de infância e comparar."],"facilitar":"Descrever só a divisão onde passa mais tempo.","dificultar":"Dar indicações para alguém ir da sala ao quarto de olhos fechados.","dica":"Atividade rica em reminiscência — reserve tempo para histórias."},{"nome":"Setas Traiçoeiras","objetivo":"Responder com a mão correspondente à direção de uma seta, ignorando a palavra escrita em conflito (efeito Stroop espacial).","cognitivo":["Controlo inibitório","Atenção seletiva","Velocidade de processamento"],"duracao":"10 min","nivel":"Exigente","posicao":"Sentado","materiais":"20 cartões: setas ← → com as palavras \"DIREITA\" ou \"ESQUERDA\" (congruentes e incongruentes)","passos":["Fase 1: só setas — bater na mesa com a mão do lado indicado pela seta.","Fase 2: só palavras — responder à palavra.","Fase 3: cartões mistos — responder à SETA, ignorando a palavra.","Registar o tempo total e os erros em cada fase.","Repetir a fase 3 respondendo à PALAVRA."],"facilitar":"Apenas cartões congruentes e mais tempo por cartão.","dificultar":"Acrescentar setas para cima/baixo (levantar/baixar as mãos).","dica":"Comparar o tempo da fase 3 com o da fase 1 dá uma medida simples de interferência."},{"nome":"A Mão Esquecida","objetivo":"Realizar tarefas do dia a dia com a mão não dominante, estimulando a plasticidade e a atenção.","cognitivo":["Atenção sustentada","Planeamento motor","Resolução de problemas"],"duracao":"15 min","nivel":"Moderado","posicao":"Sentado","materiais":"Colher e feijões; moedas; caneta e papel; garrafa com tampa de rosca","passos":["Identificar a mão dominante (perguntar com que mão escreve, corta o pão…).","Transferir 10 feijões de uma taça para outra com a colher, na mão não dominante.","Empilhar 5 moedas.","Escrever o próprio nome.","Abrir e fechar a garrafa. Conversar sobre a experiência."],"facilitar":"Objetos maiores; permitir apoio da mão dominante.","dificultar":"Cronometrar e repetir semanalmente para comparar.","dica":"Após AVC, adapte ao lado afetado com objetivos realistas e muito reforço positivo."},{"nome":"Indicações de Caminho","objetivo":"Seguir instruções de direção num mapa em grelha e depois produzir instruções para outra pessoa.","cognitivo":["Orientação espacial","Memória de trabalho","Linguagem expressiva"],"duracao":"12 min","nivel":"Moderado","posicao":"Sentado","materiais":"Mapa em grelha de uma vila (igreja, mercado, farmácia, café); peão","passos":["Colocar o peão na \"casa\" e orientá-lo para cima.","Ditar: \"Siga em frente 2 quarteirões, vire à direita, siga 1 quarteirão.\"","Pedir que diga onde chegou.","Ditar o percurso todo antes de a pessoa mover o peão.","Inverter: a pessoa dá indicações para o terapeuta chegar à farmácia."],"facilitar":"Instruções uma a uma, com o peão sempre virado para cima.","dificultar":"Rodar o mapa 180.º antes de começar.","dica":"Use nomes de locais reais da localidade da pessoa para aumentar o significado."}]},{"slug":"nocao-do-corpo","vol":4,"titulo":"Noção do Corpo","subtitulo":"Conhecer, sentir e representar o próprio corpo","cor":"#BE185D","corClara":"#FCE7F3","definicao":"A noção do corpo (somatognosia) é a representação mental que cada pessoa tem do seu corpo: as partes que o compõem, a sua localização, a sua forma e as suas possibilidades de movimento. É a base da imitação, do gesto intencional e da autoimagem.","envelhecimento":"As mudanças físicas, a dor crónica, a menor mobilidade e algumas demências alteram a perceção e a representação do corpo. Uma imagem corporal empobrecida associa-se a insegurança no movimento e a menor autoestima.","sinais":["Dificuldade em nomear ou apontar partes do corpo","Erros ao imitar posturas simples","Desenho da figura humana muito empobrecido","Desvalorização do próprio corpo (\"já não sirvo para nada\")"],"cognicao":"Representar o corpo envolve linguagem (nomear), gnosias táteis (reconhecer pelo toque), memória visual (recordar posturas) e funções executivas (planear gestos). As atividades deste volume trabalham estas funções num registo afetivo e positivo.","objetivos":["Reforçar a nomeação e localização das partes do corpo","Estimular a perceção tátil e a imitação de posturas","Promover uma imagem corporal positiva","Treinar a memória visual e a linguagem através do corpo"],"pdf":"materiais/ebooks/pdf/Vol4-nocao-do-corpo.pdf","atividades":[{"nome":"Toque e Nomeie","objetivo":"Identificar, de olhos fechados, a parte do corpo tocada e reproduzir sequências de toques.","cognitivo":["Gnosia tátil","Nomeação","Memória sequencial"],"duracao":"8 min","nivel":"Fácil","posicao":"Sentado","materiais":"Pincel macio ou dedo; venda opcional","passos":["Pedir autorização para tocar e explicar a atividade.","De olhos fechados, tocar uma parte do corpo (ombro, joelho, mão) e pedir que a nomeie.","Tocar dois pontos em sequência; a pessoa aponta-os pela mesma ordem.","Aumentar para três toques.","Inverter: a pessoa toca no terapeuta e este nomeia."],"facilitar":"Olhos abertos e partes grandes do corpo.","dificultar":"Partes menos comuns (cotovelo, tornozelo, nuca) e quatro toques.","dica":"Respeite sempre o conforto da pessoa com o toque; ofereça a alternativa de ser ela a tocar-se."},{"nome":"Puzzle do Corpo","objetivo":"Montar uma figura humana recortada e, depois, desenhar o próprio corpo.","cognitivo":["Organização visuo-espacial","Planeamento","Representação mental"],"duracao":"15 min","nivel":"Fácil","posicao":"Sentado","materiais":"Figura humana em cartão recortada em 8–12 peças; folhas e lápis de cor","passos":["Apresentar as peças misturadas e nomeá-las em conjunto.","Montar a figura sem modelo.","Verificar: falta alguma parte? Está tudo no sítio?","Desenhar-se a si próprio numa folha.","Conversar sobre o desenho: o que gosta mais no seu corpo? O que ele ainda faz bem?"],"facilitar":"Menos peças e um modelo de referência.","dificultar":"Peças mais pequenas (dedos, orelhas) e figura de perfil.","dica":"Guarde os desenhos datados — a comparação ao longo do tempo é valiosa."},{"nome":"O Mestre Manda","objetivo":"Executar movimentos que envolvem partes do corpo apenas quando a ordem é precedida de \"O mestre manda\".","cognitivo":["Controlo inibitório","Atenção auditiva","Compreensão verbal"],"duracao":"10 min","nivel":"Moderado","posicao":"Sentado","materiais":"Nenhum","passos":["Explicar a regra e treinar duas ordens.","\"O mestre manda tocar no nariz\" → executar.","\"Tocar na orelha\" (sem o mestre manda) → não executar.","Alternar ordens de forma imprevisível, aumentando o ritmo.","Passar o papel de mestre a um participante."],"facilitar":"Ritmo lento e pistas visuais.","dificultar":"Ordens duplas (\"O mestre manda tocar no nariz com a mão esquerda\").","dica":"Em grupo, ninguém é eliminado — conta-se apenas a pontuação do grupo."},{"nome":"O Corpo nas Expressões","objetivo":"Completar e representar com mímica expressões populares portuguesas que envolvem partes do corpo.","cognitivo":["Linguagem figurada","Memória semântica","Abstração"],"duracao":"12 min","nivel":"Moderado","posicao":"Sentado","materiais":"Cartões com expressões incompletas","passos":["Ler: \"Dar uma …\" (mão); \"Custar os olhos da …\" (cara); \"Ter o coração ao pé da …\" (boca).","A pessoa completa a expressão e aponta a parte do corpo.","Explicar o significado da expressão.","Representar a expressão com mímica para o grupo adivinhar.","Pedir outras expressões que conheça."],"facilitar":"Dar duas opções de resposta.","dificultar":"Pedir uma situação de vida em que a expressão se aplique.","dica":"Outras expressões: \"meter o nariz\", \"não ter papas na língua\", \"estar com a pulga atrás da orelha\", \"dar o braço a torcer\"."},{"nome":"Imitação de Posturas","objetivo":"Imitar posturas de braços e mãos e reproduzi-las depois de memória.","cognitivo":["Memória visual","Praxia ideomotora","Atenção"],"duracao":"10 min","nivel":"Moderado","posicao":"Sentado","materiais":"Série de 10 posturas (desenhos ou demonstração)","passos":["O terapeuta faz uma postura (ex.: mão direita no ombro esquerdo) e a pessoa imita.","Fazer 5 posturas simples.","Mostrar 2 posturas seguidas; a pessoa imita no fim.","Mostrar uma postura, esperar 10 segundos e pedir a reprodução.","Registar acertos por condição."],"facilitar":"Posturas só com um braço e lado a lado.","dificultar":"Posturas com as duas mãos e dedos (ex.: \"anel\" com polegar e indicador).","dica":"Inspira-se nas provas de imitação de gestos utilizadas na avaliação psicomotora."},{"nome":"Retrato Falado","objetivo":"Descrever verbalmente a postura de um colega para que outro a reproduza sem a ver.","cognitivo":["Linguagem expressiva","Perceção visual","Compreensão verbal"],"duracao":"12 min","nivel":"Exigente","posicao":"Misto","materiais":"Biombo ou cadeiras costas com costas; cartões de posturas","passos":["Formar trios: modelo, descritor e executor.","O modelo assume a postura de um cartão.","O descritor explica ao executor como se posicionar (\"braço direito levantado, mão aberta…\").","Comparar o resultado com o modelo.","Rodar os papéis."],"facilitar":"Posturas simples com um só segmento.","dificultar":"O executor não pode fazer perguntas.","dica":"Atividade de grupo muito rica para a comunicação e a cooperação."}]},{"slug":"estruturacao-espacio-temporal","vol":5,"titulo":"Estruturação Espácio-Temporal","subtitulo":"Situar-se no espaço, organizar o tempo","cor":"#1D4ED8","corClara":"#DBEAFE","definicao":"A estruturação espácio-temporal é a capacidade de organizar e relacionar objetos e acontecimentos no espaço (perto, longe, entre, à frente) e no tempo (antes, depois, ritmo, duração). Sustenta a orientação, a memória e a organização da vida diária.","envelhecimento":"A desorientação temporal (dia, mês, estação) e a dificuldade em memorizar percursos são frequentemente sinais precoces de declínio cognitivo. Manter rotinas e referências é essencial para a autonomia.","sinais":["Dúvidas sobre o dia da semana ou a estação do ano","Perder-se em percursos conhecidos","Dificuldade em reproduzir ritmos simples","Confusão na ordem de acontecimentos recentes"],"cognicao":"Este fator está intimamente ligado à memória episódica, à orientação, às funções executivas (planear, sequenciar) e à perceção auditiva (ritmo). É o fator com mais pontes diretas para a estimulação cognitiva clássica.","objetivos":["Reforçar a orientação temporal e espacial","Treinar a reprodução e simbolização de ritmos","Sequenciar acontecimentos e rotinas","Memorizar e representar percursos"],"pdf":"materiais/ebooks/pdf/Vol5-estruturacao-espacio-temporal.pdf","atividades":[{"nome":"Ritmos com Palmas","objetivo":"Reproduzir estruturas rítmicas ouvidas e representá-las com símbolos gráficos.","cognitivo":["Memória auditiva","Atenção","Simbolização"],"duracao":"10 min","nivel":"Moderado","posicao":"Sentado","materiais":"Mesa; cartões com pontos e espaços (ex.: ●● ● = 2 batidas, pausa, 1 batida)","passos":["O terapeuta bate um ritmo na mesa (ex.: 2 batidas, pausa, 1 batida).","A pessoa reproduz.","Aumentar a complexidade até 6–7 batidas.","Mostrar o cartão correspondente e explicar a escrita do ritmo.","Inverter: a pessoa lê um cartão e bate o ritmo."],"facilitar":"Ritmos de 2–3 batidas e com batidas fortes/fracas bem marcadas.","dificultar":"Pedir que escolha, entre 3 cartões, o que corresponde ao ritmo ouvido.","dica":"Inspirado nas provas de estruturação rítmica da observação psicomotora."},{"nome":"Linha do Tempo da Minha Vida","objetivo":"Ordenar cronologicamente acontecimentos marcantes da própria vida, promovendo a reminiscência.","cognitivo":["Memória autobiográfica","Sequenciação temporal","Linguagem narrativa"],"duracao":"20 min","nivel":"Fácil","posicao":"Sentado","materiais":"Cordel e molas; cartões com etapas (nascimento, escola, casamento, filhos, reforma…); fotografias pessoais (opcional)","passos":["Esticar o cordel na mesa: início = nascimento, fim = hoje.","Escrever com a pessoa os acontecimentos marcantes em cartões.","Ordenar os cartões no cordel.","Estimar o ano ou a idade em cada acontecimento.","Escolher um acontecimento e contar a história."],"facilitar":"Usar fotografias pessoais e apenas 4–5 acontecimentos.","dificultar":"Cruzar com acontecimentos históricos (25 de Abril, entrada na CEE, Expo 98).","dica":"Em contexto de luto, aborde com sensibilidade; deixe a pessoa escolher os temas."},{"nome":"Pôr a Mesa","objetivo":"Colocar objetos segundo noções espaciais (à frente, atrás, entre, à direita) numa tarefa funcional.","cognitivo":["Compreensão de conceitos espaciais","Memória de trabalho","Planeamento"],"duracao":"10 min","nivel":"Fácil","posicao":"Sentado","materiais":"Prato, copo, garfo, faca, colher, guardanapo (de plástico)","passos":["Pedir: \"Ponha o garfo à esquerda do prato.\"","Instruções sucessivas: \"O copo à frente do prato, à direita.\"","Dar as 3 instruções seguidas e só depois executar.","Desarrumar e pedir que reponha a mesa de memória.","Conversar: como se punha a mesa em dias de festa?"],"facilitar":"Uma instrução de cada vez com demonstração.","dificultar":"Instruções com duas referências (\"entre o prato e o copo, mais perto do copo\").","dica":"Tarefa ecológica — transfere diretamente para as atividades de vida diária."},{"nome":"Calendário Vivo","objetivo":"Reforçar a orientação temporal através de um \"relógio\" de meses no chão e de perguntas sobre datas.","cognitivo":["Orientação temporal","Memória semântica","Raciocínio"],"duracao":"12 min","nivel":"Moderado","posicao":"Misto","materiais":"12 cartões com os meses dispostos em círculo no chão; cartões das 4 estações","passos":["Perguntar: em que dia, mês, estação e ano estamos?","Caminhar até ao mês atual no círculo.","\"Que mês vem a seguir? E dois meses antes?\" — deslocar-se até lá.","Colocar os cartões das estações junto dos meses correspondentes.","Associar festas: em que mês é o Natal? E os Santos Populares?"],"facilitar":"Fazer sentado, apontando para os cartões numa mesa.","dificultar":"Cálculos: \"Se faz anos daqui a 5 meses, em que mês é?\"","dica":"Comece cada sessão com orientação temporal — é uma âncora para todo o programa."},{"nome":"Percurso Memorizado","objetivo":"Observar um percurso entre cones, executá-lo de memória e representá-lo no papel.","cognitivo":["Memória visuo-espacial","Planeamento","Representação gráfica"],"duracao":"15 min","nivel":"Exigente","posicao":"Em pé","materiais":"5–6 cones numerados ou coloridos; folha com o esquema da sala","passos":["O terapeuta percorre um trajeto entre os cones (ex.: 1 → 4 → 2).","A pessoa repete o mesmo trajeto.","Aumentar para 4–5 cones.","Sentado, desenhar o trajeto no esquema da sala.","Variante: a pessoa cria um trajeto para o terapeuta memorizar."],"facilitar":"Trajetos curtos e cones de cores diferentes.","dificultar":"Introduzir uma pausa de 2 minutos com conversa antes de repetir.","dica":"Use cones baixos e espaço amplo; retire tapetes soltos."},{"nome":"O Meu Dia em Imagens","objetivo":"Ordenar imagens da rotina diária, estimar durações e associar horas no relógio.","cognitivo":["Sequenciação","Estimativa temporal","Leitura das horas"],"duracao":"12 min","nivel":"Fácil","posicao":"Sentado","materiais":"8 imagens de rotina (acordar, pequeno-almoço, passeio, almoço…); relógio de cartão com ponteiros","passos":["Ordenar as imagens do acordar ao deitar.","Para cada imagem, marcar a hora no relógio de cartão.","Estimar quanto tempo demora cada atividade.","Identificar a parte do dia preferida.","Planear em conjunto uma atividade nova para a semana."],"facilitar":"Apenas 4 imagens (manhã, almoço, tarde, noite).","dificultar":"Calcular intervalos: \"Quanto tempo passa entre o almoço e o lanche?\"","dica":"Pode transformar o resultado num horário visual para afixar em casa."}]},{"slug":"praxia-global","vol":6,"titulo":"Praxia Global","subtitulo":"Movimentos com intenção, corpo inteiro em ação","cor":"#15803D","corClara":"#DCFCE7","definicao":"A praxia global é a capacidade de realizar movimentos amplos, coordenados e intencionais com todo o corpo — andar, lançar, dançar, vestir. Integra todos os fatores anteriores ao serviço de um objetivo.","envelhecimento":"A redução da coordenação global, da velocidade e da fluidez do movimento afeta diretamente a autonomia nas atividades de vida diária. Manter a praxia global é manter a capacidade de \"fazer\".","sinais":["Movimentos lentos, rígidos ou descoordenados","Dificuldade em realizar duas ações ao mesmo tempo","Hesitação em gestos amplos (estender roupa, chegar a uma prateleira)","Dificuldade em aprender sequências novas de movimento"],"cognicao":"Planear e executar um movimento intencional mobiliza as funções executivas (planeamento, sequenciação), a memória procedimental e a atenção. As atividades deste volume juntam movimento global e tarefas cognitivas de forma lúdica e funcional.","objetivos":["Melhorar a coordenação global e a fluidez do movimento","Aprender e memorizar sequências motoras","Treinar movimentos funcionais do dia a dia","Estimular a interação social através do movimento"],"pdf":"materiais/ebooks/pdf/Vol6-praxia-global.pdf","atividades":[{"nome":"Adivinha a Profissão","objetivo":"Representar profissões através de movimentos amplos do corpo para os outros adivinharem.","cognitivo":["Memória semântica","Praxia ideatória","Raciocínio dedutivo"],"duracao":"12 min","nivel":"Fácil","posicao":"Misto","materiais":"Cartões com profissões tradicionais (pescador, padeiro, lavadeira, carpinteiro, maestro, varredor)","passos":["Cada participante tira um cartão em segredo.","Representa a profissão com o corpo inteiro, sem falar.","O grupo adivinha.","Quem acerta conta uma memória relacionada com essa profissão.","Variante: todos imitam juntos os gestos de cada profissão."],"facilitar":"Representar sentado, apenas com os braços.","dificultar":"Representar uma sequência de 3 ações da profissão por ordem.","dica":"Escolha profissões ligadas ao percurso de vida dos participantes."},{"nome":"Coreografia em Quatro Tempos","objetivo":"Aprender, memorizar e encadear uma sequência de movimentos ao ritmo da música.","cognitivo":["Memória procedimental","Sequenciação","Atenção auditiva"],"duracao":"15 min","nivel":"Moderado","posicao":"Misto","materiais":"Música de ritmo moderado (marcha popular, vira); espaço amplo","passos":["Ensinar o movimento 1 (ex.: marchar no lugar 4 tempos).","Acrescentar o movimento 2 (palmas 4 tempos) e encadear 1+2.","Acrescentar os movimentos 3 e 4 (braços ao alto, toque nos joelhos).","Executar a sequência completa com música.","Dar um nome à coreografia e repeti-la na sessão seguinte (memória diferida)."],"facilitar":"Toda a coreografia sentado e com 2 movimentos.","dificultar":"Movimentos diferentes de braços e pernas em simultâneo.","dica":"A repetição em sessões seguintes mede a retenção procedimental."},{"nome":"Lançar e Categorizar","objetivo":"Lançar saquinhos para cestos identificados por categorias, decidindo o alvo a cada palavra.","cognitivo":["Categorização","Tomada de decisão","Coordenação óculo-manual"],"duracao":"12 min","nivel":"Moderado","posicao":"Misto","materiais":"3 cestos com cartões (FRUTAS, ANIMAIS, OBJETOS); saquinhos de feijão","passos":["Colocar os cestos a 1,5–2 m.","O terapeuta diz uma palavra (ex.: \"laranja\").","A pessoa lança o saquinho para o cesto da categoria correta.","Contar os acertos de categoria e de pontaria separadamente.","Aumentar a distância ou trocar as categorias."],"facilitar":"Cestos grandes e próximos; duas categorias.","dificultar":"Categorias abstratas (coisas que se ouvem / que se cheiram / que se tocam).","dica":"Alterne a mão de lançamento para estimular ambos os lados."},{"nome":"A Bola dos Nomes","objetivo":"Passar uma bola em roda dizendo o nome de quem recebe e uma palavra encadeada.","cognitivo":["Memória de nomes","Fluência verbal","Atenção partilhada"],"duracao":"10 min","nivel":"Fácil","posicao":"Sentado","materiais":"Bola leve e macia (20–25 cm)","passos":["Grupo em roda. Cada pessoa diz o seu nome ao receber a bola.","Passar a bola dizendo o nome de quem vai receber.","Introduzir uma cadeia de palavras: quem recebe diz uma palavra começada pela última sílaba da anterior.","Variante: dizer uma palavra de uma categoria (cidades, flores).","No final, cada um tenta dizer o nome de todos."],"facilitar":"Rolar a bola pela mesa em vez de lançar.","dificultar":"Duas bolas em circulação ao mesmo tempo.","dica":"Ótima atividade de abertura para grupos novos."},{"nome":"Semáforo","objetivo":"Andar e parar em resposta a sinais visuais, com regras que mudam ao longo da atividade.","cognitivo":["Controlo inibitório","Flexibilidade cognitiva","Atenção visual"],"duracao":"10 min","nivel":"Moderado","posicao":"Em pé","materiais":"Cartões verde, amarelo e vermelho; percurso livre de obstáculos","passos":["Verde = andar; vermelho = parar; amarelo = andar devagar.","Treinar com o terapeuta a mostrar os cartões.","Inverter a regra: vermelho = andar, verde = parar.","Acrescentar sons: uma palma = rodar sobre si; duas palmas = mudar de direção.","Conversar sobre a segurança a atravessar a rua."],"facilitar":"Realizar sentado, com marcha no lugar.","dificultar":"Mostrar cartões e dar ordens verbais contraditórias.","dica":"Ligue a atividade à vida real: passadeiras, tempo dos semáforos, uso de bengala."},{"nome":"Ginástica da Lida da Casa","objetivo":"Executar movimentos funcionais de tarefas domésticas segundo sequências verbais.","cognitivo":["Memória de trabalho","Praxia ideatória","Planeamento"],"duracao":"12 min","nivel":"Fácil","posicao":"Misto","materiais":"Música de fundo; opcional: pano, mola, vassoura leve","passos":["Ensinar 5 gestos: estender a roupa, varrer, amassar o pão, limpar a janela, mexer a panela.","Executar cada gesto 8 vezes com música.","Ditar sequências: \"Varrer, depois amassar o pão, depois estender.\"","Aumentar a sequência até 4 gestos memorizados.","Perguntar que tarefas da casa ainda faz e quais gostaria de recuperar."],"facilitar":"Sequências de 2 gestos com demonstração.","dificultar":"Ordem inversa, ou cada participante acrescenta um gesto à sequência.","dica":"Use as respostas da última etapa para definir objetivos funcionais."}]},{"slug":"praxia-fina","vol":7,"titulo":"Praxia Fina","su function storageRead(key,fallback){
  try{const raw=localStorage.getItem(STORAGE_PREFIX+key);return raw==null?fallback:JSON.parse(raw);}
  catch(e){return fallback;}
}
function storageWrite(key,value){
  try{localStorage.setItem(STORAGE_PREFIX+key,JSON.stringify(value));return true;}
  catch(e){console.warn('Não foi possível guardar',key,e);return false;}
}
function usePersistentState(key,initial){
  const [value,setValue]=useState(()=>storageRead(key,typeof initial==='function'?initial():initial));
  useEffect(()=>{storageWrite(key,value);},[key,value]);
  return [value,setValue];
}

// Ponto de corte do MMSE ajustado à escolaridade (Guerreiro et al., 1994 — população portuguesa)
function mmseCutoff(education){
  if(education==null||education==='') return null;
  const e=+education;
  return e===0?15:e<=11?22:27;
}
// Interpretação de um valor: {label, level:'g'|'w'|'r'}
function interpretScale(k,v,patient){
  if(v==null||v==='') return {label:'',level:null};
  v=+v;
  const L=(label,level)=>({label,level});
  switch(k){
    case 'mmse':{
      const cut=mmseCutoff(patient&&patient.education);
      if(cut!=null) return v<=cut?L(`Défice (≤${cut} p/ escolaridade)`,'r'):v<=cut+2?L('Limiar p/ escolaridade','w'):L('Normal p/ escolaridade','g');
      return v>=27?L('Normal','g'):v>=24?L('DCL possível','w'):L('Défice','r');
    }
    case 'moca': return v>=26?L('Normal','g'):v>=18?L('Défice ligeiro','w'):L('Défice','r');
    case 'gds': return v<=5?L('Sem depressão','g'):v<=10?L('Depressão leve','w'):L('Depressão grave','r');
    case 'barthel': return v>=95?L('Independente','g'):v>=75?L('Dependência leve','w'):v>=50?L('Dependência moderada','r'):L('Dependência grave','r');
    case 'tug': return v<13.5?L('Sem risco acrescido','g'):v<20?L('Risco de queda','w'):L('Risco elevado de queda','r');
    case 'berg': return v>=46?L('Baixo risco de queda','g'):v>=41?L('Risco acrescido','w'):L('Risco elevado de queda','r');
    case 'tinetti': return v>=25?L('Baixo risco de queda','g'):v>=19?L('Risco moderado','w'):L('Risco elevado de queda','r');
    case 'sppb': return v>=10?L('Bom desempenho','g'):v>=7?L('Desempenho intermédio','w'):L('Baixo desempenho','r');
    case 'chair30': return v>=12?L('Adequado','g'):v>=8?L('Reduzido','w'):L('Muito reduzido','r');
    case 'zarit': return v<46?L('Sem sobrecarga','g'):v<=56?L('Sobrecarga ligeira','w'):L('Sobrecarga intensa','r');
    default: return L('','g');
  }
}
// Linhas de referência para os gráficos
function scaleCuts(k,patient){
  const c=(v,label)=>({v,label});
  switch(k){
    case 'mmse':{const cut=mmseCutoff(patient&&patient.education);return cut!=null?[c(cut,`Corte ≤${cut} (escolaridade)`)]:[c(27,'Normal ≥27'),c(24,'DCL 24')];}
    case 'moca': return [c(26,'Normal ≥26'),c(18,'18')];
    case 'gds': return [c(5,'Normal ≤5'),c(10,'Leve ≤10')];
    case 'barthel': return [c(95,'Indep. ≥95'),c(75,'Leve ≥75')];
    case 'tug': return [c(13.5,'Risco ≥13,5 s'),c(20,'≥20 s')];
    case 'berg': return [c(46,'Baixo risco ≥46'),c(41,'41')];
    case 'tinetti': return [c(25,'Baixo risco ≥25'),c(19,'19')];
    case 'sppb': return [c(10,'Bom ≥10'),c(7,'7')];
    case 'chair30': return [c(12,'Adequado ≥12'),c(8,'8')];
    case 'zarit': return [c(46,'Sobrecarga ≥46'),c(56,'Intensa >56')];
    default: return [];
  }
}

// Risco clínico global: cognição, humor, funcionalidade e risco de queda. Devolve também os motivos.
function riskDetail(p){
  const hi=[],md=[];
  const has=k=>p[k]!=null&&p[k]!=='';
  const lvl=k=>interpretScale(k,p[k],p).level;
  if(has('mmse')){if(+p.mmse<20)hi.push(`MMSE ${p.mmse}`);else if(lvl('mmse')!=='g')md.push(`MMSE ${p.mmse}`);}
  if(has('moca')&&!has('mmse')&&+p.moca<26)md.push(`MoCA ${p.moca}`);
  if(has('gds')){if(+p.gds>10)hi.push(`GDS ${p.gds}`);else if(+p.gds>5)md.push(`GDS ${p.gds}`);}
  if(has('barthel')){if(+p.barthel<70)hi.push(`Barthel ${p.barthel}`);else if(+p.barthel<90)md.push(`Barthel ${p.barthel}`);}
  if(has('tug')){if(+p.tug>=20)hi.push(`TUG ${fmtScale('tug',p.tug)}`);else if(+p.tug>=13.5)md.push(`TUG ${fmtScale('tug',p.tug)}`);}
  if(has('berg')){if(+p.berg<=40)hi.push(`Berg ${p.berg}`);else if(+p.berg<=45)md.push(`Berg ${p.berg}`);}
  if(has('tinetti')){if(+p.tinetti<19)hi.push(`Tinetti ${p.tinetti}`);else if(+p.tinetti<25)md.push(`Tinetti ${p.tinetti}`);}
  if(has('sppb')){if(+p.sppb<=6)hi.push(`SPPB ${p.sppb}`);else if(+p.sppb<=9)md.push(`SPPB ${p.sppb}`);}
  if(+p.falls12m>=2)hi.push(`${p.falls12m} quedas no último ano`);else if(+p.falls12m===1)md.push('1 queda no último ano');
  return {level:hi.length?'high':md.length?'medium':'low',reasons:hi.length?hi:md};
}
function computeRisk(p){return riskDetail(p).level;}
// Valores atuais do cliente = avaliação mais recente de cada escala
function currentScores(assessments,patientId){
  const val={},when={},wid={};
  assessments.filter(a=>a.patientId===patientId).forEach(a=>{
    if(!when[a.scale]||a.date>when[a.scale]||(a.date===when[a.scale]&&a.id>wid[a.scale])){when[a.scale]=a.date;wid[a.scale]=a.id;val[a.scale]=a.value;}
  });
  const res={lastAssessed:when};
  Object.keys(SCALES).forEach(k=>{res[k]=val[k]!=null?val[k]:null;});
  return res;
}

  });

const StoreContext=createContext(null);
const useStore=()=>useContext(StoreContext);

function StoreProvider({children}){
  const [patients,setPatients]=usePersistentState('patients',SEED.patients);
  const [sessions,setSessions]=usePersistentState('sessions',SEED.sessions);
  const [assessments,setAssessments]=usePersistentState('assessments',SEED.assessments);
  const [events,setEvents]=usePersistentState('events',SEED.events);
  const [posts,setPosts]=usePersistentState('posts',SEED.posts);
  const [profile,setProfile]=usePersistentState('profile',SEED.profile);
  const [prefs,setPrefs]=usePersistentState('prefs',SEED.prefs);
  const [groups,setGroups]=usePersistentState('groups',SEED.groups);
  const setters={patients:setPatients,sessions:setSessions,assessments:setAssessments,events:setEvents,posts:setPosts,profile:setProfile,prefs:setPrefs,groups:setGroups};

  const withRisk=p=>{const n={...p};n.risk=computeRisk(n);return n;};
  // Recalcula os valores atuais e o risco de um cliente a partir da lista de avaliações
  const syncScores=(patientId,list)=>setPatients(ps=>ps.map(p=>p.id===patientId?withRisk({...p,...currentScores(list,patientId)}):p));

  const addPatient=data=>{
    const id=nextId(patients);
    const t=todayISO();
    const created=withRisk({...data,id,initials:initialsOf(data.name),avatar:AVATAR_COLORS[id%AVATAR_COLORS.length],createdAt:t,status:'active',statusHistory:[{status:'active',date:t,note:'Abertura do processo'}]});
    setPatients(ps=>[...ps,created]);
    return created;
  };
  const updatePatient=(id,patch)=>{
    setPatients(ps=>ps.map(p=>{
      if(p.id!==id)return p;
      const n={...p,...patch};
      if(patch.name)n.initials=initialsOf(patch.name);
      if('dob' in patch)n.age=ageFromDob(patch.dob)??n.age;
      return withRisk(n);
    }));
  };
  const setPatientStatus=(id,status,{date,note,discharge}={})=>{
    const d=date||todayISO();
    setPatients(ps=>ps.map(p=>{
      if(p.id!==id)return p;
      const n={...p,status,statusDate:d,statusHistory:[...(p.statusHistory||[{status:'active',date:p.createdAt||d,note:'Abertura do processo'}]),{status,date:d,note:note||''}]};
      if(discharge!==undefined)n.discharge=discharge;
      return n;
    }));
  };
  const deletePatient=id=>{
    setPatients(ps=>ps.filter(p=>p.id!==id));
    setGroups(gs=>gs.map(g=>({...g,patientIds:g.patientIds.filter(x=>x!==id)})));
    setSessions(ss=>ss.filter(s=>s.patientId!==id));
    setAssessments(as=>as.filter(a=>a.patientId!==id));
    setEvents(es=>es.filter(e=>e.patientId!==id));
  };
  const addSession=s=>{
    const id=nextId(sessions);
    setSessions(ss=>[...ss,{...s,id}]);
    if(s.eventId)setEvents(es=>es.map(e=>e.id===s.eventId?{...e,done:sessionStatus(s),sessionId:id}:e));
    return id;
  };
  const updateSession=(id,patch)=>{
    setSessions(ss=>ss.map(x=>x.id===id?{...x,...patch}:x));
    if(patch.status)setEvents(es=>es.map(e=>e.sessionId===id?{...e,done:patch.status}:e));
  };
  const deleteSession=s=>{
    setSessions(ss=>ss.filter(x=>x.id!==s.id));
    setEvents(es=>es.map(e=>e.sessionId===s.id?{...e,done:undefined,sessionId:undefined}:e));
  };
  const addAssessments=(patientId,date,values,notes,details)=>{
    const entries=Object.entries(values).filter(([,v])=>v!=null);
    if(!entries.length) return [];
    let id=nextId(assessments);
    const created=entries.map(([scale,value])=>({id:id++,patientId,date,scale,value,notes,...(details&&details[scale]?details[scale]:{})}));
    const next=[...assessments,...created];
    setAssessments(next);syncScores(patientId,next);
    return created;
  };
  const updateAssessment=(id,patch)=>{
    const a=assessments.find(x=>x.id===id);if(!a)return;
    const next=assessments.map(x=>x.id===id?{...x,...patch}:x);
    setAssessments(next);syncScores(a.patientId,next);
  };
  const deleteAssessment=id=>{
    const a=assessments.find(x=>x.id===id);if(!a)return;
    const next=assessments.filter(x=>x.id!==id);
    setAssessments(next);syncScores(a.patientId,next);
  };
  // ─── Grupos ───
  const addGroup=g=>{const id=nextId(groups);setGroups(gs=>[...gs,{...g,id,createdAt:todayISO()}]);return id;};
  const updateGroup=(id,patch)=>setGroups(gs=>gs.map(g=>g.id===id?{...g,...patch}:g));
  const deleteGroup=id=>{setGroups(gs=>gs.filter(g=>g.id!==id));setEvents(es=>es.filter(e=>!(e.groupId===id&&!e.done)));};
  // Uma sessão de grupo cria uma sessão individual (realizada ou falta) para cada membro
  const addGroupSession=(group,{date,duration,theme,notes,attendance,eventId})=>{
    const gsid='g'+Date.now();
    let id=nextId(sessions);
    const list=Object.entries(attendance).map(([pid,a])=>({id:id++,patientId:+pid,date,groupId:group.id,groupSessionId:gsid,groupName:group.name,
      status:a.present?'done':'missed',reason:a.present?'':(a.reason||'Falta à sessão de grupo'),moduleId:group.type==='fisico'?7:1,duration:a.present?+duration||0:0,
      exercises:a.present?1:0,otherExercises:a.present?`Sessão de grupo: ${group.name}${theme?' — '+theme:''}`:'',performance:a.performance||'Bom',
      soap:{s:'',o:a.note||'',a:'',p:''},notes:notes||'',incidents:a.incident?[a.incident]:[],incidentNotes:a.incident?(a.note||''):''}));
    setSessions(ss=>[...ss,...list]);
    if(eventId)setEvents(es=>es.map(e=>e.id===eventId?{...e,done:'done',groupSessionId:gsid}:e));
    return gsid;
  };
  const addEvents=list=>{let id=Date.now();setEvents(es=>[...es,...list.map(e=>({...e,id:id++}))]);};
  const updateEvent=(id,patch)=>setEvents(es=>es.map(e=>e.id===id?{...e,...patch}:e));

  const exportData=()=>({app:'age-in-move',version:1,exportedAt:new Date().toISOString(),data:{patients,sessions,assessments,events,posts,profile,prefs,groups}});
  const importData=json=>{
    const d=json&&json.data;
    if(!d||json.app!=='age-in-move') throw new Error('Ficheiro não reconhecido como backup Age in Move.');
    ['patients','sessions','assessments','events','posts','groups'].forEach(k=>{if(d[k]!=null&&!Array.isArray(d[k]))throw new Error(`Campo "${k}" inválido.`);});
    STORE_KEYS.forEach(k=>{if(d[k]!=null)setters[k](d[k]);});
  };
  const resetDemo=()=>STORE_KEYS.forEach(k=>setters[k](SEED[k]()));
  const clearAll=()=>{['patients','sessions','assessments','events','groups'].forEach(k=>setters[k]([]));setPosts(SEED.posts());};

  const value={patients,sessions,assessments,events,posts,profile,prefs,
    setEvents,setPosts,setProfile,setPrefs,
    addPatient,updatePatient,setPatientStatus,deletePatient,addSession,updateSession,deleteSession,addAssessments,updateAssessment,deleteAssessment,addEvents,updateEvent,
    groups,addGroup,updateGroup,deleteGroup,addGroupSession,
    exportData,importData,resetDemo,clearAll};
  return <StoreContext.Provider value={value}>{children}</StoreContext.Provider>;
}

function downloadJSON(obj,filename){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

    'agachamento assistido':{s:'Apenas descida de 30° (mini-agachamento). Com apoio frontal.',c:'"Apanha das Azeitonas": agachar para apanhar "azeitonas" (bolas) do chão para cesto. Contexto cultural (colheita) é profundamente familiar à geração e motiva repetições.'},
    'preensão e força da mão':{s:'Apertar bola mole 5 vezes cada mão. Sem cronómetro.',c:'"Oleiro/Ceramista": amassar e modelar bola de barro ou massa de sal. Criar pequena forma — tartaruga, pão, coração. Produto levado para casa. Arte + força + identidade.'},
    'programa fitt completo':{s:'Apenas MMII: 3 exercícios x 8 repetições. 20 minutos total.',c:'"Treino da Equipa": com música de fundo motivadora (hinos desportivos). Cada série = "jogo" ganho. Contador visual de pontos. Terminar com "hino da vitória".'},
    'mobilização cervical':{s:'Apenas rotação E-D suave. Amplitude mínima (30°). 5 repetições.',c:'"Seguir o Pássaro": terapeuta move uma marioneta de pássaro no ar a diferentes alturas e direções. Cliente segue com olhos e cabeça. O estímulo visual torna o exercício fascinante.'},
    'mobilização do ombro':{s:'Apenas pêndulo de Codman (braço pendente com gravidade). 30 segundos.',c:'"Maestro de Orquestra": dirigir orquestra imaginária com ambos os braços ao ritmo de música clássica familiar. Elevação e rotação surgem naturalmente.'},
    'extensão torácica':{s:'Apenas sentar ereto e abrir o peito com uma respiração profunda. 5 vezes.',c:'"Aula de Yoga Real": usar nomes em sânscrito simplificados ("cobra suave", "montanha"). O contexto do yoga tem conotação de saúde e bem-estar que aumenta a adesão.'},
    'flexibilidade dos isquiotibiais':{s:'Deitado, elevar perna com apoio de faixa a apenas 30° de amplitude.',c:'"Dança do Ventre Sentada": inclinações do tronco para a frente com acompanhamento musical árabe lento. A estranheza cultural cria curiosidade e reduz foco na sensação de alongamento.'},
    'mobilidade do tornozelo':{s:'Sentado, apenas círculos do tornozelo. Sem resistência.',c:'"Pintor com os Pés": com caneta presa entre os dedos do pé, "pintar" letras do nome ou desenho simples no papel no chão. Destreza plantar incomum gera humor e foco.'},
    'mobilização lombar':{s:'Apenas báscula pélvica deitado. 10 repetições suaves.',c:'"Gato e Vaca de Yoga": em cadeira, alternar entre coluna arqueada (gato com dor) e coluna em extensão (vaca contente). Contexto animal gera riso e facilita o movimento.'},
    'sequência wake-up body':{s:'Apenas 5 movimentos: pescoço, ombros, pulsos, ancas, tornozelos. 5 rep cada.',c:'"Rádio Matinal do Corpo": criar rotina com música de manhã favorita. Cada canção = uma zona do corpo. A associação musical cria hábito autónomo. Prescrever para casa.'},
    'programa de marcha':{s:'5 minutos de marcha lenta em corredor. Com apoio disponível.',c:'"Rota das Memórias": criar percurso que passa por locais com significado (bancos onde costumava sentar, árvores especiais). Cada ponto = história. A narrativa transforma a marcha em expedição.'},
    'aeróbica em cadeira':{s:'Apenas elevação de joelhos alternada durante 5 minutos com música lenta.',c:'"Studio de Dança Vintage": coreografia sentada inspirada nos "Bailes do Recreio" dos anos 60-70. Reconhecimento musical + movimento = dupla ativação corticosubcortical.'},
    'cicloergómetro':{s:'Pedalagem livre sem resistência. 10 minutos. Foco na respiração.',c:'"Volta a Portugal Imaginária": mapa de Portugal no ecrã/parede. Cada 5 minutos = nova etapa (Porto → Coimbra → Lisboa). Cliente "visita" cidades que conhece.'},
    'dança terapêutica':{s:'Apenas movimento dos braços sentado ao ritmo de música. 10 minutos.',c:'"Rancho Folclórico": aprender 4 passos básicos de dança regional do local de origem do cliente. Identidade cultural máxima. Ensinar ao terapeuta — inversão de papel especialista.'},
    'treino intervalado':{s:'30s ativo (marcha no local) + 90s repouso. 5 ciclos apenas.',c:'"HIIT dos Anos 50": alternância de movimentos de danças da época (twist, valsa, marcha) com repouso. A nostalgia musical reduz a percepção de esforço em 20%.'},
    'lançamento e receção':{s:'Bola grande, 80cm de distância, lançamento bi-manual.',c:'"Bowling da Cognição": nomear categoria de palavra antes de cada lançamento. Acerto físico + resposta correta = ponto duplo. Dual task cognitivo-motora integrada.'},
    'dupla tarefa':{s:'Marcha lenta + contar em voz alta de 2 em 2.',c:'"Jornalista em Campo": marchar e descrever ao vivo tudo o que se passa em redor como locutor desportivo. O discurso espontâneo é mais ecológico que a contagem e tem maior transferência.'},
    'marcha com obstáculos':{s:'Apenas 2 obstáculos baixos. Percurso reto. Sem tempo.',c:'"Safari no Corredor": cada obstáculo é um "animal" (etiqueta com imagem). Ao passar, nomear animal e característica. Enriquecimento semântico do contexto motor.'},
    'coordenação rítmica bimanual':{s:'Apenas bater ambas as mãos em simultâneo ao ritmo de música lenta.',c:'"Percussão do Rancho": aprender padrão de percussão de música folclórica (ex: corridinho algarvio). Gravar vídeo para família. O produto social valoriza o esforço.'},
    'treino de reação':{s:'Apenas 1 tipo de estímulo (palma ao meu sinal). 10 tentativas.',c:'"Voleibol de Balão": tentar não deixar balão tocar o chão. A imprevisibilidade do balão é o estímulo de reação mais ecológico e motivador que existe.'},
    'tai chi simplificado':{s:'Apenas 2 formas: abrir e fechar as mãos lentamente com respiração.',c:'"Tai Chi ao Pôr do Sol": sessão junto à janela ao fim da tarde com música de meditação chinesa. O contexto sensorial (luz, som) amplifica o efeito de bem-estar e adesão.'},
  };
  const key=Object.keys(V).find(k=>n.includes(k));
  if(key) return V[key];
  // Fallback por tipo e dificuldade
  if(isFis){
    if(ex.difficulty==='Fácil') return {s:'Reduzir amplitude a 50%. Sentado com apoio bilateral. Tempo alargado.',c:'"Com Música Favorita": executar todo o exercício com playlist pessoal do cliente. Ritmo aumenta performance motora em 15-20% (evidência RCT).'};
    if(ex.difficulty==='Moderado') return {s:'Remover carga/resistência. Apoio unilateral disponível.',c:'"Circuito Social": em grupo de 3. Competição amistosa com pontos visíveis. A componente social aumenta adesão e tem efeito neuroprotetor adicional.'};
    return {s:'Versão adaptada: metade das repetições, amplitude reduzida, pausa dupla.',c:'"Desafio Funcional Real": integrar movimento numa tarefa de vida diária real (arrumar, cozinhar, jardinar). Máxima transferência ecológica.'};
  } else {
    if(ex.difficulty==='Fácil') return {s:'Reduzir estímulos a metade. Tempo alargado. Resposta oral em vez de escrita.',c:'"Com Arte": combinar tarefa cognitiva com desenho, plasticina ou colagem. Atividade artística reduz ansiedade e ativa memória procedimental em paralelo.'};
    if(ex.difficulty==='Moderado') return {s:'Versão com pistas visuais permanentes. Resposta escolha múltipla (3 opções).',c:'"Reminiscência Cultural": adaptar conteúdo à época de vida (anos 50-80). Música, imagens e vocabulário da era. Familiaridade aumenta desempenho 25-30%.'};
    return {s:'Versão simplificada: 1 critério apenas. Resposta binária (sim/não).',c:'"Role-Play Clínico": terapeuta assume papel de cliente. O cliente explica e ensina. Inversão de papel ativa lobo frontal e autoestima de forma diferente.'};
  }
}

// Gera o logótipo Age in Move — versão melhorada
function getAgeInMoveLogo(size=320){
  // Logótipo Age in Move — círculo azul-violeta, anel rosa-lilás e figura branca de braços no ar
  const c=document.createElement('canvas');
  c.width=c.height=size;
  const ctx=c.getContext('2d');
  const s=size, cx=s/2, cy=s/2;
  ctx.clearRect(0,0,s,s);

  // Disco principal (degradé azul → violeta)
  const gDisk=ctx.createLinearGradient(s*.12,s*.08,s*.88,s*.92);
  gDisk.addColorStop(0,'#3F6BE8');
  gDisk.addColorStop(.55,'#4B55E0');
  gDisk.addColorStop(1,'#6E45DA');
  ctx.beginPath();ctx.arc(cx,cy,s*.49,0,Math.PI*2);ctx.fillStyle=gDisk;ctx.fill();

  // Brilho suave no topo
  const gHL=ctx.createRadialGradient(cx-s*.12,cy-s*.18,0,cx-s*.12,cy-s*.18,s*.42);
  gHL.addColorStop(0,'rgba(255,255,255,.16)');
  gHL.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(cx,cy,s*.49,0,Math.PI*2);ctx.fillStyle=gHL;ctx.fill();

  // Anel rosa-lilás, aberto em cima à direita (onde passa o braço)
  const gRing=ctx.createLinearGradient(s*.15,s*.15,s*.85,s*.85);
  gRing.addColorStop(0,'#C7A2F2');
  gRing.addColorStop(.5,'#E58BD3');
  gRing.addColorStop(1,'#F3B0DC');
  const deg=d=>d*Math.PI/180;
  ctx.beginPath();ctx.arc(cx,cy,s*.405,deg(-38),deg(-82),false);
  ctx.strokeStyle=gRing;ctx.lineWidth=s*.042;ctx.lineCap='round';ctx.stroke();

  // Figura branca
  ctx.strokeStyle='#FFFFFF';ctx.fillStyle='#FFFFFF';
  ctx.lineWidth=s*.058;ctx.lineCap='round';ctx.lineJoin='round';
  const P=(x,y)=>[s*x,s*y];
  ctx.beginPath();ctx.arc(...P(.50,.355),s*.058,0,Math.PI*2);ctx.fill();          // cabeça
  ctx.beginPath();ctx.moveTo(...P(.50,.445));ctx.lineTo(...P(.50,.60));ctx.stroke(); // tronco
  ctx.beginPath();ctx.moveTo(...P(.49,.47));ctx.quadraticCurveTo(...P(.40,.43),...P(.37,.30));ctx.stroke(); // braço esquerdo
  ctx.beginPath();ctx.moveTo(...P(.51,.47));ctx.quadraticCurveTo(...P(.61,.42),...P(.665,.215));ctx.stroke(); // braço direito (sobe pela abertura)
  ctx.beginPath();ctx.moveTo(...P(.50,.60));ctx.lineTo(...P(.395,.755));ctx.stroke(); // perna esquerda
  ctx.beginPath();ctx.moveTo(...P(.50,.60));ctx.lineTo(...P(.605,.755));ctx.stroke(); // perna direita

  return c.toDataURL('image/png');
}

// Cache do logótipo (evita regenerar em cada chamada)
let _logoCache=null;
function getLogo(){
  if(!_logoCache) _logoCache=getAgeInMoveLogo(320);
  return _logoCache;
}

// Preview do logo na app (componente React)
function LogoPreview({size=60}){
  const ref=React.useRef(null);
  useEffect(()=>{
    if(!ref.current) return;
    const img=new Image();
    img.onload=()=>{
      const ctx=ref.current.getContext('2d');
      ctx.clearRect(0,0,size,size);
      ctx.drawImage(img,0,0,size,size);
    };
    img.src=getLogo();
  },[size]);
  return React.createElement('canvas',{ref,width:size,height:size,style:{display:'block'}});
}

// Converte caracteres especiais portugueses (Helvetica não suporta UTF-8)
// Texto para PDF: a fonte Helvetica do jsPDF suporta os acentos portugueses, o travessão e as aspas;
// troca apenas o que não existe nessa fonte (≥ ≤ ₂ setas, emojis)
const pt=s=>String(s??'')
  .replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/₂/g,'2').replace(/→/g,'->').replace(/←/g,'<-').replace(/×/g,'x')
  .replace(/[^\x00-\xFF—–“”‘’…€•]/g,'');

function makePDF(mod, singleEx){
  if(!window.jspdf){alert('A biblioteca PDF ainda esta a carregar. Aguarde e tente novamente.');return null;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF('p','mm','a4');
  const W=210,H=297,ML=14,MR=14,cw=W-ML-MR;
  const isFis=mod.type==='fisico';
  // Cores principais do módulo
  const C=isFis?[22,163,74]:[79,70,229];
  const CL=isFis?[240,253,244]:[237,233,254];
  const CT=[26,32,44]; // texto escuro
  const CG=[100,116,139]; // cinzento
  const CB=[226,232,240]; // borda
  let y=0;

  // Cores da marca AGE IN MOVE (sempre azul-violeta, independente do módulo)
  const BRAND=[52,72,197];     // azul Age in Move #3448C5
  const BRAND_L=[169,139,234]; // lilás #A98BEA
  const logo=getLogo();

  // ── Cabeçalho de cada página ──────────────────────────────────────────────
  const header=()=>{drawBrandHeader(doc,{W,ML,MR});y=17;};

  // ── Rodapé de cada página ─────────────────────────────────────────────────
  const footer=()=>drawBrandFooter(doc,{W,H,ML,MR});

  // ── Nova página ───────────────────────────────────────────────────────────
  const newPage=()=>{footer();doc.addPage();header();};

  // ── Verificar espaço ──────────────────────────────────────────────────────
  const checkY=(need)=>{if(y+need>H-14)newPage();};

  // ── Caixa colorida com label + texto ─────────────────────────────────────
  const drawBox=(x,bY,w,h,bg,border,labelColor,label,textColor,textLines)=>{
    doc.setFillColor(...bg);
    doc.setDrawColor(...border);
    doc.setLineWidth(0.4);
    doc.roundedRect(x,bY,w,h,1.5,1.5,'FD');
    if(label){
      doc.setTextColor(...labelColor);
      doc.setFontSize(6.5);
      doc.setFont('helvetica','bold');
      doc.text(pt(label),x+3.5,bY+4.5);
    }
    if(textLines){
      doc.setTextColor(...textColor);
      doc.setFontSize(8);
      doc.setFont('helvetica','normal');
      doc.text(textLines,x+3.5,bY+(label?8.5:5.5));
    }
  };

  const exs=singleEx?[singleEx]:[...(mod.exercises_list||[])].sort((a,b)=>{
    const o={Facil:0,Fácil:0,Moderado:1,Dificil:2,Difícil:2};
    return (o[a.difficulty]||0)-(o[b.difficulty]||0);
  });

  // ════════════════════════════════════════════════════════════
  // CAPA (apenas para módulo completo)
  // ════════════════════════════════════════════════════════════
  if(!singleEx){
    header();

    // ── Logo grande centrado ─────────────────────────────────
    try{ doc.addImage(logo,'PNG',W/2-16,y,32,32); }catch(e){}
    y+=42;

    // Nome da marca
    doc.setTextColor(...BRAND);
    doc.setFontSize(20);
    doc.setFont('helvetica','bold');
    doc.text('Age in Move',W/2,y,{align:'center'});
    doc.setFont('helvetica','italic');
    doc.setFontSize(10);
    doc.setTextColor(...CG);
    doc.text('idade em movimento',W/2,y+7,{align:'center'});
    y+=14;

    // Linha divisória com cor do módulo
    doc.setDrawColor(...C);
    doc.setLineWidth(1.5);
    doc.line(W/2-40,y,W/2+40,y);
    y+=8;

    // Tipo badge + Título do módulo
    doc.setFillColor(...C);
    doc.roundedRect(W/2-28,y,56,8,3,3,'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(8);
    doc.setFont('helvetica','bold');
    doc.text(isFis?'MÓDULO FÍSICO':'MÓDULO COGNITIVO',W/2,y+5.5,{align:'center'});
    y+=12;

    doc.setTextColor(...CT);
    doc.setFontSize(22);
    doc.setFont('helvetica','bold');
    const tLines=doc.splitTextToSize(pt(mod.name),cw-10);
    doc.text(tLines,W/2,y+8,{align:'center'});
    y+=tLines.length*10+8;

    // Stats em 4 caixas
    const statW2=(cw-9)/4;
    const statsData=[
      {v:String(exs.length),l:'Exercicios'},
      {v:mod.duration,l:'Sessao tipo'},
      {v:mod.difficulty,l:'Nivel base'},
      {v:'3',l:'Variacoes'},
    ];
    statsData.forEach((s,i)=>{
      const sx=ML+i*(statW2+3);
      doc.setFillColor(...CL);
      doc.setDrawColor(...C);
      doc.setLineWidth(0.4);
      doc.roundedRect(sx,y,statW2,16,2,2,'FD');
      doc.setTextColor(...C);
      doc.setFontSize(13);
      doc.setFont('helvetica','bold');
      doc.text(pt(s.v),sx+statW2/2,y+9.5,{align:'center'});
      doc.setTextColor(...CG);
      doc.setFontSize(6.5);
      doc.setFont('helvetica','normal');
      doc.text(s.l,sx+statW2/2,y+14,{align:'center'});
    });
    y+=22;

    // Descrição
    const dLines=doc.splitTextToSize(pt(mod.description),cw-8);
    const dH=dLines.length*4.5+10;
    drawBox(ML,y,cw,dH,[248,250,252],C,CG,'DESCRIÇÃO DO MÓDULO',CT,dLines);
    doc.setFillColor(...C);doc.rect(ML,y,1.5,dH,'F');
    y+=dH+5;

    // Instrução de uso
    const noteLines=doc.splitTextToSize(
      pt('Cada exercicio tem 3 versoes: SIMPLES (menor capacidade funcional), STANDARD (protocolo clinico base) e CRIATIVA (maximizar engagement e transferencia ecologica). Selecionar conforme o perfil do cliente. Registar versao utilizada.'),
      cw-8);
    const noteH=noteLines.length*4.5+10;
    drawBox(ML,y,cw,noteH,[255,250,235],[253,200,60],[150,90,10],'COMO USAR ESTE PROTOCOLO',[100,60,10],noteLines);
    y+=noteH+5;

    // Linha de crédito final da capa
    doc.setTextColor(...BRAND);
    doc.setFontSize(8.5);
    doc.setFont('helvetica','bold');
    doc.text('Age in Move',W/2,y+5,{align:'center'});
    doc.setFont('helvetica','italic');
    doc.setFontSize(8);
    doc.setTextColor(...CG);
    doc.text('idade em movimento  |  @age_in_move',W/2,y+11,{align:'center'});
    y+=16;
    footer();
  }

  // ════════════════════════════════════════════════════════════
  // EXERCÍCIOS
  // ════════════════════════════════════════════════════════════
  exs.forEach((ex,idx)=>{
    newPage();
    const v=getVariants(ex,mod);
    const diffBg=ex.difficulty==='Fácil'||ex.difficulty==='Facil'
      ?[220,252,231]:ex.difficulty==='Moderado'
      ?[254,249,195]:[254,226,226];
    const diffC=ex.difficulty==='Fácil'||ex.difficulty==='Facil'
      ?[21,128,61]:ex.difficulty==='Moderado'
      ?[133,77,14]:[153,27,27];

    // Número + nome
    doc.setFillColor(...C);
    doc.circle(ML+4.5,y+4.5,4.5,'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(8.5);
    doc.setFont('helvetica','bold');
    doc.text(String(singleEx?'':idx+1),ML+4.5,y+6.3,{align:'center'});
    doc.setTextColor(...CT);
    doc.setFontSize(13.5);
    doc.setFont('helvetica','bold');
    const exNameLines=doc.splitTextToSize(pt(ex.name),cw-20);
    doc.text(exNameLines,ML+12,y+6);
    // Badge dificuldade
    const badgeX=ML+12+doc.getTextWidth(pt(ex.name))+4;
    doc.setFillColor(...diffBg);
    doc.roundedRect(ML+12,y+8,20,5,2,2,'F');
    doc.setTextColor(...diffC);
    doc.setFontSize(6.5);
    doc.setFont('helvetica','bold');
    doc.text(pt(ex.difficulty),ML+22,y+11.7,{align:'center'});
    // Duração
    doc.setTextColor(...CG);
    doc.setFontSize(7.5);
    doc.setFont('helvetica','normal');
    doc.text(pt(ex.duration),ML+35,y+11.7);
    y+=exNameLines.length>1?16:13;

    // Grid objetivo | funções
    const half=(cw-4)/2;
    const objL=doc.splitTextToSize(pt(ex.objective),half-8);
    const cogL=doc.splitTextToSize(pt(ex.cognitive),half-8);
    const gridH=Math.max(objL.length*4.5+12,cogL.length*4.5+12);
    checkY(gridH+4);
    drawBox(ML,y,half,gridH,[248,250,252],CB,CG,
      isFis?'OBJETIVO':'OBJETIVO CLÍNICO',CT,objL);
    drawBox(ML+half+4,y,half,gridH,[248,250,252],CB,CG,
      isFis?'CAPACIDADES FÍSICAS':'FUNÇÕES COGNITIVAS',CT,cogL);
    y+=gridH+4;

    // Materiais
    const matL=doc.splitTextToSize(pt(ex.materials),cw-28);
    const matH=matL.length*4.5+9;
    checkY(matH+4);
    doc.setFillColor(250,250,250);
    doc.setDrawColor(...CB);
    doc.setLineWidth(0.3);
    doc.roundedRect(ML,y,cw,matH,1.5,1.5,'FD');
    doc.setTextColor(...CG);doc.setFontSize(6.5);doc.setFont('helvetica','bold');
    doc.text('MATERIAIS:',ML+3.5,y+5);
    doc.setTextColor(...CT);doc.setFontSize(8);doc.setFont('helvetica','normal');
    doc.text(matL,ML+24,y+5);
    y+=matH+4;

    // Instruções
    if(ex.instructions){
      const iL=doc.splitTextToSize(pt(ex.instructions),cw-8);
      const iH=iL.length*4.5+11;
      checkY(iH+4);
      drawBox(ML,y,cw,iH,[239,246,255],[147,197,253],[29,78,216],
        'INSTRUÇÕES DE APLICAÇÃO',[30,58,95],iL);
      doc.setFillColor(37,99,235);doc.rect(ML,y,1.5,iH,'F');
      y+=iH+4;
    }

    // Versão simples
    const sL=doc.splitTextToSize(pt(v.s),cw-8);
    const sH=sL.length*4.5+11;
    checkY(sH+4);
    drawBox(ML,y,cw,sH,[240,253,244],[134,239,172],[21,128,61],
      'VERSAO SIMPLES - para clientes com menor capacidade funcional',[20,83,45],sL);
    y+=sH+4;

    // Variante criativa
    const ccL=doc.splitTextToSize(pt(v.c),cw-8);
    const ccH=ccL.length*4.5+11;
    checkY(ccH+4);
    drawBox(ML,y,cw,ccH,CL,C,C,
      'VARIANTE CRIATIVA - maximizar engagement e transferencia ecologica',CT,ccL);
    y+=ccH+4;

    // Ficha de registo
    const recH=28;
    checkY(recH+4);
    doc.setFillColor(249,250,251);
    doc.setDrawColor(...CB);doc.setLineWidth(0.3);
    doc.roundedRect(ML,y,cw,recH,1.5,1.5,'FD');
    doc.setTextColor(...CG);doc.setFontSize(6.5);doc.setFont('helvetica','bold');
    doc.text('REGISTO DE SESSÃO',ML+3.5,y+5);
    doc.setTextColor(...CT);doc.setFontSize(8.5);doc.setFont('helvetica','normal');
    doc.text('Data: ____/____/________',ML+3.5,y+11);
    doc.text('Duração real: ______ min',ML+66,y+11);
    doc.text('Esforço (RPE): ___/10',ML+132,y+11);
    doc.text('Desempenho: [] Excelente  [] Bom  [] Razoável  [] Fraco',ML+3.5,y+17);
    doc.text('Versão usada: [] Standard  [] Simples  [] Criativa',ML+3.5,y+22.5);
    doc.setDrawColor(...CB);doc.setLineWidth(0.2);
    doc.line(ML+3.5,y+27,ML+cw-3.5,y+27);
    y+=recH+6;
  });

  // ════════════════════════════════════════════════════════════
  // PLANO DE PROGRESSÃO (apenas módulo completo)
  // ════════════════════════════════════════════════════════════
  if(!singleEx){
    newPage();
    doc.setTextColor(...CT);doc.setFontSize(14);doc.setFont('helvetica','bold');
    doc.text(pt('Plano de Progressão — 8 Semanas'),ML,y);
    doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(...CG);
    doc.text(pt(mod.name),ML,y+6);
    y+=13;
    // Tabela
    const cols=['Semana','Data Sessao','Exercicios realizados','Carga / Nivel','Desempenho','Notas'];
    const cws=[20,28,42,28,30,32];
    // Header
    doc.setFillColor(...C);doc.rect(ML,y,cw,8,'F');
    doc.setTextColor(255,255,255);doc.setFontSize(7.5);doc.setFont('helvetica','bold');
    let tx=ML;
    cols.forEach((c,i)=>{doc.text(pt(c),tx+2,y+5.5);tx+=cws[i];});
    y+=8;
    for(let w=1;w<=8;w++){
      if(w%2===0){doc.setFillColor(248,250,252);doc.rect(ML,y,cw,9,'F');}
      doc.setDrawColor(...CB);doc.setLineWidth(0.2);doc.rect(ML,y,cw,9);
      doc.setTextColor(...CT);doc.setFontSize(8);doc.setFont('helvetica','bold');
      doc.text('Sem. '+w,ML+2,y+6);
      doc.setFont('helvetica','normal');
      let tx2=ML+cws[0];
      doc.text('___/___/____',tx2+2,y+6);tx2+=cws[1];
      tx2+=cws[2];tx2+=cws[3];
      y+=9;
    }
    y+=10;
    // Referências
    const refs=isFis
      ?['WHO (2020). Physical activity guidelines for older adults.','ACSM (2022). Exercise prescription guidelines.','Sherrington et al. (2019). Fall prevention. Cochrane Review.','Mirelman et al. (2016). Lancet Neurology - Dual task training.','EWGSOP2 (2018). Sarcopaenia: revised European consensus.']
      :['Baddeley & Hitch (1974). Working memory model.','Petersen (2004). Mild cognitive impairment. J. Internal Medicine.','Rebok et al. (2014). ACTIVE Cognitive Training Trial. JAGS.','Woods et al. (2012). Cochrane Review - Cognitive stimulation.','Guerreiro et al. (1994). MMSE Portuguese normative data.'];
    checkY(refs.length*5+14);
    doc.setFontSize(9.5);doc.setFont('helvetica','bold');doc.setTextColor(...CT);
    doc.text('Referências Científicas',ML,y);y+=6;
    doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(...CG);
    refs.forEach(r=>{doc.text('- '+pt(r),ML,y);y+=5;});
    // Marca final com logo
    y+=8;
    try{ doc.addImage(logo,'PNG',W/2-5,y,10,10); }catch(e){}
    y+=15;
    doc.setFontSize(10);doc.setFont('helvetica','bold');doc.setTextColor(...BRAND);
    doc.text('Age in Move',W/2,y,{align:'center'});
    doc.setFont('helvetica','italic');doc.setFontSize(8.5);doc.setTextColor(...CG);
    doc.text('idade em movimento  |  @age_in_move',W/2,y+6,{align:'center'});
  }

  footer();
  return doc;
}

function exportModulePDF(mod){
  const doc=makePDF(mod,null);
  if(doc) doc.save(pt('ageinmove-'+mod.name).replace(/\s+/g,'-').toLowerCase()+'.pdf');
}

function exportExercisePDF(ex,mod){
  const doc=makePDF(mod,ex);
  if(doc) doc.save(pt('ageinmove-'+ex.name).replace(/\s+/g,'-').toLowerCase()+'.pdf');
}

const PLAN_FREQ={daily:'Todos os dias','5week':'5x por semana','3week':'3x por semana','2week':'2x por semana',weekly:'1x por semana'};
const PLAN_VERSION={standard:'Standard',simples:'Simples',criativa:'Criativa'};
function findExercise(exId){
  exId=+exId;
  for(const m of [...MODULES,...EBOOK_MODULES]){const ex=(m.exercises_list||[]).find(e=>e.id===exId);if(ex)return {ex,mod:m};}
  return null;
}
// Nomes das versões: nos ebooks, "simples" = mais fácil e "criativa" = mais exigente
const versionLabel=(item,ebook)=>ebook?({standard:'Standard',simples:'Mais fácil',criativa:'Mais exigente'})[item.version]||'Standard':PLAN_VERSION[item.version]||'Standard';
function planInstructions(item){
  const f=findExercise(item.exId); if(!f) return '';
  if(f.ex.ebook){
    const base=f.ex.instructions||'';
    if(item.version==='simples'&&f.ex.facilitar) return `Versão mais fácil: ${f.ex.facilitar} — ${base}`;
    if(item.version==='criativa'&&f.ex.dificultar) return `${base} Versão mais exigente: ${f.ex.dificultar}`;
    return base;
  }
  if(item.version==='simples'||item.version==='criativa'){
    const v=getVariants(f.ex,f.mod)||{};
    const t=item.version==='simples'?v.s:v.c;
    if(t) return t;
  }
  return f.ex.instructions||'';
}

function newBrandedDoc(){

  const {jsPDF}=window.jspdf;

function pdfKV(g,pairs){

function pdfTable(g,cols,rows,widths){

    let x=g.ML;cols.forEach((c,i)=>{doc.text(pt(c),x+2,g.y+4.8);x+=widths[i];});g.y+=rowH;};

// Gráfico de linha simples desenhado diretamente no PDF
function pdfScaleChart(g,scale,points,patient){
  const {doc}=g;const sc=SCALES[scale];const lo=sc.min||0;const hiV=Math.max(sc.chartMax||sc.max,...points.map(p=>+p.value));
  const h=38,x0=g.ML+10,x1=g.ML+g.cw-4,y0=g.y+4,y1=g.y+h-6;
  g.check(h+10);
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(26,32,44);
  const last=+points[points.length-1].value,first=+points[0].value;
  doc.text(pt(`${sc.name}: ${fmtScale(scale,last)} (${interpretScale(scale,last,patient).label})`),g.ML,g.y);
  if(points.length>1){const d=Math.round((last-first)*10)/10;const better=sc.inverse?d<0:d>0;doc.setFont('helvetica','normal');doc.setTextColor(...(d===0?PDF_GREY:better?[22,163,74]:[220,38,38]));
    doc.text(pt(`Variação desde ${fmtDate(points[0].date)}: ${d>0?'+':''}${String(d).replace('.',',')}`),g.ML+g.cw,g.y,{align:'right'});}
  g.y+=2;
  const Y=v=>y1-((v-lo)/(hiV-lo))*(y1-y0);
  const X=i=>points.length===1?(x0+x1)/2:x0+8+(i/(points.length-1))*(x1-x0-16);
  doc.setDrawColor(226,232,240);doc.setLineWidth(0.2);
  [lo,(lo+hiV)/2,hiV].forEach(t=>{doc.line(x0,Y(t),x1,Y(t));doc.setFontSize(6.5);doc.setTextColor(...PDF_GREY);doc.text(String(Math.round(t)),x0-2,Y(t)+1,{align:'right'});});
  scaleCuts(scale,patient).filter(c=>c.v>=lo&&c.v<=hiV).forEach(c=>{doc.setDrawColor(203,213,225);doc.setLineDashPattern([1.2,1.2],0);doc.line(x0,Y(c.v),x1,Y(c.v));doc.setLineDashPattern([],0);
    doc.setFontSize(6);doc.setTextColor(148,163,184);doc.text(pt(c.label),x1,Y(c.v)-1,{align:'right'});});
  doc.setDrawColor(67,97,238);doc.setLineWidth(0.7);
  for(let i=1;i<points.length;i++) doc.line(X(i-1),Y(points[i-1].value),X(i),Y(points[i].value));
  points.forEach((p,i)=>{doc.setFillColor(67,97,238);doc.circle(X(i),Y(p.value),1,'F');
    if(points.length<=10){doc.setFontSize(6.5);doc.setTextColor(26,32,44);doc.setFont('helvetica','bold');doc.text(String(p.value).replace('.',','),X(i),Y(p.value)-2,{align:'center'});}});
  doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(...PDF_GREY);
  const idx=points.length<=6?points.map((_,i)=>i):[0,Math.floor((points.length-1)/2),points.length-1];
  idx.forEach(i=>doc.text(fmtDate(points[i].date),X(i),y1+4.5,{align:'center'}));
  g.y+=h;
}

async function deliverPDF(doc,filename){

  try{
    const blob=doc.output('blob');
    const file=new File([blob],filename,{type:'application/pdf'});
    const touch=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;
    if(touch&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  doc.save(filename);
}
