            <tbody>
              {pAssess.map(a=>(
                <tr key={a.id}><td>{fmtDate(a.date)}</td><td style={{fontWeight:600}}>{SCALES[a.scale]?.name||a.scale}</td><td style={{fontWeight:700,color:'#FF6200'}}>{a.value}/{SCALES[a.scale]?.max}</td><td>{a.therapist||profile.name}</td><td style={{fontSize:13,color:'#64748b'}}>{a.notes||'—'}</td></tr>
              ))}
            </tbody>
          </table>)}
        </div>
        </div>
      )}
      {tab==='sessions'&&(
        <div className="card">
          <div className="card-header" style={{marginBottom:16}}><div className="card-title">Histórico de Sessões</div><button className="btn btn-sm btn-primary" onClick={()=>setModal('session')}>+ Nova Sessão</button></div>
          {pSessions.length===0?<p style={{fontSize:14,color:'#64748b'}}>Sem sessões registadas.</p>:(
          <table className="table">
            <thead><tr><th>Data</th><th>Módulo</th><th>Exercícios</th><th>Duração</th><th>Desempenho</th><th>Notas</th><th></th></tr></thead>
            <tbody>
              {pSessions.map(s=>{const m=MODULES.find(x=>x.id===+s.moduleId);return(
                <tr key={s.id}><td>{fmtDate(s.date)}</td><td>{m?`${m.icon} ${m.name}`:'—'}</td><td>{s.exercises} exercícios</td><td>{s.duration} min</td><td><span className={`badge badge-${s.performance==='Excelente'?'green':s.performance==='Bom'?'blue':s.performance==='Fraco'?'red':'yellow'}`}>{s.performance}</span></td><td style={{fontSize:13,color:'#64748b',maxWidth:220}}>{s.notes||'—'}</td>
                <td><button className="btn btn-sm btn-secondary" title="Eliminar sessão" onClick={()=>{if(confirm('Eliminar esta sessão?'))deleteSession(s);}}>🗑</button></td></tr>
              );})}
            </tbody>
          </table>)}
        </div>
      )}
      {modal==='session'&&<NewSessionModal patient={patient} onClose={()=>setModal(null)}/>}
      {modal==='assessment'&&<NewAssessmentModal patient={patient} onClose={()=>setModal(null)}/>}
    </div>
  );
}

function NewPatientPage({setPage,openPatient}){
  const {addPatient,addAssessments}=useStore();
  const [step,setStep]=useState(1);
  const [err,setErr]=useState('');
  const [form,setForm]=useState({name:'',dob:'',gender:'F',phone:'',email:'',address:'',caregiver:'',caregiverPhone:'',diagnosis:'',module:'1',referral:'',mmse:'',gds:'',barthel:'',moca:'',notes:'',goals:'',frequency:'weekly'});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const steps=[{n:1,label:'Dados Pessoais'},{n:2,label:'Clínico'},{n:3,label:'Avaliações'},{n:4,label:'Plano'}];
  const validate=st=>{
    if(st===1){
      if(!form.name.trim()) return 'Indique o nome completo.';
      if(!form.dob) return 'Indique a data de nascimento.';
      const a=ageFromDob(form.dob); if(a==null||a<0||a>120) return 'Data de nascimento inválida.';
    }
    if(st===2&&!form.diagnosis) return 'Selecione o diagnóstico principal.';
    if(st===3){
      for(const k of Object.keys(SCALES)){const n=numOrNull(form[k]);if(n!=null&&(n<0||n>SCALES[k].max))return `${SCALES[k].name}: valor entre 0 e ${SCALES[k].max}.`;}
    }
    return '';
  };
  const next=()=>{
    const e=validate(step); setErr(e); if(e) return;
    if(step<4){setStep(s=>s+1);return;}
    const scores={mmse:numOrNull(form.mmse),gds:numOrNull(form.gds),barthel:numOrNull(form.barthel),moca:numOrNull(form.moca)};
    const t=todayISO();
    const lastAssessed={};Object.entries(scores).forEach(([k,v])=>{if(v!=null)lastAssessed[k]=t;});
    const p=addPatient({name:form.name.trim(),dob:form.dob,age:ageFromDob(form.dob),gender:form.gender,phone:form.phone.trim(),email:form.email.trim(),address:form.address.trim(),
      caregiver:form.caregiver.trim(),caregiverPhone:form.caregiverPhone.trim(),diagnosis:form.diagnosis,module:+form.module,frequency:form.frequency,referral:form.referral.trim(),
      ...scores,lastAssessed,goals:form.goals.trim(),notes:form.notes.trim()});
    addAssessments(p.id,t,scores,'Avaliação inicial');
    openPatient(p.id);
  };
  return(
    <div className="page" style={{maxWidth:700,margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:24}}>
        <button className="btn btn-secondary btn-sm" onClick={()=>setPage('patients')}>← Voltar</button>
        <div><h2 style={{fontSize:20,fontWeight:800,color:'#0f172a'}}>Novo Paciente</h2><p style={{fontSize:13,color:'#64748b'}}>Passo {step} de {steps.length}</p></div>
      </div>
      <div style={{display:'flex',marginBottom:28}}>
        {steps.map((s,i)=>(
          <React.Fragment key={s.n}>
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',flex:1}}>
              <div style={{width:32,height:32,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:14,background:step>s.n?'#16a34a':step===s.n?'#FF6200':'#e2e8f0',color:step>=s.n?'#fff':'#64748b'}}>{step>s.n?'✓':s.n}</div>
              <div style={{fontSize:11,marginTop:4,fontWeight:step===s.n?700:400,color:step===s.n?'#0f172a':'#64748b'}}>{s.label}</div>
            </div>
            {i<steps.length-1&&<div style={{flex:1,height:2,background:step>s.n?'#16a34a':'#e2e8f0',marginTop:16,alignSelf:'flex-start'}}/>}
          </React.Fragment>
        ))}
      </div>
      <div className="card">
        {err&&<div className="alert alert-warning">{err}</div>}
        {step===1&&(
          <div>
            <div className="card-title" style={{marginBottom:16}}>Dados Pessoais</div>
            <div className="grid-2">
              <div className="form-group"><label>Nome Completo *</label><input value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Nome do paciente"/></div>
              <div className="form-group"><label>Data de Nascimento *</label><input type="date" value={form.dob} onChange={e=>set('dob',e.target.value)}/></div>
              <div className="form-group"><label>Género</label><select value={form.gender} onChange={e=>set('gender',e.target.value)}><option value="F">Feminino</option><option value="M">Masculino</option><option value="O">Outro</option></select></div>
              <div className="form-group"><label>Telefone</label><input value={form.phone} onChange={e=>set('phone',e.target.value)} placeholder="9XXXXXXXX"/></div>
              <div className="form-group"><label>Email</label><input type="email" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="email@exemplo.pt"/></div>
              <div className="form-group"><label>Morada</label><input value={form.address} onChange={e=>set('address',e.target.value)} placeholder="Rua, nº, cidade"/></div>
            </div>
            <div className="card-title" style={{margin:'16px 0 12px',fontSize:14}}>Cuidador Principal</div>
            <div className="grid-2">
              <div className="form-group"><label>Nome e parentesco</label><input value={form.caregiver} onChange={e=>set('caregiver',e.target.value)} placeholder="Ex: Ana Silva (filha)"/></div>
              <div className="form-group"><label>Contacto Cuidador</label><input value={form.caregiverPhone} onChange={e=>set('caregiverPhone',e.target.value)} placeholder="9XXXXXXXX"/></div>
            </div>
          </div>
        )}
        {step===2&&(
          <div>
            <div className="card-title" style={{marginBottom:16}}>Informação Clínica</div>
            <div className="form-group"><label>Diagnóstico Principal *</label>
              <select value={form.diagnosis} onChange={e=>set('diagnosis',e.target.value)}>
                <option value="">Selecionar diagnóstico...</option>
                {['DCL - Défice Cognitivo Ligeiro','Doença de Alzheimer leve','Doença de Alzheimer moderada','DCM - Défice Cognitivo Moderado','Depressão Geriátrica','Envelhecimento Normal','Demência Vascular','Demência de Corpos de Lewy','Outro'].map(d=><option key={d}>{d}</option>)}
              </select>
            </div>
            <div className="grid-2">
              <div className="form-group"><label>Módulo de Reabilitação</label>
                <select value={form.module} onChange={e=>set('module',e.target.value)}>{MODULES.map(m=><option key={m.id} value={m.id}>{m.icon} {m.name}</option>)}</select>
              </div>
              <div className="form-group"><label>Frequência</label>
                <select value={form.frequency} onChange={e=>set('frequency',e.target.value)}><option value="daily">Diária</option><option value="3week">3x semana</option><option value="weekly">Semanal</option><option value="biweekly">Quinzenal</option></select>
              </div>
            </div>
            <div className="form-group"><label>Médico / Entidade Referenciadora</label><input value={form.referral} onChange={e=>set('referral',e.target.value)} placeholder="Dr. Nome / Hospital"/></div>
          </div>
        )}
        {step===3&&(
          <div>
            <div className="card-title" style={{marginBottom:4}}>Avaliações Neuropsicológicas</div>
            <p style={{fontSize:13,color:'#64748b',marginBottom:16}}>Preencha os resultados das escalas disponíveis.</p>
            {[{key:'mmse',label:'MMSE — Mini Mental State Exam',max:30,desc:'≥27 normal · 24-26 DCL possível · <24 défice'},{key:'gds',label:'GDS-15 — Escala de Depressão Geriátrica',max:15,desc:'0-5 normal · 6-10 dep. leve · 11-15 dep. grave'},{key:'barthel',label:'Índice de Barthel — AVDs',max:100,desc:'100 independente · 75-95 dep. leve · <75 dep. moderada'},{key:'moca',label:'MoCA — Montreal Cognitive Assessment',max:30,desc:'≥26 normal · <26 défice cognitivo'}].map(s=>(
              <div key={s.key} className="card" style={{marginBottom:12,background:'#f8fafc',boxShadow:'none',border:'1px solid #e2e8f0'}}>
                <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:8}}>
                  <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{s.label}</div><div style={{fontSize:12,color:'#64748b'}}>{s.desc}</div></div>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    <input type="number" min={0} max={s.max} value={form[s.key]} onChange={e=>set(s.key,e.target.value)} style={{width:70,textAlign:'center',fontWeight:700,fontSize:16}} placeholder="—"/>
                    <span style={{fontSize:13,color:'#94a3b8'}}>/{s.max}</span>
                  </div>
                </div>
                {form[s.key]&&<div className="progress-bar"><div className="progress-fill" style={{width:`${(+form[s.key]/s.max)*100}%`,background:s.key==='gds'?(+form[s.key]<=5?'#16a34a':+form[s.key]<=10?'#d97706':'#dc2626'):(+form[s.key]/(s.max)*100>=90?'#16a34a':+form[s.key]/(s.max)*100>=80?'#d97706':'#dc2626')}}/></div>}
              </div>
            ))}
          </div>
        )}
        {step===4&&(
          <div>
            <div className="card-title" style={{marginBottom:16}}>Plano Terapêutico</div>
            <div className="form-group"><label>Objetivos Terapêuticos</label><textarea rows={4} value={form.goals} onChange={e=>set('goals',e.target.value)} placeholder="Descreva os objetivos a alcançar..."/></div>
            <div className="form-group"><label>Notas Clínicas Iniciais</label><textarea rows={4} value={form.notes} onChange={e=>set('notes',e.target.value)} placeholder="Observações iniciais, contexto familiar..."/></div>
            <div className="alert alert-info" style={{marginTop:8}}><strong>Resumo:</strong> {form.name||'(sem nome)'} · {form.diagnosis||'(sem diagnóstico)'} · {MODULES.find(m=>m.id==form.module)?.name}{form.mmse&&` · MMSE: ${form.mmse}/30`}{form.gds&&` · GDS: ${form.gds}/15`}</div>
          </div>
        )}
        <div style={{display:'flex',justifyContent:'space-between',marginTop:24}}>
          <button className="btn btn-secondary" onClick={()=>{setErr('');step>1?setStep(s=>s-1):setPage('patients');}}>{step===1?'Cancelar':'← Anterior'}</button>
          <button className="btn btn-primary" onClick={next}>{step===4?'✓ Criar Paciente':'Seguinte →'}</button>
        </div>
      </div>
    </div>
  );
}

function CalendarPage(){
  const {events,setEvents,patients}=useStore();
  const NOW=new Date();
  const [cur,setCur]=useState({y:NOW.getFullYear(),m:NOW.getMonth()});
  const [showModal,setShowModal]=useState(false);
  const [selDate,setSelDate]=useState('');
  const [newEv,setNewEv]=useState({title:'',type:'session',patientId:'',time:''});
  const [selEvent,setSelEvent]=useState(null);
  const [evErr,setEvErr]=useState('');
  const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
  const firstDow=(y,m)=>(new Date(y,m,1).getDay()+6)%7;
  const totalDays=daysInMonth(cur.y,cur.m);
  const offset=firstDow(cur.y,cur.m);
  const prevDays=daysInMonth(cur.y,cur.m-1);
  const monthName=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][cur.m];
  const cells=[];
  for(let i=0;i<offset;i++) cells.push({day:prevDays-offset+1+i,cur:false});
  for(let d=1;d<=totalDays;d++) cells.push({day:d,cur:true});
  while(cells.length%7!==0) cells.push({day:cells.length-offset-totalDays+1,cur:false});
  const eventsOnDay=d=>events.filter(e=>{const[ey,em,ed]=e.date.split('-').map(Number);return ey===cur.y&&em-1===cur.m&&ed===d;});
  const typeColors={session:'#eff6ff',meeting:'#f0fdf4',training:'#fffbeb'};
  const typeText={session:'#1d4ed8',meeting:'#15803d',training:'#b45309'};
  const addEvent=()=>{
    const pat=newEv.type==='session'&&newEv.patientId?patients.find(p=>p.id===+newEv.patientId):null;
    const title=newEv.title.trim()||(pat?`${pat.name.split(' ')[0]} ${pat.name.split(' ').slice(-1)[0]} - Sessão`:'');
    if(!selDate){setEvErr('Escolha a data.');return;}
    if(!title){setEvErr('Indique um título ou selecione um paciente.');return;}
    const ev={id:Date.now(),date:selDate,title,type:newEv.type,color:typeText[newEv.type]||'#2563eb'};
    if(newEv.time) ev.time=newEv.time;
    if(pat) ev.patientId=pat.id;
    setEvents(es=>[...es,ev]);
    setShowModal(false);setEvErr('');setNewEv({title:'',type:'session',patientId:'',time:''});
  };
  return(
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div><h2 style={{fontSize:22,fontWeight:800,color:'#0f172a'}}>Calendário Clínico</h2><p style={{color:'#64748b',fontSize:14}}>{monthName} {cur.y}</p></div>
        <div style={{display:'flex',gap:10}}>
          <button className="btn btn-secondary btn-sm" onClick={()=>setCur(c=>{const m=c.m===0?11:c.m-1,y=c.m===0?c.y-1:c.y;return{y,m};})}>← Anterior</button>
          <button className="btn btn-secondary btn-sm" onClick={()=>setCur({y:NOW.getFullYear(),m:NOW.getMonth()})}>Hoje</button>
          <button className="btn btn-secondary btn-sm" onClick={()=>setCur(c=>{const m=c.m===11?0:c.m+1,y=c.m===11?c.y+1:c.y;return{y,m};})}>Seguinte →</button>
          <button className="btn btn-primary btn-sm" onClick={()=>{const sameMonth=cur.y===NOW.getFullYear()&&cur.m===NOW.getMonth();setSelDate(sameMonth?todayISO():`${cur.y}-${String(cur.m+1).padStart(2,'0')}-01`);setShowModal(true);}}>+ Evento</button>
        </div>
      </div>
      <div className="card">
        <div className="cal-header">{['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=><div key={d} className="cal-dow">{d}</div>)}</div>
        <div className="cal-grid">
          {cells.map((c,i)=>{
            const evs=c.cur?eventsOnDay(c.day):[];
            const isToday=c.cur&&cur.y===NOW.getFullYear()&&cur.m===NOW.getMonth()&&c.day===NOW.getDate();
            return(
              <div key={i} className={`cal-day${isToday?' today':''}${!c.cur?' other-month':''}`}
                onClick={()=>{if(c.cur){setSelDate(`${cur.y}-${String(cur.m+1).padStart(2,'0')}-${String(c.day).padStart(2,'0')}`);setShowModal(true);}}}>
                <div className="day-num" style={{color:isToday?'#FF6200':'#475569',fontWeight:isToday?800:700}}>{c.day}</div>
                {evs.map(e=><div key={e.id} className="cal-event" title={e.title} onClick={ev=>{ev.stopPropagation();setSelEvent(e);}} style={{cursor:'pointer',background:typeColors[e.type]||'#f1f5f9',color:typeText[e.type]||'#475569'}}>{e.time?`${e.time} `:''}{e.title}</div>)}
              </div>
            );
          })}
        </div>
      </div>
      <div style={{display:'flex',gap:16,marginTop:8}}>
        {[['session','Sessão','#eff6ff','#1d4ed8'],['meeting','Reunião','#f0fdf4','#15803d'],['training','Formação','#fffbeb','#b45309']].map(([t,l,bg,col])=>(
          <div key={t} style={{display:'flex',alignItems:'center',gap:6,fontSize:13}}><div style={{width:12,height:12,borderRadius:3,background:bg,border:`1px solid ${col}`}}/><span style={{color:'#64748b'}}>{l}</span></div>
        ))}
      </div>
      {showModal&&(
        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setShowModal(false);}}>
          <div className="modal">
            <div className="modal-header"><div className="modal-title">Novo Evento</div><button className="close-btn" onClick={()=>setShowModal(false)}>×</button></div>
            {evErr&&<div className="alert alert-warning">{evErr}</div>}
            <div className="grid-2">
              <div className="form-group"><label>Data *</label><input type="date" value={selDate} onChange={e=>setSelDate(e.target.value)}/></div>
              <div className="form-group"><label>Hora</label><input type="time" value={newEv.time} onChange={e=>setNewEv(v=>({...v,time:e.target.value}))}/></div>
            </div>
            <div className="form-group"><label>Título{newEv.type==='session'?' (opcional se escolher paciente)':' *'}</label><input value={newEv.title} onChange={e=>setNewEv(v=>({...v,title:e.target.value}))} placeholder="Descrição do evento"/></div>
            <div className="form-group"><label>Tipo</label>
              <select value={newEv.type} onChange={e=>setNewEv(v=>({...v,type:e.target.value}))}>
                <option value="session">Sessão com Paciente</option><option value="meeting">Reunião</option><option value="training">Formação</option>
              </select>
            </div>
            {newEv.type==='session'&&<div className="form-group"><label>Paciente</label><select value={newEv.patientId} onChange={e=>setNewEv(v=>({...v,patientId:e.target.value}))}><option value="">Selecionar...</option>{patients.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>}
            <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:20}}>
              <button className="btn btn-secondary" onClick={()=>setShowModal(false)}>Cancelar</button>
              <button className="btn btn-primary" onClick={addEvent}>Criar Evento</button>
            </div>
          </div>
        </div>
      )}
      {selEvent&&(
        <Modal title={selEvent.title} onClose={()=>setSelEvent(null)}>
          <div style={{fontSize:14,color:'#334155',lineHeight:1.8}}>
            <div><strong>Data:</strong> {fmtDate(selEvent.date)}{selEvent.time?` às ${selEvent.time}`:''}</div>
            <div><strong>Tipo:</strong> {selEvent.type==='session'?'Sessão com Paciente':selEvent.type==='meeting'?'Reunião':'Formação'}</div>
            {selEvent.patientId&&<div><strong>Paciente:</strong> {patients.find(p=>p.id===selEvent.patientId)?.name||'—'}</div>}
          </div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:20}}>
            <button className="btn btn-danger" onClick={()=>{if(confirm('Eliminar este evento?')){setEvents(es=>es.filter(x=>x.id!==selEvent.id));setSelEvent(null);}}}>Eliminar</button>
            <button className="btn btn-secondary" onClick={()=>setSelEvent(null)}>Fechar</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function ForumPage(){
  const {posts,setPosts,profile}=useStore();
  const me={author:profile.name,role:profile.role,avatar:'#FF6200',initials:initialsOf(profile.name.replace(/^(Dra?|Enf|Prof)\.?\s+/i,''))};
  const timeLabel=p=>p.createdAt?new Date(p.createdAt).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):p.time;
  const [showNew,setShowNew]=useState(false);
  const [reply,setReply]=useState({});
  const [newPost,setNewPost]=useState({title:'',body:''});
  const [expanded,setExpanded]=useState({});
  const submit=()=>{
    if(!newPost.title||!newPost.body) return;
    setPosts(p=>[{id:Date.now(),...me,title:newPost.title,body:newPost.body,createdAt:new Date().toISOString(),likes:0,replies:[]},...p]);
    setNewPost({title:'',body:''});setShowNew(false);
  };
  const addReply=pid=>{
    if(!reply[pid]) return;
    setPosts(ps=>ps.map(p=>p.id===pid?{...p,replies:[...p.replies,{author:me.author,initials:me.initials,avatar:me.avatar,text:reply[pid],createdAt:new Date().toISOString()}]}:p));
    setReply(r=>({...r,[pid]:''}));
  };
  return(
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div><h2 style={{fontSize:22,fontWeight:800,color:'#0f172a'}}>Fórum Clínico</h2><p style={{color:'#64748b',fontSize:14}}>{posts.length} tópicos</p></div>
        <button className="btn btn-primary" onClick={()=>setShowNew(s=>!s)}>+ Novo Tópico</button>
      </div>
      {showNew&&(
        <div className="card" style={{border:'2px solid #bfdbfe',marginBottom:16}}>
          <div className="card-title" style={{marginBottom:14}}>Criar Tópico</div>
          <div className="form-group"><label>Título</label><input value={newPost.title} onChange={e=>setNewPost(p=>({...p,title:e.target.value}))} placeholder="Título do tópico"/></div>
          <div className="form-group"><label>Conteúdo</label><textarea rows={4} value={newPost.body} onChange={e=>setNewPost(p=>({...p,body:e.target.value}))} placeholder="Descreva a sua questão..."/></div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <button className="btn btn-secondary" onClick={()=>setShowNew(false)}>Cancelar</button>
            <button className="btn btn-primary" onClick={submit}>Publicar</button>
          </div>
        </div>
      )}
      {posts.map(post=>(
        <div key={post.id} className="card" style={{marginBottom:12}}>
          <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
            <div className="avatar" style={{background:post.avatar}}>{post.initials}</div>
            <div style={{flex:1}}>
              <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8}}>
                <div><div style={{fontWeight:700,fontSize:16,marginBottom:2}}>{post.title}</div><div style={{fontSize:12,color:'#64748b'}}>{post.author} · {post.role} · {timeLabel(post)}</div></div>
                <span className="badge badge-blue" style={{fontSize:11,flexShrink:0}}>🔬 Clínico</span>
              </div>
              <p style={{margin:'10px 0',color:'#334155',fontSize:14,lineHeight:1.6}}>{post.body}</p>
              <div style={{display:'flex',gap:12}}>
                <button className="btn btn-sm btn-secondary" onClick={()=>setPosts(ps=>ps.map(p=>p.id===post.id?{...p,likes:p.likes+1}:p))}>👍 {post.likes}</button>
                <button className="btn btn-sm btn-secondary" onClick={()=>setExpanded(r=>({...r,[post.id]:!r[post.id]}))}>💬 {post.replies.length} respostas</button>
              </div>
              {expanded[post.id]&&(
                <div style={{marginTop:14,borderTop:'1px solid #f1f5f9',paddingTop:12}}>
                  {post.replies.map((r,i)=>(
                    <div key={i} style={{display:'flex',gap:10,marginBottom:10}}>
                      <div className="avatar" style={{background:r.avatar,width:30,height:30,fontSize:12}}>{r.initials}</div>
                      <div style={{flex:1,background:'#f8fafc',borderRadius:8,padding:'8px 12px'}}>
                        <div style={{fontSize:12,fontWeight:700}}>{r.author} <span style={{fontWeight:400,color:'#94a3b8'}}>· {timeLabel(r)}</span></div>
                        <div style={{fontSize:13,color:'#334155',marginTop:3}}>{r.text}</div>
                      </div>
                    </div>
                  ))}
                  <div style={{display:'flex',gap:8,marginTop:8}}>
                    <input placeholder="Escrever resposta..." value={reply[post.id]||''} onChange={e=>setReply(r=>({...r,[post.id]:e.target.value}))} style={{flex:1,padding:'7px 12px'}}/>
                    <button className="btn btn-primary btn-sm" onClick={()=>addReply(post.id)}>Responder</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function SettingsPage(){
  const store=useStore();
  const {profile,setProfile,prefs,setPrefs,patients,sessions,assessments,events,posts}=store;
  const [tab,setTab]=useState('profile');
  const [msg,setMsg]=useState(null);
  const [draft,setDraft]=useState(profile);
  const [pdraft,setPdraft]=useState(prefs);
  const fileRef=React.useRef(null);
  useEffect(()=>{setDraft(profile);},[profile]);
  useEffect(()=>{setPdraft(prefs);},[prefs]);
  const flash=(type,text)=>{setMsg({type,text});setTimeout(()=>setMsg(null),3500);};
  const saveProfile=()=>{if(!draft.name.trim()){flash('warning','O nome profissional é obrigatório.');return;}setProfile({...draft,name:draft.name.trim()});flash('success','✓ Perfil guardado!');};
  const savePrefs=()=>{setPrefs(pdraft);flash('success','✓ Definições guardadas!');};
  const P=(k,label,type='text')=><div className="form-group"><label>{label}</label><input type={type} value={draft[k]||''} onChange={e=>setDraft(d=>({...d,[k]:e.target.value}))}/></div>;
  const Toggle=(k,label)=>(
    <div key={k} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 0',borderBottom:'1px solid #f1f5f9'}}>
      <span style={{fontSize:14,color:'#334155'}}>{label}</span>
      <input type="checkbox" checked={!!pdraft[k]} onChange={e=>setPdraft(d=>({...d,[k]:e.target.checked}))} style={{width:'auto',transform:'scale(1.3)'}}/>
    </div>
  );
  const doExport=()=>{downloadJSON(store.exportData(),`age-in-move-backup-${todayISO()}.json`);flash('success','✓ Backup descarregado.');};
  const doImport=e=>{
    const file=e.target.files&&e.target.files[0]; e.target.value='';
    if(!file) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const json=JSON.parse(r.result);
        const n=(json.data&&json.data.patients||[]).length;
        if(!confirm(`Importar este backup (${n} pacientes)? Os dados atuais neste browser serão substituídos.`)) return;
        store.importData(json);flash('success','✓ Backup importado com sucesso.');
      }catch(err){flash('warning','Não foi possível importar: '+err.message);}
    };
    r.readAsText(file);
  };
  return(
    <div className="page" style={{maxWidth:760}}>
      <h2 style={{fontSize:22,fontWeight:800,color:'#0f172a',marginBottom:4}}>Definições</h2>
      <p style={{color:'#64748b',fontSize:14,marginBottom:20}}>Gerir perfil, notificações, preferências clínicas e dados</p>
      <div className="tab-bar">
        {[['profile','Perfil'],['clinical','Clínico'],['notifications','Notificações'],['data','Dados & Backup'],['security','Segurança']].map(([id,l])=>(
          <div key={id} className={`tab${tab===id?' active':''}`} onClick={()=>setTab(id)}>{l}</div>
        ))}
      </div>
      {msg&&<div className={`alert alert-${msg.type}`}>{msg.text}</div>}
      {tab==='profile'&&(
        <div className="card">
          <div style={{display:'flex',gap:16,alignItems:'center',marginBottom:20,padding:'0 0 16px',borderBottom:'1px solid #f1f5f9'}}>
            <div className="avatar" style={{background:'#FF6200',width:64,height:64,fontSize:22}}>{initialsOf(profile.name.replace(/^(Dra?|Enf|Prof)\.?\s+/i,''))}</div>
            <div><div style={{fontWeight:700,fontSize:16}}>{profile.name}</div><div style={{color:'#64748b',fontSize:13}}>{profile.role} · {profile.license}</div></div>
          </div>
          <div className="grid-2">
            {P('name','Nome Profissional *')}
            {P('role','Profissão')}
            {P('license','Nº Cédula')}
            {P('email','Email','email')}
            {P('phone','Telefone')}
            {P('specialty','Especialidade')}
            {P('institution','Instituição')}
          </div>
          <button className="btn btn-primary" onClick={saveProfile}>Guardar Alterações</button>
        </div>
      )}
      {tab==='clinical'&&(
        <div className="card">
          <div className="card-title" style={{marginBottom:16}}>Preferências Clínicas</div>
          <div className="grid-2">
            <div className="form-group"><label>Duração padrão da sessão</label><select value={pdraft.duration} onChange={e=>setPdraft(d=>({...d,duration:e.target.value}))}><option value="30">30 min</option><option value="45">45 min</option><option value="60">60 min</option></select></div>
            <div className="form-group"><label>Escala preferida</label><select value={pdraft.scale} onChange={e=>setPdraft(d=>({...d,scale:e.target.value}))}><option value="mmse">MMSE</option><option value="moca">MoCA</option><option value="both">Ambas</option></select></div>
          </div>
          {Toggle('reminders','Recordatórios automáticos de sessões')}
          {Toggle('declineAlerts','Alertas de declínio cognitivo')}
          {Toggle('monthlyReports','Relatórios mensais automáticos')}
          <button className="btn btn-primary" style={{marginTop:16}} onClick={savePrefs}>Guardar</button>
        </div>
      )}
      {tab==='notifications'&&(
        <div className="card">
          <div className="card-title" style={{marginBottom:16}}>Notificações</div>
          {Toggle('nSessions','Sessões agendadas')}
          {Toggle('nRisk','Alertas de pacientes em risco')}
          {Toggle('nForum','Mensagens do fórum')}
          {Toggle('nUpdates','Atualizações da plataforma')}
          <button className="btn btn-primary" style={{marginTop:16}} onClick={savePrefs}>Guardar</button>
        </div>
      )}
      {tab==='data'&&(
        <div>
          <div className="card">
            <div className="card-title" style={{marginBottom:8}}>Dados guardados neste browser</div>
            <p style={{fontSize:13,color:'#64748b',marginBottom:14}}>Tudo o que regista fica guardado automaticamente neste browser, neste computador. Não é enviado para nenhum servidor.</p>
            <div className="grid-4" style={{marginBottom:6}}>
              {[['Pacientes',patients.length],['Sessões',sessions.length],['Avaliações',assessments.length],['Eventos',events.length]].map(([l,v])=>(
                <div key={l} style={{textAlign:'center',padding:12,background:'#f8fafc',borderRadius:8,border:'1px solid #e2e8f0'}}><div style={{fontSize:24,fontWeight:800}}>{v}</div><div style={{fontSize:12,color:'#64748b'}}>{l}</div></div>
              ))}
            </div>
          </div>
          <div className="card">
            <div className="card-title" style={{marginBottom:8}}>Backup</div>
            <p style={{fontSize:13,color:'#64748b',marginBottom:14}}>Limpar o histórico do browser apaga estes dados. Descarregue um backup regularmente e guarde-o em local seguro (ex.: OneDrive). Também pode usá-lo para passar os dados para outro computador.</p>
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              <button className="btn btn-primary" onClick={doExport}>⬇ Exportar backup (JSON)</button>
              <button className="btn btn-secondary" onClick={()=>fileRef.current&&fileRef.current.click()}>⬆ Importar backup</button>
              <input ref={fileRef} type="file" accept="application/json,.json" style={{display:'none'}} onChange={doImport}/>
            </div>
          </div>
          <div className="alert alert-warning"><strong>RGPD:</strong> estes dados são de saúde (categoria especial). Use este computador apenas com conta protegida por password e guarde os ficheiros de backup de forma cifrada. Não partilhe backups por email.</div>
          <div className="card" style={{border:'1px solid #fecaca',background:'#fef2f2'}}>
            <div style={{fontWeight:700,color:'#991b1b',marginBottom:10}}>⚠️ Zona de Perigo</div>
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              <button className="btn btn-secondary btn-sm" onClick={()=>{if(confirm('Repor os dados de demonstração? Os dados atuais serão substituídos.')){store.resetDemo();flash('success','✓ Dados de demonstração repostos.');}}}>Repor dados de demonstração</button>
              <button className="btn btn-danger btn-sm" onClick={()=>{if(confirm('Apagar TODOS os pacientes, sessões, avaliações e eventos? Recomenda-se exportar um backup antes.')&&confirm('Tem a certeza? Esta ação não pode ser desfeita.')){store.clearAll();flash('success','✓ Dados apagados. Pode começar com dados reais.');}}}>Apagar todos os dados</button>
            </div>
          </div>
        </div>
      )}
      {tab==='security'&&(
        <div className="card">
          <div className="card-title" style={{marginBottom:16}}>Segurança</div>
          <div className="alert alert-info">Esta versão funciona sem servidor, por isso ainda não há contas nem passwords reais. A proteção dos dados depende do acesso ao computador.</div>
        </div>
      )}
    </div>
  );
}

function DashboardLayout({children,page,setPage,onLogout,title}){
  const {profile}=useStore();
  return(
    <div>
      <Sidebar page={page} setPage={setPage} onLogout={onLogout}/>
      <div className="main">
        <div className="topbar">
          <div className="topbar-title">{title}</div>
          <div className="topbar-actions">
            <button className="btn btn-secondary btn-sm">🔔</button>
            <button className="btn btn-secondary btn-sm">❓</button>
            <div className="avatar" style={{background:'#FF6200',cursor:'pointer'}} title="Definições" onClick={()=>setPage('settings')}>{initialsOf(profile.name.replace(/^(Dra?|Enf|Prof)\.?\s+/i,''))}</div>
          </div>
        </div>
        {children}
      </div>
    </div>
  );
}

function AppInner(){
  const {patients}=useStore();
  const [screen,setScreen]=useState('landing');
  const [page,setPage]=useState('dashboard');
  const [selectedModule,setSelectedModule]=useState(null);
  const [selectedPatientId,setSelectedPatientId]=useState(null);
  const selectedPatient=patients.find(p=>p.id===selectedPatientId)||null;
  const openPatient=id=>{setSelectedPatientId(id);setPage('patient-profile');};
  useEffect(()=>{window.scrollTo(0,0);},[page]);
  const titles={dashboard:'Dashboard',modules:'Módulos','module-detail':selectedModule?.name||'Módulo',patients:'Pacientes','patient-profile':selectedPatient?.name||'Paciente','new-patient':'Novo Paciente',calendar:'Calendário',forum:'Fórum Clínico',settings:'Definições'};
  if(screen==='landing') return <LandingPage onEnter={()=>setScreen('auth')}/>;
  if(screen==='auth') return <AuthPage onLogin={()=>setScreen('dashboard')}/>;
  return(
    <DashboardLayout page={page} setPage={setPage} onLogout={()=>setScreen('landing')} title={titles[page]||'Age in Move'}>
      {page==='dashboard'&&<DashboardHome setPage={setPage} openPatient={openPatient}/>}
      {page==='modules'&&<ModulesPage setPage={setPage} setSelectedModule={setSelectedModule}/>}
      {page==='module-detail'&&selectedModule&&<ModuleDetail mod={selectedModule} setPage={setPage}/>}
      {page==='patients'&&<PatientsPage setPage={setPage} openPatient={openPatient}/>}
      {page==='patient-profile'&&(selectedPatient?<PatientProfile key={selectedPatient.id} patient={selectedPatient} setPage={setPage}/>:<PatientsPage setPage={setPage} openPatient={openPatient}/>)}
      {page==='new-patient'&&<NewPatientPage setPage={setPage} openPatient={openPatient}/>}
      {page==='calendar'&&<CalendarPage/>}
      {page==='forum'&&<ForumPage/>}
      {page==='settings'&&<SettingsPage/>}
    </DashboardLayout>
  );
}

function App(){
  return <StoreProvider><AppInner/></StoreProvider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
